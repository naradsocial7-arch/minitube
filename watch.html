<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Watch</title>

<style>

/* =====================================
   RESET
   ===================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:90px;
}


/* =====================================
   HEADER
   ===================================== */

header{
  position:sticky;
  top:0;
  z-index:100;

  height:64px;

  background:rgba(17,17,17,.96);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  padding:0 16px;

  gap:14px;
}

.back{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:none;
  border:0;

  color:white;

  font-size:32px;
  line-height:1;

  cursor:pointer;

  border-radius:50%;
}

.back:hover{
  background:#292929;
}

.logo{
  font-size:23px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.spacer{
  flex:1;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;
}


/* =====================================
   MAIN
   ===================================== */

.main{
  width:100%;
  max-width:1100px;

  margin:0 auto;

  padding:20px;
}


/* =====================================
   VIDEO
   ===================================== */

.videoBox{
  width:100%;

  background:#000;

  border-radius:14px;

  overflow:hidden;

  position:relative;
}

.videoBox video{
  width:100%;

  display:block;

  max-height:72vh;

  background:#000;

  object-fit:contain;
}


/* =====================================
   VIDEO TITLE
   ===================================== */

.title{
  font-size:24px;

  font-weight:700;

  line-height:1.35;

  margin-top:18px;

  word-break:break-word;
}

.meta{
  color:#999;

  font-size:14px;

  margin-top:8px;
}


/* =====================================
   ACTIONS
   ===================================== */

.actions{
  display:flex;

  align-items:center;

  gap:10px;

  margin-top:16px;

  flex-wrap:wrap;
}

.saveModalOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:200;
  align-items:flex-end;
  justify-content:center;
}

.saveModalOverlay.show{
  display:flex;
}

.saveModal{
  width:100%;
  max-width:480px;
  background:#181818;
  border-radius:20px 20px 0 0;
  padding:20px;
  max-height:70vh;
  overflow-y:auto;
}

.saveModalTitle{
  font-size:17px;
  font-weight:bold;
  margin-bottom:14px;
}

.playlistCheckRow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  cursor:pointer;
}

.playlistCheckRow input{
  width:20px;
  height:20px;
  flex-shrink:0;
}

.playlistCheckName{
  flex:1;
  font-size:15px;
  word-break:break-word;
}

.playlistCheckCount{
  color:#999;
  font-size:12px;
}

.newPlaylistRow{
  display:flex;
  gap:8px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid #292929;
}

.newPlaylistInput{
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:20px;
  padding:10px 15px;
  color:white;
  font-size:14px;
  outline:none;
}

.newPlaylistButton{
  background:#ff0033;
  border:0;
  color:white;
  border-radius:20px;
  padding:10px 16px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.saveModalDone{
  width:100%;
  margin-top:16px;
  background:#292929;
  border:0;
  color:white;
  border-radius:10px;
  padding:13px;
  font-weight:bold;
  cursor:pointer;
}


.actionButton{
  background:#292929;

  border:0;

  color:white;

  border-radius:22px;

  padding:10px 17px;

  cursor:pointer;

  font-size:14px;

  font-weight:600;

  transition:.2s;
}

.actionButton:hover{
  background:#3a3a3a;
}

.actionButton:active{
  transform:scale(.96);
}

.actionButton.liked{
  color:#ff0033;
}

.subscribeButton{
  background:white;

  color:#111;

  border:0;

  border-radius:22px;

  padding:10px 18px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.subscribeButton:hover{
  opacity:.9;
}

.subscribeButton:active{
  transform:scale(.96);
}

.subscribeButton.subscribed{
  background:#292929;

  color:white;

  border:1px solid #555;
}


/* =====================================
   CHANNEL
   ===================================== */

.channel{
  margin-top:20px;

  padding:16px;

  background:#181818;

  border-radius:14px;

  display:flex;

  align-items:center;

  gap:13px;
}

.channelAvatar{
  width:50px;
  height:50px;

  flex-shrink:0;

  border-radius:50%;

  background:#7c4dff;

  display:grid;

  place-items:center;

  font-weight:bold;

  font-size:18px;

  cursor:pointer;
}

.channelInfo{
  flex:1;

  min-width:0;

  cursor:pointer;
}

.channelName{
  font-weight:bold;

  font-size:16px;
}

.channelText{
  color:#999;

  font-size:13px;

  margin-top:5px;
}

.channelSubscribe{
  background:white;

  color:#111;

  border:0;

  border-radius:20px;

  padding:9px 15px;

  font-weight:bold;

  cursor:pointer;
}


/* =====================================
   COMMENTS
   ===================================== */

.comments{
  margin-top:32px;
}

.commentsTitle{
  font-size:22px;

  font-weight:bold;

  margin-bottom:15px;
}

.commentForm{
  background:#181818;

  border-radius:14px;

  padding:15px;
}

.commentInput{
  width:100%;

  min-height:90px;

  resize:vertical;

  background:#222;

  border:1px solid #444;

  border-radius:10px;

  padding:12px;

  color:white;

  font-family:Arial,sans-serif;

  font-size:15px;

  line-height:1.5;

  outline:none;
}

.commentInput:focus{
  border-color:#777;
}

.commentInput::placeholder{
  color:#777;
}

.commentBottom{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:10px;

  gap:10px;
}

.commentName{
  color:#999;

  font-size:13px;
}

.postButton{
  background:#ff0033;

  color:white;

  border:0;

  border-radius:22px;

  padding:10px 18px;

  font-weight:bold;

  cursor:pointer;
}

.postButton:active{
  transform:scale(.96);
}

.commentList{
  margin-top:18px;
}

.comment{
  background:#181818;

  border-radius:12px;

  padding:14px;

  margin-bottom:10px;
}

.commentTop{
  display:flex;

  align-items:center;

  gap:9px;
}

.commentAvatar{
  width:36px;
  height:36px;

  flex-shrink:0;

  border-radius:50%;

  background:#7c4dff;

  display:grid;

  place-items:center;

  font-size:13px;

  font-weight:bold;
}

.commentAuthor{
  font-weight:bold;

  font-size:14px;
}

.commentDate{
  color:#777;

  font-size:12px;

  margin-top:2px;
}

.commentText{
  margin-top:10px;

  color:#ddd;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.commentActions{
  margin-top:10px;
}

.deleteComment{
  background:none;

  border:0;

  color:#ff4964;

  padding:0;

  cursor:pointer;

  font-size:13px;
}

.noComments{
  color:#888;

  text-align:center;

  padding:28px 15px;
}


/* =====================================
   LOADING
   ===================================== */

.loading{
  color:#999;

  padding:25px;

  text-align:center;
}


/* =====================================
   ERROR
   ===================================== */

.errorBox{
  background:#181818;

  border:1px solid #292929;

  border-radius:14px;

  padding:40px 20px;

  text-align:center;

  margin-top:20px;
}

.errorIcon{
  font-size:42px;

  margin-bottom:12px;
}

.errorBox h2{
  margin:0 0 8px;
}

.errorBox p{
  color:#999;

  margin:0;
}


/* =====================================
   BOTTOM NAV
   ===================================== */

.bottom{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:200;
}

.bottom button{
  min-width:55px;

  background:none;

  border:0;

  color:#aaa;

  font-size:12px;

  cursor:pointer;

  padding:5px;
}

.bottom button b{
  display:block;

  font-size:22px;

  color:white;

  margin-bottom:3px;
}

.bottom button.active{
  color:white;
}


/* =====================================
   DESKTOP
   ===================================== */

@media(min-width:900px){

  .main{
    padding-top:25px;
  }

}


/* =====================================
   MOBILE
   ===================================== */

@media(max-width:600px){

  header{
    padding:0 12px;
  }

  .logo{
    font-size:21px;
  }

  .main{
    padding:12px;
  }

  .videoBox{
    border-radius:10px;
  }

  .videoBox video{
    max-height:65vh;
  }

  .title{
    font-size:20px;
  }

  .channel{
    padding:14px;
  }

  .channelSubscribe{
    display:none;
  }

  .commentBottom{
    align-items:flex-end;
  }

  .commentName{
    max-width:55%;
    line-height:1.3;
  }

}


/* =====================================
   SMALL MOBILE
   ===================================== */

@media(max-width:380px){

  .bottom button{
    font-size:11px;
  }

  .bottom button b{
    font-size:20px;
  }

  .actionButton{
    padding:9px 13px;
  }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
     ===================================== -->

<header>

  <button
    class="back"
    onclick="goBack()"
    aria-label="Back"
  >
    ‹
  </button>


  <div class="logo">

    <span>▶</span>
    MiniTube

  </div>


  <div class="spacer"></div>


  <div
    class="avatar"
    id="headerAvatar"
  >
    M
  </div>

</header>


<!-- =====================================
     MAIN
     ===================================== -->

<main class="main">


  <!-- VIDEO -->

  <div class="videoBox">

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>


  <!-- TITLE -->

  <div
    id="videoTitle"
    class="title"
  >
    Loading video...
  </div>


  <!-- META -->

  <div class="meta">

    <span id="viewCount">
      0
    </span>

    views

  </div>


  <!-- ACTIONS -->

  <div class="actions">


    <button
      id="likeButton"
      class="actionButton"
      onclick="toggleLike()"
    >
      ♡ Like 0
    </button>


    <button
      class="actionButton"
      onclick="shareVideo()"
    >
      ↗ Share
    </button>


    <button
      class="actionButton"
      onclick="openSaveModal()"
    >
      ⊕ Save
    </button>


    <button
      id="subscribeButton"
      class="subscribeButton"
      onclick="toggleSubscribe()"
    >
      Subscribe
    </button>


  </div>


  <!-- SAVE TO PLAYLIST MODAL -->

  <div
    id="saveModalOverlay"
    class="saveModalOverlay"
    onclick="closeSaveModalOnOverlay(event)"
  >

    <div class="saveModal">

      <div class="saveModalTitle">
        Save video to...
      </div>

      <div id="playlistCheckList"></div>

      <div class="newPlaylistRow">

        <input
          id="newPlaylistName"
          class="newPlaylistInput"
          placeholder="Create new playlist"
          onkeydown="if(event.key==='Enter'){createPlaylistFromModal();}"
        >

        <button
          class="newPlaylistButton"
          onclick="createPlaylistFromModal()"
        >
          Create
        </button>

      </div>

      <button
        class="saveModalDone"
        onclick="closeSaveModal()"
      >
        Done
      </button>

    </div>

  </div>


  <!-- CHANNEL -->

  <div class="channel">


    <div
      class="channelAvatar"
      id="channelAvatar"
      onclick="window.location.href='channel.html'"
    >
      M
    </div>


    <div
      class="channelInfo"
      onclick="window.location.href='channel.html'"
    >


      <div
        class="channelName"
        id="channelName"
      >
        My Channel
      </div>


      <div class="channelText">
        Your MiniTube creator channel
      </div>


    </div>


    <button
      id="channelSubscribe"
      class="channelSubscribe"
      onclick="toggleSubscribe()"
    >
      Subscribe
    </button>


  </div>


  <!-- COMMENTS -->

  <section class="comments">


    <div class="commentsTitle">

      Comments
      <span id="commentCount">
        0
      </span>

    </div>


    <div class="commentForm">


      <textarea
        id="commentInput"
        class="commentInput"
        placeholder="Add a comment..."
        maxlength="500"
      ></textarea>


      <div class="commentBottom">


        <div
          class="commentName"
          id="commentName"
        >
          Commenting as Main Player
        </div>


        <button
          class="postButton"
          onclick="postComment()"
        >
          Post Comment
        </button>


      </div>


    </div>


    <div
      id="commentList"
      class="commentList"
    ></div>


  </section>


</main>


<!-- =====================================
     BOTTOM NAV
     ===================================== -->

<nav class="bottom">


  <button onclick="goHome()">

    <b>⌂</b>
    Home

  </button>


  <button onclick="goShorts()">

    <b>▭</b>
    Clips

  </button>


  <button onclick="goHome()">

    <b>＋</b>
    Create

  </button>


  <button onclick="goSubscriptions()">

    <b>□</b>
    Subscriptions

  </button>


  <button onclick="goYou()">

    <b>●</b>
    You

  </button>


</nav>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   VIDEO NAME
   ===================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const videoName =
  params.get("video");


/* =====================================
   STORAGE KEYS
   ===================================== */

const safeVideoName =
  videoName || "";


const commentKey =
  "minitube_comments_" +
  safeVideoName;


const likeKey =
  "likes_" +
  safeVideoName;


const likedKey =
  "liked_" +
  safeVideoName;


const viewKey =
  "views_" +
  safeVideoName;


const viewedKey =
  "viewed_" +
  safeVideoName;


const subscribeKey =
  "minitube_my_channel_subscribed";


/* =====================================
   ELEMENTS
   ===================================== */

const player =
  document.getElementById(
    "videoPlayer"
  );


const title =
  document.getElementById(
    "videoTitle"
  );


const viewCount =
  document.getElementById(
    "viewCount"
  );


const likeButton =
  document.getElementById(
    "likeButton"
  );


const subscribeButton =
  document.getElementById(
    "subscribeButton"
  );


const channelSubscribe =
  document.getElementById(
    "channelSubscribe"
  );


const commentInput =
  document.getElementById(
    "commentInput"
  );


/* =====================================
   START
   ===================================== */

initialize();


function initialize(){

  loadProfile();

  updateLike();

  updateSubscribe();

  loadComments();

  loadVideo();

}


/* =====================================
   PROFILE
   ===================================== */

function loadProfile(){

  /*
    If later you add real login,
    these localStorage values can be
    filled from your login system.
  */

  const storedName =
    localStorage.getItem(
      "minitube_username"
    );


  const storedAvatar =
    localStorage.getItem(
      "minitube_avatar_letter"
    );


  if(storedName){

    document.getElementById(
      "commentName"
    ).textContent =
      "Commenting as " +
      storedName;

  }


  if(storedAvatar){

    document.getElementById(
      "headerAvatar"
    ).textContent =
      storedAvatar;


    document.getElementById(
      "channelAvatar"
    ).textContent =
      storedAvatar;

  }

}


/* =====================================
   AUTOPLAY SETTING
   (set from settings.html)
   ===================================== */

const AUTOPLAY_KEY =
  "minitube_autoplay";


function isAutoplayOn(){

  const value =
    localStorage.getItem(
      AUTOPLAY_KEY
    );


  return value === null
    ? true
    : value === "true";

}


/* =====================================
   PLAYLISTS
   ===================================== */

const PLAYLIST_KEY =
  "minitube_playlists";


function getPlaylists(){

  try{

    const saved =
      localStorage.getItem(
        PLAYLIST_KEY
      );

    const list =
      saved
        ? JSON.parse(saved)
        : [];


    /*
      Always make sure the
      built-in "Watch Later"
      playlist exists.
    */

    if(
      !list.some(
        p => p.id === "watch-later"
      )
    ){

      list.unshift({
        id: "watch-later",
        name: "Watch Later",
        builtIn: true,
        createdAt: Date.now(),
        videoNames: []
      });

    }


    return list;

  }catch(error){

    return [
      {
        id: "watch-later",
        name: "Watch Later",
        builtIn: true,
        createdAt: Date.now(),
        videoNames: []
      }
    ];

  }

}


function savePlaylists(list){

  localStorage.setItem(
    PLAYLIST_KEY,
    JSON.stringify(list)
  );

}


function openSaveModal(){

  renderPlaylistCheckList();

  document
    .getElementById(
      "saveModalOverlay"
    )
    .classList.add(
      "show"
    );

}


function closeSaveModal(){

  document
    .getElementById(
      "saveModalOverlay"
    )
    .classList.remove(
      "show"
    );

}


function closeSaveModalOnOverlay(event){

  if(event.target.id === "saveModalOverlay"){

    closeSaveModal();

  }

}


function renderPlaylistCheckList(){

  const container =
    document.getElementById(
      "playlistCheckList"
    );

  const playlists =
    getPlaylists();


  container.innerHTML =
    "";


  playlists.forEach(playlist => {

    const row =
      document.createElement(
        "label"
      );

    row.className =
      "playlistCheckRow";


    const checked =
      playlist.videoNames.includes(
        videoName
      );


    row.innerHTML = `

      <input
        type="checkbox"
        ${checked ? "checked" : ""}
      >

      <div class="playlistCheckName">
        ${escapeHTML(playlist.name)}
      </div>

      <div class="playlistCheckCount">
        ${playlist.videoNames.length}
      </div>

    `;


    row.querySelector(
      "input"
    ).addEventListener(
      "change",
      function(event){

        togglePlaylistVideo(
          playlist.id,
          event.target.checked
        );

      }
    );


    container.appendChild(
      row
    );

  });

}


function togglePlaylistVideo(playlistId, add){

  const playlists =
    getPlaylists();


  const playlist =
    playlists.find(
      p => p.id === playlistId
    );


  if(!playlist){

    return;

  }


  if(add){

    if(
      !playlist.videoNames.includes(
        videoName
      )
    ){

      playlist.videoNames.unshift(
        videoName
      );

    }

  }else{

    playlist.videoNames =
      playlist.videoNames.filter(
        name => name !== videoName
      );

  }


  savePlaylists(
    playlists
  );


  renderPlaylistCheckList();

}


function createPlaylistFromModal(){

  const input =
    document.getElementById(
      "newPlaylistName"
    );

  const name =
    input.value.trim();


  if(!name){

    return;

  }


  const playlists =
    getPlaylists();


  playlists.push({
    id: "pl_" + Date.now(),
    name: name,
    builtIn: false,
    createdAt: Date.now(),
    videoNames: [videoName]
  });


  savePlaylists(
    playlists
  );


  input.value =
    "";


  renderPlaylistCheckList();

}


/* =====================================
   WATCH HISTORY
   ===================================== */

const HISTORY_KEY =
  "minitube_watch_history";

const MAX_HISTORY =
  100;


function getHistory(){

  try{

    const saved =
      localStorage.getItem(
        HISTORY_KEY
      );

    return saved
      ? JSON.parse(saved)
      : [];

  }catch(error){

    return [];

  }

}


function recordHistory(){

  if(!videoName){

    return;

  }


  let history =
    getHistory();


  /*
    Remove any existing entry
    for this video, then add it
    fresh to the front, so the
    most recently watched video
    is always first.
  */

  history =
    history.filter(
      entry => entry.name !== videoName
    );


  history.unshift({
    name: videoName,
    watchedAt: Date.now()
  });


  history =
    history.slice(
      0,
      MAX_HISTORY
    );


  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

}


/* =====================================
   LOAD VIDEO
   ===================================== */

function loadVideo(){

  if(!videoName){

    showVideoError(
      "Video not found",
      "The video link is missing or invalid."
    );

    return;

  }


  const videoURL =
    API_BASE +
    "/video/" +
    encodeURIComponent(
      videoName
    );


  player.src =
    videoURL;


  title.textContent =
    videoName;


  recordHistory();


  updateViews();


  /*
    Count a view only once per browser
    after watching for 3 seconds.
  */

  setupViewCounter();


  /*
    Try autoplay, unless the
    user turned it off in
    Settings.
  */

  if(isAutoplayOn()){

    player.play()
      .catch(
        () => {}
      );

  }


  /*
    If the video fails to load
    (deleted, wrong name, network),
    show a friendly error instead
    of a blank black box.
  */

  player.addEventListener(
    "error",
    function(){

      showVideoError(
        "This video isn't available",
        "It may have been removed, or the link is broken."
      );

    }
  );

}


/* =====================================
   VIDEO ERROR
   ===================================== */

function showVideoError(
  heading,
  message
){

  title.textContent =
    heading;


  document.querySelector(
    ".videoBox"
  ).innerHTML = `

    <div class="errorBox">

      <div class="errorIcon">
        ⚠️
      </div>

      <h2>
        ${escapeHTML(heading)}
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

    </div>

  `;

}


/* =====================================
   VIEW COUNTER
   ===================================== */

function updateViews(){

  const count =
    Number(
      localStorage.getItem(
        viewKey
      ) || 0
    );


  viewCount.textContent =
    formatNumber(count);

}


function setupViewCounter(){

  let counted =
    localStorage.getItem(
      viewedKey
    ) === "true";


  if(counted){
    return;
  }


  let timer = null;


  player.addEventListener(
    "play",
    function(){

      if(counted){
        return;
      }


      clearTimeout(timer);


      timer =
        setTimeout(
          function(){

            let views =
              Number(
                localStorage.getItem(
                  viewKey
                ) || 0
              );


            views++;


            localStorage.setItem(
              viewKey,
              String(views)
            );


            localStorage.setItem(
              viewedKey,
              "true"
            );


            viewCount.textContent =
              formatNumber(views);


            counted = true;


          },
          3000
        );

    }
  );


  player.addEventListener(
    "pause",
    function(){

      clearTimeout(timer);

    }
  );


  player.addEventListener(
    "ended",
    function(){

      clearTimeout(timer);

    }
  );

}


/* =====================================
   LIKE SYSTEM
   ===================================== */

function toggleLike(){

  let liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  let likes =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );


  liked =
    !liked;


  if(liked){

    likes++;

  }else{

    if(likes > 0){

      likes--;

    }

  }


  localStorage.setItem(
    likedKey,
    String(liked)
  );


  localStorage.setItem(
    likeKey,
    String(likes)
  );


  updateLike();

}


function updateLike(){

  const liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  const likes =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );


  likeButton.textContent =
    (liked ? "♥" : "♡") +
    " Like " +
    formatNumber(likes);


  likeButton.classList.toggle(
    "liked",
    liked
  );

}


/* =====================================
   SUBSCRIBE SYSTEM
   ===================================== */

function toggleSubscribe(){

  const current =
    localStorage.getItem(
      subscribeKey
    ) === "true";


  localStorage.setItem(
    subscribeKey,
    String(!current)
  );


  updateSubscribe();

}


function updateSubscribe(){

  const subscribed =
    localStorage.getItem(
      subscribeKey
    ) === "true";


  subscribeButton.textContent =
    subscribed
      ? "Subscribed"
      : "Subscribe";


  channelSubscribe.textContent =
    subscribed
      ? "Subscribed"
      : "Subscribe";


  subscribeButton.classList.toggle(
    "subscribed",
    subscribed
  );


  if(subscribed){

    channelSubscribe.style.background =
      "#292929";

    channelSubscribe.style.color =
      "white";

    channelSubscribe.style.border =
      "1px solid #555";

  }else{

    channelSubscribe.style.background =
      "white";

    channelSubscribe.style.color =
      "#111";

    channelSubscribe.style.border =
      "0";

  }

}


/* =====================================
   COMMENTS
   ===================================== */

function getComments(){

  try{

    const saved =
      localStorage.getItem(
        commentKey
      );


    if(!saved){
      return [];
    }


    const parsed =
      JSON.parse(saved);


    return Array.isArray(parsed)
      ? parsed
      : [];


  }catch(error){

    console.error(error);

    return [];

  }

}


/* =====================================
   POST COMMENT
   ===================================== */

function postComment(){

  const text =
    commentInput.value.trim();


  if(!text){

    alert(
      "Please write a comment first."
    );

    commentInput.focus();

    return;

  }


  const comments =
    getComments();


  const author =
    localStorage.getItem(
      "minitube_username"
    ) ||
    "Main Player";


  comments.unshift({

    id:
      Date.now(),

    author:
      author,

    text:
      text,

    date:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    commentKey,
    JSON.stringify(
      comments
    )
  );


  commentInput.value =
    "";


  renderComments();

}


/* =====================================
   LOAD COMMENTS
   ===================================== */

function loadComments(){

  renderComments();

}


/* =====================================
   DISPLAY COMMENTS
   ===================================== */

function renderComments(){

  const container =
    document.getElementById(
      "commentList"
    );


  const count =
    document.getElementById(
      "commentCount"
    );


  const comments =
    getComments();


  count.textContent =
    formatNumber(
      comments.length
    );


  if(comments.length === 0){

    container.innerHTML = `

      <div class="noComments">

        No comments yet.
        Be the first to comment! 💬

      </div>

    `;

    return;

  }


  container.innerHTML =
    "";


  comments.forEach(
    function(comment){

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "comment";


      const author =
        escapeHTML(
          comment.author
        );


      const text =
        escapeHTML(
          comment.text
        );


      const initial =
        (comment.author || "M")
          .trim()
          .charAt(0)
          .toUpperCase() || "M";


      element.innerHTML = `

        <div class="commentTop">

          <div class="commentAvatar">
            ${initial}
          </div>

          <div>

            <div class="commentAuthor">
              ${author}
            </div>

            <div class="commentDate">
              ${escapeHTML(comment.date || "")}
            </div>

          </div>

        </div>


        <div class="commentText">
          ${text}
        </div>


        <div class="commentActions">
          <button class="deleteComment">
            Delete
          </button>
        </div>

      `;


      const deleteButton =
        element.querySelector(
          ".deleteComment"
        );


      deleteButton.addEventListener(
        "click",
        function(){

          deleteComment(
            comment.id
          );

        }
      );


      container.appendChild(
        element
      );

    }
  );

}


/* =====================================
   DELETE COMMENT
   ===================================== */

function deleteComment(id){

  if(
    !confirm(
      "Delete this comment?"
    )
  ){

    return;

  }


  const comments =
    getComments().filter(
      comment => comment.id !== id
    );


  localStorage.setItem(
    commentKey,
    JSON.stringify(
      comments
    )
  );


  renderComments();

}


/* =====================================
   SHARE
   ===================================== */

function shareVideo(){

  const url =
    window.location.href;


  if(navigator.share){

    navigator.share({
      title: videoName || "MiniTube video",
      url: url
    }).catch(
      () => {}
    );

  }else if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(url)
      .then(
        () => alert(
          "Link copied to clipboard!"
        )
      )
      .catch(
        () => prompt(
          "Copy this link:",
          url
        )
      );

  }else{

    prompt(
      "Copy this link:",
      url
    );

  }

}

/* =====================================
   HELPERS
   ===================================== */

function formatNumber(num){

  if(num >= 1000000){

    return (
      (num / 1000000)
        .toFixed(1)
        .replace(/\.0$/, "")
      + "M"
    );

  }


  if(num >= 1000){

    return (
      (num / 1000)
        .toFixed(1)
        .replace(/\.0$/, "")
      + "K"
    );

  }


  return String(num);

}


function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
