<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Watch</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:20;

  height:64px;

  background:#111;
  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  padding:0 16px;
  gap:14px;
}

.back{
  background:none;
  border:0;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#ff0033;
}

.spacer{
  flex:1;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;
  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;
}


/* =========================
   MAIN
   ========================= */

.main{
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}


/* =========================
   VIDEO
   ========================= */

.videoBox{
  width:100%;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}

.videoBox video{
  width:100%;
  display:block;
  max-height:70vh;
  background:#000;
}


/* =========================
   VIDEO INFO
   ========================= */

.title{
  font-size:24px;
  font-weight:bold;
  margin-top:18px;
  word-break:break-word;
}

.meta{
  color:#999;
  font-size:14px;
  margin-top:8px;
}

.actions{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:15px;
  flex-wrap:wrap;
}

.actionButton{
  background:#292929;
  border:0;
  color:white;
  border-radius:22px;
  padding:10px 16px;
  cursor:pointer;
  font-size:15px;
}

.actionButton.liked{
  color:#ff0033;
}

.subscribeButton{
  background:white;
  color:#111;
  border:0;
  border-radius:22px;
  padding:10px 17px;
  font-weight:bold;
  cursor:pointer;
}

.subscribeButton.subscribed{
  background:#292929;
  color:white;
  border:1px solid #555;
}


/* =========================
   CHANNEL
   ========================= */

.channel{
  margin-top:18px;
  padding:15px;

  background:#181818;
  border-radius:14px;

  display:flex;
  align-items:center;
  gap:12px;
}

.channelAvatar{
  width:48px;
  height:48px;

  border-radius:50%;
  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;
}

.channelInfo{
  flex:1;
}

.channelName{
  font-weight:bold;
}

.channelText{
  color:#999;
  font-size:13px;
  margin-top:4px;
}


/* =========================
   COMMENTS
   ========================= */

.comments{
  margin-top:30px;
}

.commentsTitle{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.commentForm{
  background:#181818;
  border-radius:14px;
  padding:15px;
}

.commentInput{
  width:100%;

  min-height:80px;

  resize:vertical;

  background:#222;
  border:1px solid #444;

  border-radius:10px;

  padding:12px;

  color:white;

  font-family:Arial,sans-serif;
  font-size:15px;

  outline:none;
}

.commentInput:focus{
  border-color:#777;
}

.commentBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:10px;

  gap:10px;
}

.commentName{
  color:#999;
  font-size:13px;
}

.postButton{
  background:#ff0033;
  color:white;

  border:0;

  border-radius:22px;

  padding:10px 18px;

  font-weight:bold;

  cursor:pointer;
}

.commentList{
  margin-top:18px;
}

.comment{
  background:#181818;

  border-radius:12px;

  padding:14px;

  margin-bottom:10px;
}

.commentTop{
  display:flex;
  align-items:center;
  gap:9px;
}

.commentAvatar{
  width:34px;
  height:34px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-size:13px;

  font-weight:bold;
}

.commentAuthor{
  font-weight:bold;
}

.commentDate{
  color:#777;
  font-size:12px;
}

.commentText{
  margin-top:9px;

  color:#ddd;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;
}

.commentActions{
  margin-top:10px;
}

.deleteComment{
  background:none;
  border:0;

  color:#ff4964;

  padding:0;

  cursor:pointer;

  font-size:13px;
}

.noComments{
  color:#888;
  text-align:center;
  padding:25px;
}


/* =========================
   BOTTOM
   ========================= */

.bottom{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;
  align-items:center;

  z-index:30;
}

.bottom button{
  background:none;
  border:0;

  color:#aaa;

  font-size:13px;

  cursor:pointer;
}

.bottom button b{
  display:block;

  font-size:22px;

  color:white;

  margin-bottom:3px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .main{
    padding:14px;
  }

  .title{
    font-size:20px;
  }

  .videoBox{
    border-radius:10px;
  }

  .commentBottom{
    align-items:flex-end;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <button
    class="back"
    onclick="goHome()"
  >
    ‹
  </button>

  <div class="logo">
    <span>▶</span> MiniTube
  </div>

  <div class="spacer"></div>

  <div class="avatar">
    M
  </div>

</header>


<!-- =========================
     MAIN
     ========================= -->

<main class="main">


  <!-- VIDEO -->

  <div class="videoBox">

    <video
      id="videoPlayer"
      controls
      autoplay
      playsinline
    ></video>

  </div>


  <!-- TITLE -->

  <div
    id="videoTitle"
    class="title"
  >
    Loading video...
  </div>


  <div class="meta">

    <span id="viewCount">
      0
    </span>

    views

  </div>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      id="likeButton"
      class="actionButton"
      onclick="toggleLike()"
    >
      ♡ Like
      <span id="likeCount">
        0
      </span>
    </button>


    <button
      class="actionButton"
      onclick="shareVideo()"
    >
      ↗ Share
    </button>


    <button
      id="subscribeButton"
      class="subscribeButton"
      onclick="toggleSubscribe()"
    >
      Subscribe
    </button>

  </div>


  <!-- CHANNEL -->

  <div class="channel">

    <div class="channelAvatar">
      M
    </div>

    <div class="channelInfo">

      <div class="channelName">
        My Channel
      </div>

      <div class="channelText">
        Your MiniTube creator channel
      </div>

    </div>

  </div>


  <!-- COMMENTS -->

  <section class="comments">

    <div class="commentsTitle">

      Comments
      <span id="commentCount">
        0
      </span>

    </div>


    <div class="commentForm">

      <textarea
        id="commentInput"
        class="commentInput"
        placeholder="Add a comment..."
        maxlength="500"
      ></textarea>


      <div class="commentBottom">

        <div class="commentName">
          Commenting as Main Player
        </div>


        <button
          class="postButton"
          onclick="postComment()"
        >
          Post Comment
        </button>

      </div>

    </div>


    <div
      id="commentList"
      class="commentList"
    ></div>

  </section>


</main>


<!-- =========================
     BOTTOM NAV
     ========================= -->

<div class="bottom">

  <button onclick="goHome()">
    <b>⌂</b>
    Home
  </button>


  <button onclick="goShorts()">
    <b>▶</b>
    Shorts
  </button>


  <button onclick="goHome()">
    <b>＋</b>
    Create
  </button>


  <button onclick="goSubscriptions()">
    <b>□</b>
    Subscriptions
  </button>


  <button onclick="goYou()">
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   VIDEO NAME
   ===================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const videoName =
  params.get("video");


/* =====================================
   LOCAL STORAGE KEYS
   ===================================== */

const commentKey =
  "minitube_comments_" +
  (videoName || "");


const likeKey =
  "likes_" +
  (videoName || "");


const likedKey =
  "liked_" +
  (videoName || "");


const viewKey =
  "views_" +
  (videoName || "");


const subscribeKey =
  "minitube_my_channel_subscribed";


/* =====================================
   START
   ===================================== */

loadVideo();

loadComments();

updateLike();

updateSubscribe();


/* =====================================
   LOAD VIDEO
   ===================================== */

function loadVideo(){

  const player =
    document.getElementById(
      "videoPlayer"
    );

  const title =
    document.getElementById(
      "videoTitle"
    );


  if(!videoName){

    title.textContent =
      "Video not found";

    return;

  }


  player.src =
    API_BASE +
    "/video/" +
    encodeURIComponent(
      videoName
    );


  title.textContent =
    videoName;


  updateViews();

}


/* =====================================
   VIEWS
   ===================================== */

function updateViews(){

  const count =
    Number(
      localStorage.getItem(
        viewKey
      ) || 0
    );


  document.getElementById(
    "viewCount"
  ).textContent =
    count;

}


/* =====================================
   LIKE
   ===================================== */

function toggleLike(){

  let liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  let likes =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );


  liked =
    !liked;


  if(liked){

    likes++;

  }else{

    if(likes > 0){

      likes--;

    }

  }


  localStorage.setItem(
    likedKey,
    String(liked)
  );


  localStorage.setItem(
    likeKey,
    String(likes)
  );


  updateLike();

}


function updateLike(){

  const button =
    document.getElementById(
      "likeButton"
    );


  const count =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );


  const liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  button.textContent =
    (liked ? "♥" : "♡") +
    " Like " +
    count;


  button.classList.toggle(
    "liked",
    liked
  );

}


/* =====================================
   SUBSCRIBE
   ===================================== */

function toggleSubscribe(){

  const current =
    localStorage.getItem(
      subscribeKey
    ) === "true";


  localStorage.setItem(
    subscribeKey,
    String(!current)
  );


  updateSubscribe();

}


function updateSubscribe(){

  const button =
    document.getElementById(
      "subscribeButton"
    );


  const subscribed =
    localStorage.getItem(
      subscribeKey
    ) === "true";


  button.textContent =
    subscribed
      ? "Subscribed"
      : "Subscribe";


  button.classList.toggle(
    "subscribed",
    subscribed
  );

}


/* =====================================
   COMMENTS
   ===================================== */

function getComments(){

  try{

    return JSON.parse(
      localStorage.getItem(
        commentKey
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


/* =====================================
   POST COMMENT
   ===================================== */

function postComment(){

  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(!text){

    alert(
      "Please write a comment first."
    );

    return;

  }


  const comments =
    getComments();


  comments.unshift({

    id:
      Date.now(),

    author:
      "Main Player",

    text:
      text,

    date:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    commentKey,
    JSON.stringify(
      comments
    )
  );


  input.value = "";


  renderComments();

}


/* =====================================
   LOAD COMMENTS
   ===================================== */

function loadComments(){

  renderComments();

}


/* =====================================
   DISPLAY COMMENTS
   ===================================== */

function renderComments(){

  const container =
    document.getElementById(
      "commentList"
    );


  const count =
    document.getElementById(
      "commentCount"
    );


  const comments =
    getComments();


  count.textContent =
    comments.length;


  if(comments.length === 0){

    container.innerHTML = `

      <div class="noComments">

        No comments yet.
        Be the first to comment!

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  comments.forEach(
    function(comment){

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "comment";


      element.innerHTML = `

        <div class="commentTop">

          <div class="commentAvatar">
            M
          </div>

          <div>

            <div class="commentAuthor">

              ${escapeHTML(
                comment.author
              )}

            </div>

            <div class="commentDate">

              ${escapeHTML(
                comment.date
              )}

            </div>

          </div>

        </div>


        <div class="commentText">

          ${escapeHTML(
            comment.text
          )}

        </div>


        <div class="commentActions">

          <button
            class="deleteComment"
            onclick="deleteComment(${comment.id})"
          >
            Delete
          </button>

        </div>

      `;


      container.appendChild(
        element
      );

    }
  );

}


/* =====================================
   DELETE COMMENT
   ===================================== */

function deleteComment(id){

  const confirmed =
    confirm(
      "Delete this comment?"
    );


  if(!confirmed){

    return;

  }


  const comments =
    getComments().filter(
      function(comment){

        return comment.id !== id;

      }
    );


  localStorage.setItem(
    commentKey,
    JSON.stringify(
      comments
    )
  );


  renderComments();

}


/* =====================================
   SHARE
   ===================================== */

function shareVideo(){

  if(
    navigator.share
  ){

    navigator.share({

      title:
        videoName || "MiniTube Video",

      url:
        window.location.href

    });

  }else{

    navigator.clipboard.writeText(
      window.location.href
    );


    alert(
      "Video link copied!"
    );

  }

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   NAVIGATION
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


function goShorts(){

  window.location.href =
    "shorts.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


function goYou(){

  window.location.href =
    "you.html";

}

</script>


</body>

</html>
