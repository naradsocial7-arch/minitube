<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Login</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  margin:0;

  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #21121a 0,
      #0f0f0f 42%
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;
}


/* =====================================================
   AUTH BOX
   ===================================================== */

.box{
  width:100%;

  max-width:430px;

  background:#181818;

  border:1px solid #303030;

  border-radius:22px;

  padding:30px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo{
  text-align:center;

  font-size:29px;

  font-weight:800;

  margin-bottom:25px;

  cursor:pointer;
}

.logo span{
  color:#ff0033;
}


/* =====================================================
   TABS
   ===================================================== */

.tabs{
  display:flex;

  gap:8px;

  margin-bottom:22px;
}

.tabs button{
  flex:1;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#292929;

  color:#aaa;

  font-size:14px;

  font-weight:bold;

  cursor:pointer;

  transition:.15s;
}

.tabs button:hover{
  background:#353535;
  color:#fff;
}

.tabs button.active{
  background:#fff;
  color:#111;
}


/* =====================================================
   FORM
   ===================================================== */

.field{
  margin-bottom:16px;
}

label{
  display:block;

  color:#bbb;

  font-size:13px;

  margin-bottom:7px;
}

input{
  width:100%;

  padding:13px 14px;

  border-radius:10px;

  border:1px solid #444;

  background:#222;

  color:#fff;

  outline:none;

  font-size:16px;

  transition:.15s;
}

input::placeholder{
  color:#777;
}

input:focus{
  border-color:#ff0033;

  box-shadow:
    0 0 0 2px
    rgba(255,0,51,.12);
}


/* =====================================================
   PASSWORD
   ===================================================== */

.passwordWrap{
  position:relative;
}

.passwordWrap input{
  padding-right:70px;

  margin-bottom:0;
}

.passwordToggle{
  position:absolute;

  right:9px;

  top:50%;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  color:#aaa;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;

  padding:7px;
}

.passwordToggle:hover{
  color:#fff;
}


/* =====================================================
   MAIN BUTTON
   ===================================================== */

.mainBtn{
  width:100%;

  padding:14px;

  border:0;

  border-radius:25px;

  background:#ff0033;

  color:#fff;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.15s;

  margin-top:4px;
}

.mainBtn:hover{
  background:#e6002e;

  transform:translateY(-1px);
}

.mainBtn:disabled{
  opacity:.6;

  cursor:not-allowed;

  transform:none;
}


/* =====================================================
   SPINNER
   ===================================================== */

.spinner{
  display:inline-block;

  width:15px;
  height:15px;

  border:2px solid
    rgba(255,255,255,.35);

  border-top-color:#fff;

  border-radius:50%;

  vertical-align:-3px;

  margin-right:7px;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   MESSAGE
   ===================================================== */

.message{
  min-height:24px;

  text-align:center;

  margin-top:15px;

  color:#aaa;

  font-size:13px;

  line-height:1.5;
}

.message.success{
  color:#6ee7b7;
}

.message.error{
  color:#ff7188;
}

.message.info{
  color:#aaa;
}


/* =====================================================
   SIGNUP INFO
   ===================================================== */

.confirmBox{
  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:10px;

  background:#202020;

  border:1px solid #333;

  color:#aaa;

  font-size:13px;

  line-height:1.5;

  text-align:center;
}

.confirmBox.show{
  display:block;
}

.confirmBox strong{
  color:#fff;
}


/* =====================================================
   HOME
   ===================================================== */

.home{
  display:block;

  text-align:center;

  margin-top:20px;

  color:#aaa;

  text-decoration:none;

  font-size:13px;
}

.home:hover{
  color:#fff;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:480px){

  body{
    padding:14px;
  }

  .box{
    padding:23px 19px;

    border-radius:18px;
  }

  .logo{
    font-size:26px;
  }

  .tabs button{
    font-size:13px;

    padding:11px 7px;
  }

  input{
    font-size:15px;
  }

}

</style>

</head>


<body>


<div class="box">


  <!-- =================================================
       LOGO
       ================================================= -->

  <div
    class="logo"
    onclick="goHome()"
  >

    <span>▶</span>
    MiniTube

  </div>


  <!-- =================================================
       TABS
       ================================================= -->

  <div class="tabs">


    <button
      id="loginTab"
      class="active"
      type="button"
      onclick="showLogin()"
    >
      Login
    </button>


    <button
      id="signupTab"
      type="button"
      onclick="showSignup()"
    >
      Create Account
    </button>


  </div>


  <!-- =================================================
       FORM
       ================================================= -->

  <form
    id="authForm"
    novalidate
  >


    <!-- DISPLAY NAME -->

    <div
      id="nameField"
      class="field"
      style="display:none;"
    >

      <label for="displayName">
        Display Name
      </label>

      <input
        id="displayName"
        type="text"
        placeholder="Your name"
        autocomplete="name"
        maxlength="50"
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        Password
      </label>


      <div class="passwordWrap">

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          minlength="6"
          required
        >


        <button
          id="passwordToggle"
          class="passwordToggle"
          type="button"
          onclick="togglePassword()"
        >
          Show
        </button>

      </div>

    </div>


    <!-- SUBMIT -->

    <button
      id="mainBtn"
      class="mainBtn"
      type="submit"
    >
      Login
    </button>


  </form>


  <!-- =================================================
       MESSAGE
       ================================================= -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- =================================================
       EMAIL CONFIRMATION
       ================================================= -->

  <div
    id="confirmBox"
    class="confirmBox"
  >

    <strong>Check your email</strong>
    <br><br>

    We sent a confirmation link to
    <span id="confirmEmail"></span>.

    <br><br>

    Open the email and confirm your account,
    then come back and login.

  </div>


  <!-- =================================================
       HOME
       ================================================= -->

  <a
    class="home"
    href="index.html"
  >
    ← Back to MiniTube
  </a>


</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://vlzssmuzetcbkmzujecs.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_tM8cIA2W3eZVc9AOtCtCtKWg_Suywus3I";


/* =====================================================
   MINI TUBE URL
   ===================================================== */

const MINITUBE_URL =
  "https://naradsocial7-arch.github.io/minitube/";


/* =====================================================
   STORAGE KEYS
   ===================================================== */

const ACCESS_TOKEN_KEY =
  "minitube_access_token";

const REFRESH_TOKEN_KEY =
  "minitube_refresh_token";

const USER_KEY =
  "minitube_user";


/* =====================================================
   MODE
   ===================================================== */

let mode =
  "login";


/* =====================================================
   GET REDIRECT TARGET
   ===================================================== */

function getRedirectTarget(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );


    const next =
      params.get("next");


    /*
      Only allow local MiniTube
      pages.

      This prevents an external
      website from being used as
      a redirect target.
    */

    if(
      next &&
      !next.startsWith("http://") &&
      !next.startsWith("https://") &&
      next.length < 500
    ){

      return next;

    }

  }catch(error){

    console.error(
      error
    );

  }


  return MINITUBE_URL;

}


/* =====================================================
   GO HOME
   ===================================================== */

function goHome(){

  window.location.href =
    "index.html";

}


/* =====================================================
   SHOW LOGIN
   ===================================================== */

function showLogin(){

  mode =
    "login";


  document
    .getElementById("loginTab")
    .classList.add("active");


  document
    .getElementById("signupTab")
    .classList.remove("active");


  document
    .getElementById("nameField")
    .style.display =
      "none";


  document
    .getElementById("displayName")
    .required =
      false;


  document
    .getElementById("password")
    .autocomplete =
      "current-password";


  document
    .getElementById("mainBtn")
    .textContent =
      "Login";


  clearMessage();

  hideConfirmation();

}


/* =====================================================
   SHOW SIGNUP
   ===================================================== */

function showSignup(){

  mode =
    "signup";


  document
    .getElementById("signupTab")
    .classList.add("active");


  document
    .getElementById("loginTab")
    .classList.remove("active");


  document
    .getElementById("nameField")
    .style.display =
      "block";


  document
    .getElementById("displayName")
    .required =
      true;


  document
    .getElementById("password")
    .autocomplete =
      "new-password";


  document
    .getElementById("mainBtn")
    .textContent =
      "Create Account";


  clearMessage();

  hideConfirmation();

}


/* =====================================================
   PASSWORD TOGGLE
   ===================================================== */

function togglePassword(){

  const password =
    document.getElementById(
      "password"
    );

  const button =
    document.getElementById(
      "passwordToggle"
    );


  if(
    password.type ===
    "password"
  ){

    password.type =
      "text";

    button.textContent =
      "Hide";

  }else{

    password.type =
      "password";

    button.textContent =
      "Show";

  }

}


/* =====================================================
   MESSAGE HELPERS
   ===================================================== */

function clearMessage(){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    "";

  message.className =
    "message";

}


function showMessage(
  text,
  type="info"
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


function hideConfirmation(){

  document
    .getElementById(
      "confirmBox"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================================
   LOADING STATE
   ===================================================== */

function setLoading(
  loading
){

  const button =
    document.getElementById(
      "mainBtn"
    );


  button.disabled =
    loading;


  if(loading){

    button.innerHTML =
      `
        <span class="spinner"></span>
        ${
          mode === "login"
            ? "Logging in..."
            : "Creating account..."
        }
      `;

  }else{

    button.textContent =
      mode === "login"
        ? "Login"
        : "Create Account";

  }

}


/* =====================================================
   VALIDATE FORM
   ===================================================== */

function validateForm(){

  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const displayName =
    document
      .getElementById(
        "displayName"
      )
      .value
      .trim();


  if(!email){

    showMessage(
      "Please enter your email.",
      "error"
    );

    return false;

  }


  if(
    !email.includes("@") ||
    !email.includes(".")
  ){

    showMessage(
      "Please enter a valid email address.",
      "error"
    );

    return false;

  }


  if(
    !password ||
    password.length < 6
  ){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return false;

  }


  if(
    mode === "signup" &&
    !displayName
  ){

    showMessage(
      "Please enter your display name.",
      "error"
    );

    return false;

  }


  return true;

}


/* =====================================================
   AUTH FORM
   ===================================================== */

document
  .getElementById(
    "authForm"
  )
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      if(!validateForm()){

        return;

      }


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const displayName =
        document
          .getElementById(
            "displayName"
          )
          .value
          .trim();


      clearMessage();

      hideConfirmation();

      setLoading(true);


      try{


        /* =============================================
           SIGNUP
           ============================================= */

        if(
          mode === "signup"
        ){

          const signupURL =
            SUPABASE_URL +
            "/auth/v1/signup" +
            "?redirect_to=" +
            encodeURIComponent(
              MINITUBE_URL
            );


          const response =
            await fetch(
              signupURL,
              {

                method:"POST",

                headers:{

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_ANON_KEY

                },

                body:
                  JSON.stringify({

                    email:
                      email,

                    password:
                      password,

                    data:{
                      display_name:
                        displayName
                    }

                  })

              }
            );


          const result =
            await response.json();


          if(!response.ok){

            throw new Error(
              getAuthError(
                result
              )
            );

          }


          /*
            Supabase may return a user
            without an access token when
            email confirmation is enabled.
          */

          if(
            result.access_token
          ){

            saveSession(
              result
            );


            showMessage(
              "Account created and logged in!",
              "success"
            );


            setTimeout(
              redirectAfterLogin,
              500
            );


            return;

          }


          /*
            Normal email-confirmation
            flow.
          */

          document
            .getElementById(
              "password"
            )
            .value =
              "";


          document
            .getElementById(
              "confirmEmail"
            )
            .textContent =
              email;


          document
            .getElementById(
              "confirmBox"
            )
            .classList.add(
              "show"
            );


          showMessage(
            "Account created successfully.",
            "success"
          );


        }


        /* =============================================
           LOGIN
           ============================================= */

        else{

          const response =
            await fetch(

              SUPABASE_URL +
              "/auth/v1/token?grant_type=password",

              {

                method:"POST",

                headers:{

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_ANON_KEY

                },

                body:
                  JSON.stringify({

                    email:
                      email,

                    password:
                      password

                  })

              }

            );


          const result =
            await response.json();


          if(!response.ok){

            throw new Error(
              getAuthError(
                result
              )
            );

          }


          if(
            !result.access_token
          ){

            throw new Error(
              "Login succeeded but no access token was returned."
            );

          }


          saveSession(
            result
          );


          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          setTimeout(
            redirectAfterLogin,
            500
          );

        }


      }catch(error){

        console.error(
          "Authentication error:",
          error
        );


        showMessage(
          error.message ||
          "Authentication failed. Please try again.",
          "error"
        );


      }finally{

        setLoading(false);

      }

    }
  );


/* =====================================================
   SAVE SESSION
   ===================================================== */

function saveSession(
  result
){

  if(
    result.access_token
  ){

    localStorage.setItem(
      ACCESS_TOKEN_KEY,
      result.access_token
    );

  }


  if(
    result.refresh_token
  ){

    localStorage.setItem(
      REFRESH_TOKEN_KEY,
      result.refresh_token
    );

  }


  if(
    result.user
  ){

    localStorage.setItem(
      USER_KEY,
      JSON.stringify(
        result.user
      )
    );

  }

}


/* =====================================================
   REDIRECT AFTER LOGIN
   ===================================================== */

function redirectAfterLogin(){

  const target =
    getRedirectTarget();


  window.location.href =
    target;

}


/* =====================================================
   SUPABASE ERROR HANDLING
   ===================================================== */

function getAuthError(
  result
){

  if(!result){

    return "Authentication failed.";

  }


  const message =
    (
      result.msg ||
      result.message ||
      result.error_description ||
      result.error ||
      ""
    ).toString();


  const lower =
    message.toLowerCase();


  if(
    lower.includes(
      "invalid login credentials"
    )
  ){

    return(
      "Incorrect email or password."
    );

  }


  if(
    lower.includes(
      "email not confirmed"
    )
  ){

    return(
      "Please confirm your email before logging in."
    );

  }


  if(
    lower.includes(
      "user already registered"
    )
  ){

    return(
      "This email is already registered. Please login."
    );

  }


  if(
    lower.includes(
      "password should be at least"
    )
  ){

    return(
      "Password must be at least 6 characters."
    );

  }


  if(
    lower.includes(
      "rate limit"
    )
  ){

    return(
      "Too many attempts. Please wait a moment and try again."
    );

  }


  return(
    message ||
    "Authentication failed. Please try again."
  );

}


/* =====================================================
   START
   ===================================================== */

(function(){

  /*
    If already logged in,
    don't unnecessarily show
    the login screen.
  */

  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );

  const user =
    localStorage.getItem(
      USER_KEY
    );


  if(
    token &&
    user
  ){

    /*
      Small delay avoids a flash
      while the page loads.
    */

    setTimeout(
      function(){

        window.location.href =
          getRedirectTarget();

      },
      150
    );

  }

})();

</script>


</body>
</html>
