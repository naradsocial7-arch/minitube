<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.box{
  width:100%;
  max-width:420px;

  background:#181818;

  border:1px solid #292929;

  border-radius:22px;

  padding:30px;
}

.logo{
  text-align:center;

  font-size:28px;
  font-weight:800;

  margin-bottom:25px;
}

.logo span{
  color:#ff0033;
}

.tabs{
  display:flex;

  gap:8px;

  margin-bottom:22px;
}

.tabs button{
  flex:1;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#292929;

  color:#aaa;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}

.tabs button.active{
  background:white;
  color:#111;
}

label{
  display:block;

  color:#bbb;

  font-size:14px;

  margin-bottom:7px;
}

input{
  width:100%;

  padding:14px;

  margin-bottom:16px;

  border-radius:10px;

  border:1px solid #444;

  background:#222;

  color:white;

  outline:none;

  font-size:16px;
}

input:focus{
  border-color:#ff0033;
}

.mainBtn{
  width:100%;

  padding:14px;

  border:0;

  border-radius:25px;

  background:#ff0033;

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;
}

.mainBtn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.message{
  min-height:22px;

  text-align:center;

  margin-top:15px;

  color:#aaa;

  font-size:14px;

  line-height:1.5;
}

.home{
  display:block;

  text-align:center;

  margin-top:20px;

  color:#aaa;

  text-decoration:none;

  font-size:14px;
}

.home:hover{
  color:white;
}

</style>

</head>


<body>


<div class="box">


  <div class="logo">
    <span>▶</span> MiniTube
  </div>


  <div class="tabs">

    <button
      id="loginTab"
      class="active"
      onclick="showLogin()"
    >
      Login
    </button>


    <button
      id="signupTab"
      onclick="showSignup()"
    >
      Create Account
    </button>

  </div>


  <form id="authForm">


    <div
      id="nameField"
      style="display:none;"
    >

      <label>
        Display Name
      </label>

      <input
        id="displayName"
        type="text"
        placeholder="Your name"
      >

    </div>


    <label>
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      required
    >


    <label>
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      minlength="6"
      required
    >


    <button
      id="mainBtn"
      class="mainBtn"
      type="submit"
    >
      Login
    </button>


  </form>


  <div
    id="message"
    class="message"
  ></div>


  <a
    class="home"
    href="index.html"
  >
    ← Back to MiniTube
  </a>


</div>


<script>


/* =====================================
   SUPABASE
   ===================================== */

const SUPABASE_URL =
  "https://vlzssmuzetcbkmzujecs.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_tM8cIA2W3eZVc9AOtCtKWg_Suywus3I";


/* =====================================
   MINI TUBE URL
   ===================================== */

const MINITUBE_URL =
  "https://naradsocial7-arch.github.io/minitube/";


let mode = "login";


/* =====================================
   LOGIN MODE
   ===================================== */

function showLogin(){

  mode = "login";


  document
    .getElementById("loginTab")
    .classList.add("active");


  document
    .getElementById("signupTab")
    .classList.remove("active");


  document
    .getElementById("nameField")
    .style.display = "none";


  document
    .getElementById("mainBtn")
    .textContent = "Login";


  document
    .getElementById("message")
    .textContent = "";

}


/* =====================================
   SIGNUP MODE
   ===================================== */

function showSignup(){

  mode = "signup";


  document
    .getElementById("signupTab")
    .classList.add("active");


  document
    .getElementById("loginTab")
    .classList.remove("active");


  document
    .getElementById("nameField")
    .style.display = "block";


  document
    .getElementById("mainBtn")
    .textContent = "Create Account";


  document
    .getElementById("message")
    .textContent = "";

}


/* =====================================
   AUTH FORM
   ===================================== */

document
  .getElementById("authForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const displayName =
        document
          .getElementById("displayName")
          .value
          .trim();


      const message =
        document
          .getElementById("message");


      const button =
        document
          .getElementById("mainBtn");


      button.disabled = true;


      if(mode === "login"){

        message.textContent =
          "Logging in...";

      }else{

        message.textContent =
          "Creating account...";

      }


      try{


        let response;


        /* =================================
           SIGN UP
           ================================= */

        if(mode === "signup"){


          const signupURL =
            SUPABASE_URL +
            "/auth/v1/signup" +
            "?redirect_to=" +
            encodeURIComponent(
              MINITUBE_URL
            );


          response =
            await fetch(
              signupURL,
              {

                method:"POST",

                headers:{

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_ANON_KEY

                },

                body:JSON.stringify({

                  email:email,

                  password:password,

                  data:{
                    display_name:
                      displayName
                  }

                })

              }
            );


        }


        /* =================================
           LOGIN
           ================================= */

        else{


          response =
            await fetch(

              SUPABASE_URL +
              "/auth/v1/token?grant_type=password",

              {

                method:"POST",

                headers:{

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_ANON_KEY

                },

                body:JSON.stringify({

                  email:email,

                  password:password

                })

              }

            );

        }


        const result =
          await response.json();


        /* =================================
           ERROR
           ================================= */

        if(!response.ok){

          throw new Error(

            result.msg ||

            result.message ||

            result.error_description ||

            result.error ||

            "Authentication failed."

          );

        }


        /* =================================
           SIGNUP SUCCESS
           ================================= */

        if(mode === "signup"){


          message.textContent =
            "Account created! Please check your email and confirm your account.";


          document
            .getElementById("password")
            .value = "";


        }


        /* =================================
           LOGIN SUCCESS
           ================================= */

        else{


          if(!result.access_token){

            throw new Error(
              "Login succeeded but no access token was returned."
            );

          }


          localStorage.setItem(

            "minitube_access_token",

            result.access_token

          );


          if(result.refresh_token){

            localStorage.setItem(

              "minitube_refresh_token",

              result.refresh_token

            );

          }


          if(result.user){

            localStorage.setItem(

              "minitube_user",

              JSON.stringify(
                result.user
              )

            );

          }


          message.textContent =
            "Login successful!";


          setTimeout(

            function(){

              window.location.href =
                MINITUBE_URL;

            },

            700

          );

        }


      }catch(error){


        console.error(error);


        message.textContent =
          error.message;


      }finally{


        button.disabled = false;


      }

    }

  );


</script>


</body>
</html>
