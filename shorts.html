<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Shorts</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding-bottom:70px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:64px;

  z-index:20;

  background:rgba(15,15,15,.95);

  border-bottom:1px solid #292929;

  display:flex;

  align-items:center;

  padding:0 14px;

  gap:12px;
}

.back{
  border:0;
  background:none;
  color:white;

  font-size:30px;

  padding:0;

  cursor:pointer;

  line-height:1;
}

.logo{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.headerTitle{
  margin-left:auto;

  font-size:16px;
  font-weight:bold;
}

.avatar{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;

  cursor:pointer;

  flex-shrink:0;
}


/* =========================
   SHORTS FEED
   ========================= */

.shorts{
  width:100%;
  max-width:600px;

  height:calc(100vh - 70px);

  margin:64px auto 0;

  overflow-y:auto;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;
}

.shorts::-webkit-scrollbar{
  display:none;
}


/* =========================
   SHORT CARD
   ========================= */

.short{
  position:relative;

  width:100%;

  height:calc(100vh - 70px);

  min-height:500px;

  scroll-snap-align:start;

  background:#000;

  overflow:hidden;
}

.short video{
  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;
}


/* =========================
   GRADIENT
   ========================= */

.gradient{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:42%;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.9)
    );

  pointer-events:none;
}


/* =========================
   INFO
   ========================= */

.info{
  position:absolute;

  left:16px;
  right:85px;
  bottom:25px;

  z-index:3;
}

.channelRow{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:10px;

  cursor:pointer;
}

.channelAvatar{
  width:32px;
  height:32px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-size:13px;
  font-weight:bold;

  flex-shrink:0;
}

.channelName{
  font-size:14px;
  font-weight:bold;
}

.videoName{
  font-size:15px;

  word-break:break-word;

  line-height:1.4;
}


/* =========================
   SIDE ACTIONS
   ========================= */

.actions{
  position:absolute;

  right:14px;
  bottom:30px;

  z-index:5;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:20px;
}

.action{
  background:rgba(20,20,20,.7);

  border:0;

  color:white;

  width:52px;

  min-height:52px;

  border-radius:50%;

  font-size:24px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;
}

.action span{
  font-size:11px;

  margin-top:3px;

  color:#ddd;
}

.action.liked{
  color:#ff0033;
}


/* =========================
   MUTE BADGE
   ========================= */

.muteBadge{
  position:absolute;

  top:78px;
  right:14px;

  z-index:5;

  background:rgba(0,0,0,.6);

  color:white;

  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  cursor:pointer;
}


/* =========================
   EMPTY / LOADING
   ========================= */

.empty{
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#aaa;

  padding:30px;
}

.empty strong{
  display:block;

  color:white;

  font-size:22px;

  margin-bottom:10px;
}

.loading{
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;
}


/* =========================
   STANDARD MINI TUBE
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  align-items:center;

  justify-content:space-around;

  z-index:100;

  padding:0;
}

.bottom button{
  flex:1;

  width:25%;
  max-width:25%;

  height:70px;

  padding:5px 2px;

  margin:0;

  background:none;

  border:0;

  color:#aaa;

  font-size:13px;

  font-family:Arial,sans-serif;

  cursor:pointer;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;
}

.bottom button b{
  display:block;

  font-size:22px;

  line-height:22px;

  height:25px;

  margin-bottom:3px;

  color:white;

  font-weight:normal;
}

.bottom button.active{
  color:white;
}

.bottom button.active b{
  color:white;
}


/* =========================
   DESKTOP
   ========================= */

@media(min-width:601px){

  body{
    background:#111;
  }

  .shorts{
    box-shadow:
      0 0 40px rgba(0,0,0,.7);
  }

}


/* =========================
   SMALL MOBILE
   ========================= */

@media(max-width:380px){

  .bottom button{
    font-size:12px;
  }

  .bottom button b{
    font-size:21px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <button
    class="back"
    onclick="goBack()"
    aria-label="Go back"
  >
    ‹
  </button>

  <div class="logo">
    <span>▶</span> MiniTube
  </div>

  <div class="headerTitle">
    Shorts
  </div>

  <div
    id="headerAvatar"
    class="avatar"
    onclick="window.location.href='setting.html'"
  >
    M
  </div>

</header>


<!-- =========================
     SHORTS FEED
     ========================= -->

<div
  id="shorts"
  class="shorts"
>

  <div class="loading">
    Loading Shorts...
  </div>

</div>


<!-- =========================
     STANDARD BOTTOM NAVIGATION
     ========================= -->

<div class="bottom">

  <button
    onclick="goHome()"
    aria-label="Home"
  >
    <b>⌂</b>
    Home
  </button>

  <button
    class="active"
    aria-label="Horizontal videos"
  >
    <b>▶</b>
    HORIZONTAL
  </button>

  <button
    onclick="goSubscriptions()"
    aria-label="Subscriptions"
  >
    <b>□</b>
    Subscriptions
  </button>

  <button
    onclick="goYou()"
    aria-label="You"
  >
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   AUTH
   ===================================== */

const ACCESS_TOKEN_KEY =
  "minitube_access_token";

const USER_KEY =
  "minitube_user";


function getLoggedUser(){

  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );

  const savedUser =
    localStorage.getItem(
      USER_KEY
    );


  if(!token || !savedUser){

    return null;

  }


  try{

    return JSON.parse(
      savedUser
    );

  }catch(error){

    return null;

  }

}


(function(){

  const user =
    getLoggedUser();

  const avatar =
    document.getElementById(
      "headerAvatar"
    );


  if(user){

    const metadata =
      user.user_metadata || {};

    const name =
      metadata.display_name ||
      metadata.full_name ||
      user.email ||
      "M";

    avatar.textContent =
      name.trim().charAt(0).toUpperCase() ||
      "M";

  }

})();


/* =====================================
   VIDEOS
   ===================================== */

let videos =
  [];


/* =====================================
   LOAD SHORTS
   ===================================== */

async function loadShorts(){

  const container =
    document.getElementById(
      "shorts"
    );


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    const data =
      await response.json();


    container.innerHTML = `

      <div class="loading">
        Checking video orientation...
      </div>

    `;


    videos =
      await filterVerticalVideos(
        data
      );


    renderShorts();


  }catch(error){

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        <div>

          <strong>
            Unable to load Shorts
          </strong>

          Please try again later.

        </div>

      </div>

    `;

  }

}


/* =====================================
   FILTER: VERTICAL VIDEOS ONLY
   ===================================== */

function checkOrientation(video){

  return new Promise(function(resolve){

    const probe =
      document.createElement(
        "video"
      );

    probe.preload =
      "metadata";

    probe.muted =
      true;


    let done =
      false;


    const timer =
      setTimeout(
        function(){

          if(!done){

            done =
              true;

            resolve(
              null
            );

          }

        },
        8000
      );


    probe.addEventListener(
      "loadedmetadata",
      function(){

        if(done){

          return;

        }

        done =
          true;

        clearTimeout(
          timer
        );


        const isVertical =
          probe.videoHeight >
          probe.videoWidth;


        resolve(
          isVertical
            ? video
            : null
        );

      }
    );


    probe.addEventListener(
      "error",
      function(){

        if(done){

          return;

        }

        done =
          true;

        clearTimeout(
          timer
        );

        resolve(
          null
        );

      }
    );


    probe.src =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.r2_key
      );

  });

}


async function filterVerticalVideos(rawVideos){

  const results =
    await Promise.all(
      rawVideos.map(
        checkOrientation
      )
    );


  return results.filter(
    video => video !== null
  );

}


/* =====================================
   RENDER SHORTS
   ===================================== */

function renderShorts(){

  const container =
    document.getElementById(
      "shorts"
    );


  if(videos.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div>

          <strong>
            No Shorts yet
          </strong>

          Upload a vertical video from
          the Home page to start
          building your Shorts feed 🚀

        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    "";


  videos.forEach(video => {

    container.appendChild(
      createShort(
        video
      )
    );

  });


  setupAutoplay();

}


/* =====================================
   CREATE SHORT CARD
   ===================================== */

function createShort(video){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "short";


  const videoURL =
    API_BASE +
    "/video/" +
    encodeURIComponent(
      video.r2_key
    );


  const channelName =
    (video.profiles &&
      video.profiles.display_name) ||
    "Unknown creator";


  const currentUser =
    getLoggedUser();

  const isOwnVideo =
    currentUser &&
    currentUser.id === video.owner_id;


  const channelHref =
    isOwnVideo
      ? "channel.html"
      : "channel.html?id=" +
        encodeURIComponent(
          video.owner_id
        );


  const likeKey =
    "likes_" +
    video.r2_key;

  const likedKey =
    "liked_" +
    video.r2_key;

  let likes =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );

  let liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  const viewsKey =
    "views_" +
    video.r2_key;

  let views =
    Number(
      localStorage.getItem(
        viewsKey
      ) || 0
    );


  card.innerHTML = `

    <video
      playsinline
      loop
      muted
      preload="metadata"
      src="${videoURL}">
    </video>


    <div class="gradient"></div>


    <div class="muteBadge">
      🔇
    </div>


    <div class="info">

      <div class="channelRow">

        <div class="channelAvatar">
          ${escapeHTML(
            channelName.trim().charAt(0).toUpperCase() || "M"
          )}
        </div>

        <div class="channelName">
          ${escapeHTML(
            channelName
          )}
        </div>

      </div>


      <div class="videoName">

        ${escapeHTML(
          video.title || video.r2_key
        )}

      </div>

    </div>


    <div class="actions">


      <button
        class="action likeBtn"
      >

        <span class="heart">

          ${liked
            ? "♥"
            : "♡"}

        </span>


        <span class="likeNumber">

          ${likes}

        </span>

      </button>


      <button
        class="action shareBtn"
      >

        ↗

        <span>
          Share
        </span>

      </button>


      <button
        class="action viewBtn"
      >

        👁

        <span class="shortViews">

          ${views}

        </span>

      </button>


    </div>

  `;


  const videoElement =
    card.querySelector(
      "video"
    );

  const muteBadge =
    card.querySelector(
      ".muteBadge"
    );


  /* ===============================
     TAP VIDEO TO MUTE/UNMUTE
     =============================== */

  videoElement.addEventListener(
    "click",
    function(){

      videoElement.muted =
        !videoElement.muted;

      muteBadge.textContent =
        videoElement.muted
          ? "🔇"
          : "🔊";

    }
  );


  /* ===============================
     CHANNEL → CHANNEL PAGE
     =============================== */

  card.querySelector(
    ".channelRow"
  ).addEventListener(
    "click",
    function(){

      window.location.href =
        channelHref;

    }
  );


  /* ===============================
     LIKE
     =============================== */

  const likeButton =
    card.querySelector(
      ".likeBtn"
    );


  likeButton.addEventListener(
    "click",
    function(){

      liked =
        !liked;


      if(liked){

        likes++;

      }else{

        if(likes > 0){

          likes--;

        }

      }


      localStorage.setItem(
        likeKey,
        likes
      );


      localStorage.setItem(
        likedKey,
        liked
      );


      likeButton.classList.toggle(
        "liked",
        liked
      );


      likeButton.querySelector(
        ".heart"
      ).textContent =
        liked ? "♥" : "♡";


      likeButton.querySelector(
        ".likeNumber"
      ).textContent =
        likes;

    }
  );


  /* ===============================
     SHARE
     =============================== */

  const shareButton =
    card.querySelector(
      ".shareBtn"
    );


  shareButton.addEventListener(
    "click",
    function(){

      const url =
        window.location.origin +
        window.location.pathname.replace(
          "shorts.html",
          "watch.html"
        ) +
        "?video=" +
        encodeURIComponent(
          video.r2_key
        );


      if(navigator.share){

        navigator.share({
          title:
            video.title ||
            "MiniTube Shorts",
          url: url
        }).catch(
          () => {}
        );

      }else{

        navigator.clipboard
          .writeText(url)
          .then(
            () => alert(
              "Link copied to clipboard!"
            )
          )
          .catch(
            () => prompt(
              "Copy this link:",
              url
            )
          );

      }

    }
  );


  /* ===============================
     VIEW COUNT
     =============================== */

  let viewCounted =
    false;


  card.dataset.countView =
    "pending";


  card.addEventListener(
    "shortviewed",
    function(){

      if(viewCounted){

        return;

      }

      viewCounted =
        true;


      views++;


      localStorage.setItem(
        viewsKey,
        views
      );


      card.querySelector(
        ".shortViews"
      ).textContent =
        views;

    }
  );


  return card;

}


/* =====================================
   AUTOPLAY ON SCROLL
   ===================================== */

function setupAutoplay(){

  const cards =
    document.querySelectorAll(
      ".short"
    );


  const observer =
    new IntersectionObserver(
      function(entries){

        entries.forEach(entry => {

          const video =
            entry.target.querySelector(
              "video"
            );


          if(
            entry.isIntersecting &&
            entry.intersectionRatio > .7
          ){

            video.play().catch(
              () => {}
            );


            entry.target.dispatchEvent(
              new Event(
                "shortviewed"
              )
            );


          }else{

            video.pause();

          }

        });

      },
      {
        threshold:[
          .7
        ]
      }
    );


  cards.forEach(card => {

    observer.observe(
      card
    );

  });

}


/* =====================================
   NAVIGATION
   ===================================== */

function goBack(){

  if(
    window.history.length > 1
  ){

    window.history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


function goHome(){

  window.location.href =
    "index.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   HELPERS
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   INIT
   ===================================== */

loadShorts();

</script>

</body>
</html>
