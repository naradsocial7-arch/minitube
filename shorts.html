<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MiniTube - Clips</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding-bottom:70px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:64px;

  z-index:20;

  background:rgba(15,15,15,.95);

  border-bottom:1px solid #292929;

  display:flex;

  align-items:center;

  padding:0 14px;

  gap:12px;
}

.back{
  border:0;
  background:none;
  color:white;

  font-size:30px;

  padding:0;

  cursor:pointer;
}

.logo{
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.title{
  margin-left:auto;

  font-size:16px;
  font-weight:bold;
}


/* =========================
   USER
   ========================= */

.user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:8px;
}

.avatar{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;
}

.userName{
  max-width:130px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:13px;

  color:#ddd;
}


/* =========================
   CLIPS FEED
   ========================= */

.shorts{
  width:100%;

  max-width:640px;

  margin:64px auto 0;

  padding:14px;

  display:flex;

  flex-direction:column;

  gap:18px;
}


/* =========================
   CLIP CARD
   ========================= */

.short{
  position:relative;

  width:100%;

  background:#0f0f0f;

  border-radius:16px;

  overflow:hidden;
}

.short video{
  width:100%;

  aspect-ratio:16/9;

  display:block;

  object-fit:cover;

  background:#000;

  cursor:pointer;
}


/* =========================
   INFO
   ========================= */

.info{
  padding:12px 14px 4px;
}

.videoName{
  font-size:16px;

  font-weight:bold;

  word-break:break-word;

  margin-bottom:6px;
}

.meta{
  color:#999;

  font-size:13px;
}


/* =========================
   ACTIONS
   ========================= */

.actions{
  display:flex;

  align-items:center;

  gap:10px;

  padding:10px 14px 14px;
}

.action{
  background:#1e1e1e;

  border:0;

  color:white;

  padding:9px 14px;

  border-radius:20px;

  font-size:14px;

  cursor:pointer;

  display:flex;

  align-items:center;

  gap:6px;
}

.action span{
  font-size:13px;

  color:#ddd;
}

.action.liked{
  color:#ff0033;
}


/* =========================
   MUTE BADGE
   ========================= */

.muteBadge{
  position:absolute;

  top:10px;

  right:10px;

  background:rgba(0,0,0,.6);

  color:white;

  width:34px;

  height:34px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:15px;

  pointer-events:none;
}


/* =========================
   EMPTY
   ========================= */

.empty{
  padding:80px 30px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#aaa;
}

.empty strong{
  display:block;

  color:white;

  font-size:22px;

  margin-bottom:10px;
}


/* =========================
   LOADING
   ========================= */

.loading{
  padding:80px 30px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:30;
}

.bottom button{
  background:none;

  border:0;

  color:#aaa;

  font-size:12px;

  cursor:pointer;
}

.bottom button b{
  display:block;

  font-size:22px;

  color:white;

  margin-bottom:3px;
}

.bottom .active{
  color:white;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .userName{
    display:none;
  }

  .title{
    font-size:15px;
  }

}

@media(min-width:601px){

  body{
    background:#111;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <button
    class="back"
    onclick="goHome()"
  >
    ‹
  </button>


  <div class="logo">

    <span>▶</span>

    MiniTube

  </div>


  <div class="title">
    Clips
  </div>


  <div class="user">

    <div
      id="avatar"
      class="avatar"
    >
      M
    </div>

    <div
      id="userName"
      class="userName"
    >
      User
    </div>

  </div>

</header>


<!-- =========================
     SHORTS
     ========================= -->

<main
  id="shorts"
  class="shorts"
>

  <div class="loading">
    Loading Clips...
  </div>

</main>


<!-- =========================
     BOTTOM NAV
     ========================= -->

<nav class="bottom">


  <button onclick="goHome()">

    <b>⌂</b>

    Home

  </button>


  <button class="active">

    <b>▭</b>

    Clips

  </button>


  <button onclick="createVideo()">

    <b>＋</b>

    Create

  </button>


  <button onclick="goSubscriptions()">

    <b>□</b>

    Subscriptions

  </button>


  <button onclick="goYou()">

    <b>●</b>

    You

  </button>


</nav>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   USER SYSTEM
   ===================================== */

let currentUser = null;

let channelName = "User";


function loadUser(){

  const savedUser =
    localStorage.getItem(
      "minitube_user"
    );


  if(!savedUser){

    window.location.href =
      "login.html";

    return false;

  }


  try{

    currentUser =
      JSON.parse(
        savedUser
      );


    const metadata =
      currentUser.user_metadata ||
      {};


    channelName =
      metadata.display_name ||
      currentUser.email ||
      "User";


    channelName =
      String(channelName)
        .trim();


    if(!channelName){

      channelName =
        "User";

    }


    const firstLetter =
      channelName
        .charAt(0)
        .toUpperCase();


    document.getElementById(
      "avatar"
    ).textContent =
      firstLetter;


    document.getElementById(
      "userName"
    ).textContent =
      channelName;


    return true;


  }catch(error){

    console.error(
      "User data error:",
      error
    );


    localStorage.removeItem(
      "minitube_user"
    );


    localStorage.removeItem(
      "minitube_access_token"
    );


    window.location.href =
      "login.html";


    return false;

  }

}


/* =====================================
   NAVIGATION
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


function goYou(){

  window.location.href =
    "you.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


function createVideo(){

  window.location.href =
    "index.html";

}


/* =====================================
   VIDEOS
   ===================================== */

let videos = [];


/* =====================================
   LOAD SHORTS
   ===================================== */

async function loadShorts(){

  const container =
    document.getElementById(
      "shorts"
    );


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    const data =
      await response.json();


    container.innerHTML = `

      <div class="loading">
        Checking video orientation...
      </div>

    `;


    videos =
      await filterLandscapeVideos(
        data
      );


    renderShorts();


  }catch(error){

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        <div>

          <strong>
            Unable to load Clips
          </strong>

          Please try again later.

        </div>

      </div>

    `;

  }

}


/* =====================================
   FILTER: HORIZONTAL VIDEOS ONLY
   ===================================== */

function checkOrientation(video){

  return new Promise(function(resolve){

    const probe =
      document.createElement(
        "video"
      );

    probe.preload =
      "metadata";

    probe.muted =
      true;


    let done =
      false;


    /*
      Safety timeout — if a video's
      metadata never loads (broken
      file, slow network), skip it
      instead of hanging forever.
    */

    const timer =
      setTimeout(
        function(){

          if(!done){

            done =
              true;

            resolve(
              null
            );

          }

        },
        8000
      );


    probe.addEventListener(
      "loadedmetadata",
      function(){

        if(done){

          return;

        }

        done =
          true;

        clearTimeout(
          timer
        );


        const isLandscape =
          probe.videoWidth >=
          probe.videoHeight;


        resolve(
          isLandscape
            ? video
            : null
        );

      }
    );


    probe.addEventListener(
      "error",
      function(){

        if(done){

          return;

        }

        done =
          true;

        clearTimeout(
          timer
        );

        resolve(
          null
        );

      }
    );


    probe.src =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.name
      );

  });

}


async function filterLandscapeVideos(rawVideos){

  const results =
    await Promise.all(
      rawVideos.map(
        checkOrientation
      )
    );


  return results.filter(
    video => video !== null
  );

}


/* =====================================
   RENDER SHORTS
   ===================================== */

function renderShorts(){

  const container =
    document.getElementById(
      "shorts"
    );


  container.innerHTML =
    "";


  if(!videos.length){

    container.innerHTML = `

      <div class="empty">

        <div>

          <strong>
            No horizontal videos yet
          </strong>

          Upload a landscape (horizontal)
          video from the Home page to
          see it here 🚀

        </div>

      </div>

    `;


    return;

  }


  videos.forEach(
    (video,index) => {

      createShort(
        video,
        index,
        container
      );

    }
  );


  setupAutoplay();

}


/* =====================================
   CREATE SHORT
   ===================================== */

function createShort(
  video,
  index,
  container
){

  const card =
    document.createElement(
      "section"
    );


  card.className =
    "short";


  const videoURL =
    API_BASE +
    "/video/" +
    encodeURIComponent(
      video.name
    );


  /* ===============================
     LIKE
     =============================== */

  const likeKey =
    "likes_" +
    video.name;


  const likedKey =
    "liked_" +
    video.name;


  let likes =
    Number(
      localStorage.getItem(
        likeKey
      ) || 0
    );


  let liked =
    localStorage.getItem(
      likedKey
    ) === "true";


  /* ===============================
     VIEWS
     =============================== */

  const viewsKey =
    "views_" +
    video.name;


  const viewedKey =
    "viewed_" +
    video.name;


  let views =
    Number(
      localStorage.getItem(
        viewsKey
      ) || 0
    );


  card.innerHTML = `

    <video
      playsinline
      loop
      muted
      preload="metadata"
      src="${videoURL}">
    </video>


    <div class="muteBadge">
      🔇
    </div>


    <div class="info">

      <div class="videoName">

        ${escapeHTML(
          video.name
        )}

      </div>


      <div class="meta">

        ${escapeHTML(
          channelName
        )}

      </div>

    </div>


    <div class="actions">


      <button
        class="action likeBtn"
      >

        <span class="heart">

          ${liked
            ? "♥"
            : "♡"}

        </span>


        <span class="likeNumber">

          ${likes}

        </span>

      </button>


      <button
        class="action shareBtn"
      >

        ↗

        <span>
          Share
        </span>

      </button>


      <button
        class="action viewBtn"
      >

        👁

        <span class="shortViews">

          ${views}

        </span>

      </button>


    </div>

  `;


  /* ===============================
     ELEMENTS
     =============================== */

  const videoElement =
    card.querySelector(
      "video"
    );


  const likeButton =
    card.querySelector(
      ".likeBtn"
    );


  const heart =
    card.querySelector(
      ".heart"
    );


  const likeNumber =
    card.querySelector(
      ".likeNumber"
    );


  const viewNumber =
    card.querySelector(
      ".shortViews"
    );


  /* ===============================
     LIKE
     =============================== */

  likeButton.addEventListener(
    "click",
    function(){

      liked =
        !liked;


      if(liked){

        likes++;

      }else{

        if(likes > 0){

          likes--;

        }

      }


      localStorage.setItem(
        likeKey,
        likes
      );


      localStorage.setItem(
        likedKey,
        liked
      );


      heart.textContent =
        liked
          ? "♥"
          : "♡";


      likeNumber.textContent =
        likes;


      likeButton.classList.toggle(
        "liked",
        liked
      );

    }
  );


  /* ===============================
     TAP VIDEO TO WATCH FULL SCREEN
     =============================== */

  videoElement.addEventListener(
    "click",
    function(){

      window.location.href =
        "watch.html?video=" +
        encodeURIComponent(
          video.name
        );

    }
  );


  /* ===============================
     SHARE
     =============================== */

  const shareButton =
    card.querySelector(
      ".shareBtn"
    );


  shareButton.addEventListener(
    "click",
    async function(){

      const shareURL =
        window.location.origin +
        window.location.pathname +
        "?video=" +
        encodeURIComponent(
          video.name
        );


      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              video.name,

            text:
              "Watch this on MiniTube",

            url:
              shareURL

          });

        }else{

          await navigator
            .clipboard
            .writeText(
              shareURL
            );


          alert(
            "MiniTube link copied!"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled"
        );

      }

    }
  );


  /* ===============================
     VIEW COUNTER
     =============================== */

  let counted =
    localStorage.getItem(
      viewedKey
    ) === "true";


  let viewTimer;


  videoElement.addEventListener(
    "play",
    function(){

      if(counted){

        return;

      }


      clearTimeout(
        viewTimer
      );


      viewTimer =
        setTimeout(
          function(){

            views++;


            localStorage.setItem(
              viewsKey,
              views
            );


            localStorage.setItem(
              viewedKey,
              "true"
            );


            viewNumber.textContent =
              views;


            counted =
              true;

          },
          3000
        );

    }
  );


  videoElement.addEventListener(
    "pause",
    function(){

      clearTimeout(
        viewTimer
      );

    }
  );


  container.appendChild(
    card
  );

}


/* =====================================
   AUTOPLAY
   ===================================== */

function setupAutoplay(){

  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target
                .querySelector(
                  "video"
                );


            if(
              entry.isIntersecting &&
              entry.intersectionRatio > .5
            ){

              document
                .querySelectorAll(
                  ".short video"
                )
                .forEach(
                  other => {

                    if(
                      other !== video
                    ){

                      other.pause();

                    }

                  }
                );


              video
                .play()
                .catch(
                  () => {}
                );


            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:[
          .5
        ]
      }
    );


  document
    .querySelectorAll(
      ".short"
    )
    .forEach(
      card => {

        observer.observe(
          card
        );

      }
    );

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   START
   ===================================== */

if(
  loadUser()
){

  loadShorts();

}

</script>

</body>

</html>
