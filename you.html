<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - You</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:20;

  height:64px;

  background:#111;
  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  padding:0 16px;
  gap:14px;
}

.back{
  background:none;
  border:0;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#ff0033;
}

.spacer{
  flex:1;
}

.avatarSmall{
  width:42px;
  height:42px;

  border-radius:50%;
  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;
  font-size:18px;

  cursor:pointer;
}


/* =========================
   CHANNEL HERO
   ========================= */

.channelHeader{

  margin:20px;

  background:
    linear-gradient(
      135deg,
      #24132d,
      #171717
    );

  border-radius:22px;

  padding:25px;

  display:flex;

  align-items:center;

  gap:20px;
}

.channelAvatar{

  width:90px;
  height:90px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;

  place-items:center;

  font-size:34px;

  font-weight:bold;

  flex-shrink:0;
}

.channelDetails{
  flex:1;
}

.channelName{

  font-size:26px;

  font-weight:800;

  margin-bottom:7px;

  word-break:break-word;
}

.handle{

  color:#aaa;

  font-size:14px;

  margin-bottom:10px;
}

.channelStats{

  color:#aaa;

  font-size:14px;

  line-height:1.5;
}

.userEmail{
  color:#bbb;
  word-break:break-all;
}

.channelActions{

  margin-top:15px;

  display:flex;

  gap:10px;

  flex-wrap:wrap;
}

.subscribeButton{

  border:0;

  border-radius:22px;

  padding:10px 18px;

  background:#fff;

  color:#111;

  font-weight:bold;

  cursor:pointer;
}

.subscribeButton.subscribed{

  background:#292929;

  color:white;

  border:1px solid #555;
}

.editButton{

  border:1px solid #555;

  background:#292929;

  color:white;

  border-radius:22px;

  padding:10px 18px;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   QUICK LINKS
   ========================= */

.quickLinks{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:10px;

  padding:0 20px;

  margin-bottom:10px;
}

.quickLink{

  background:#181818;

  border-radius:14px;

  padding:16px 8px;

  text-align:center;

  cursor:pointer;
}

.quickLink:hover{

  background:#1f1f1f;
}

.quickLinkIcon{

  font-size:22px;

  margin-bottom:8px;
}

.quickLinkLabel{

  font-size:12px;

  color:#ccc;

  word-break:break-word;
}


/* =========================
   CONTENT
   ========================= */

.content{

  padding:0 20px;
}

.sectionTitle{

  font-size:21px;

  font-weight:bold;

  margin:
    25px 0
    15px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px,1fr)
    );

  gap:18px;
}

.card{

  background:#181818;

  border-radius:16px;

  overflow:hidden;
}

.card video{

  width:100%;

  aspect-ratio:16/9;

  display:block;

  background:#000;

  cursor:pointer;
}

.info{

  padding:12px;
}

.title{

  font-size:17px;

  font-weight:bold;

  word-break:break-word;

  cursor:pointer;
}

.title:hover{

  text-decoration:underline;
}

.meta{

  color:#999;

  font-size:13px;

  margin-top:7px;
}

.watchButton{

  margin-top:12px;

  background:#292929;

  color:white;

  border:0;

  padding:9px 14px;

  border-radius:8px;

  cursor:pointer;
}

.watchButton:hover{

  background:#383838;
}


/* =========================
   EMPTY
   ========================= */

.empty{

  background:#181818;

  border:1px solid #292929;

  border-radius:16px;

  padding:45px 20px;

  text-align:center;
}

.emptyIcon{

  font-size:45px;

  margin-bottom:15px;
}

.empty h2{

  margin:
    0 0 8px;
}

.empty p{

  color:#999;

  line-height:1.5;

  margin:0;
}

.homeButton{

  margin-top:20px;

  background:#ff0033;

  color:white;

  border:0;

  border-radius:25px;

  padding:13px 22px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   LOGOUT
   ========================= */

.logoutButton{

  margin-top:15px;

  background:transparent;

  color:#ff4964;

  border:1px solid #ff4964;

  border-radius:22px;

  padding:10px 18px;

  font-weight:bold;

  cursor:pointer;
}

.logoutButton:hover{

  background:#ff0033;

  color:white;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:30;
}

.bottom button{

  background:none;

  border:0;

  color:#aaa;

  font-size:13px;

  cursor:pointer;
}

.bottom button b{

  display:block;

  font-size:22px;

  color:white;

  margin-bottom:3px;
}

.bottom .active{

  color:white;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .channelHeader{

    margin:16px;

    padding:20px;

    align-items:flex-start;
  }

  .channelAvatar{

    width:70px;
    height:70px;

    font-size:27px;
  }

  .channelName{

    font-size:21px;
  }

  .content{

    padding:0 16px;
  }

  .grid{

    grid-template-columns:1fr;
  }

}


/* =========================
   VERY SMALL SCREEN
   ========================= */

@media(max-width:380px){

  .channelHeader{

    gap:12px;
  }

  .channelAvatar{

    width:60px;
    height:60px;

    font-size:23px;
  }

  .channelName{

    font-size:18px;
  }

  .handle{

    font-size:13px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <button
    class="back"
    onclick="goHome()"
  >
    ‹
  </button>


  <div class="logo">

    <span>▶</span>
    MiniTube

  </div>


  <div class="spacer"></div>


  <div
    id="headerAvatar"
    class="avatarSmall"
    onclick="window.location.href='notifications.html'"
  >
    ?
  </div>

</header>


<!-- =========================
     CHANNEL HEADER
     ========================= -->

<section class="channelHeader">


  <div
    id="channelAvatar"
    class="channelAvatar"
  >
    ?
  </div>


  <div class="channelDetails">


    <div
      id="channelName"
      class="channelName"
    >
      Loading...
    </div>


    <div
      id="handle"
      class="handle"
    >
      @user
    </div>


    <div class="channelStats">

      <div
        id="userEmail"
        class="userEmail"
      >
        Loading...
      </div>


      <div style="margin-top:6px;">

        <span id="videoCount">
          0
        </span>

        videos

        &nbsp; • &nbsp;

        <span id="subscriberStatus">
          Not subscribed
        </span>

      </div>

    </div>


    <div class="channelActions">


      <button
        id="subscribeButton"
        class="subscribeButton"
        onclick="toggleSubscribe()"
      >

        Subscribe

      </button>


      <button
        class="editButton"
        onclick="editChannel()"
      >

        Edit Channel

      </button>


      <button
        class="logoutButton"
        onclick="logout()"
      >

        Logout

      </button>


    </div>


  </div>

</section>


<!-- =========================
     QUICK LINKS
     ========================= -->

<div class="quickLinks">

  <div
    class="quickLink"
    onclick="window.location.href='studio.html'"
  >
    <div class="quickLinkIcon">🎬</div>
    <div class="quickLinkLabel">Studio</div>
  </div>

  <div
    class="quickLink"
    onclick="window.location.href='playlist.html'"
  >
    <div class="quickLinkIcon">▤</div>
    <div class="quickLinkLabel">Playlists</div>
  </div>

  <div
    class="quickLink"
    onclick="window.location.href='history.html'"
  >
    <div class="quickLinkIcon">🕐</div>
    <div class="quickLinkLabel">History</div>
  </div>

  <div
    class="quickLink"
    onclick="window.location.href='settings.html'"
  >
    <div class="quickLinkIcon">⚙</div>
    <div class="quickLinkLabel">Settings</div>
  </div>

</div>


<!-- =========================
     VIDEOS
     ========================= -->

<section class="content">


  <div class="sectionTitle">

    Your Videos

  </div>


  <div id="videos">

    Loading videos...

  </div>


</section>


<!-- =========================
     BOTTOM NAV
     ========================= -->

<div class="bottom">


  <button onclick="goHome()">

    <b>⌂</b>

    Home

  </button>


  <button onclick="goShorts()">

    <b>▶</b>

    Shorts

  </button>


  <button onclick="window.location.href='upload.html'">

    <b>＋</b>

    Create

  </button>


  <button onclick="goSubscriptions()">

    <b>□</b>

    Subscriptions

  </button>


  <button class="active">

    <b>●</b>

    You

  </button>

</div>


<script>


/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   SUBSCRIBE SYSTEM
   ===================================== */

const SUBSCRIBE_KEY =
  "minitube_my_channel_subscribed";


/* =====================================
   LOGIN CHECK + USER INFORMATION
   ===================================== */

function loadLoggedInUser(){

  const userData =
    localStorage.getItem(
      "minitube_user"
    );


  /*
     Agar login nahi hai
     to login page par bhejo
  */

  if(!userData){

    window.location.href =
      "login.html";

    return false;

  }


  try{

    const user =
      JSON.parse(
        userData
      );


    const email =
      user.email ||
      "";


    /*
       Supabase login ke waqt
       display_name yahan save hua tha
    */

    const metadata =
      user.user_metadata ||
      {};


    let displayName =
      metadata.display_name ||
      "";


    /*
       Agar display name nahi mila
       to email ka username use karo
    */

    if(!displayName){

      displayName =
        email.split("@")[0] ||
        "User";

    }


    /*
       First letter
    */

    const firstLetter =
      displayName
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "U";


    /*
       Handle
    */

    let cleanHandle =
      displayName
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          ""
        )
        .slice(0,20);


    /*
       Agar naam Hindi/special characters
       ki wajah se empty ho gaya
    */

    if(!cleanHandle){

      cleanHandle =
        email
          .split("@")[0]
          .toLowerCase()
          .replace(
            /[^a-z0-9]+/g,
            ""
          )
          .slice(0,20);

    }


    if(!cleanHandle){

      cleanHandle =
        "user";

    }


    /*
       ==============================
       UPDATE HEADER AVATAR
       ==============================
    */

    document
      .getElementById(
        "headerAvatar"
      )
      .textContent =
      firstLetter;


    /*
       ==============================
       UPDATE CHANNEL AVATAR
       ==============================
    */

    document
      .getElementById(
        "channelAvatar"
      )
      .textContent =
      firstLetter;


    /*
       ==============================
       UPDATE CHANNEL NAME
       ==============================
    */

    document
      .getElementById(
        "channelName"
      )
      .textContent =
      displayName;


    /*
       ==============================
       UPDATE HANDLE
       ==============================
    */

    document
      .getElementById(
        "handle"
      )
      .textContent =
      "@" + cleanHandle;


    /*
       ==============================
       UPDATE EMAIL
       ==============================
    */

    document
      .getElementById(
        "userEmail"
      )
      .textContent =
      email;


    return true;


  }catch(error){

    console.error(
      "User data error:",
      error
    );


    /*
       Corrupt login data
       delete karke login par bhejo
    */

    localStorage.removeItem(
      "minitube_user"
    );

    localStorage.removeItem(
      "minitube_access_token"
    );

    localStorage.removeItem(
      "minitube_refresh_token"
    );


    window.location.href =
      "login.html";


    return false;

  }

}


/* =====================================
   CHECK SUBSCRIPTION
   ===================================== */

function isSubscribed(){

  return localStorage.getItem(
    SUBSCRIBE_KEY
  ) === "true";

}


/* =====================================
   UPDATE SUBSCRIBE BUTTON
   ===================================== */

function updateSubscribeButton(){

  const button =
    document.getElementById(
      "subscribeButton"
    );


  const status =
    document.getElementById(
      "subscriberStatus"
    );


  const subscribed =
    isSubscribed();


  if(subscribed){

    button.textContent =
      "Subscribed";

    button.classList.add(
      "subscribed"
    );

    status.textContent =
      "Subscribed";

  }else{

    button.textContent =
      "Subscribe";

    button.classList.remove(
      "subscribed"
    );

    status.textContent =
      "Not subscribed";

  }

}


/* =====================================
   TOGGLE SUBSCRIBE
   ===================================== */

function toggleSubscribe(){

  const subscribed =
    isSubscribed();


  localStorage.setItem(
    SUBSCRIBE_KEY,
    String(!subscribed)
  );


  updateSubscribeButton();

}


/* =====================================
   EDIT CHANNEL
   ===================================== */

function editChannel(){

  alert(
    "Channel editing will be added later."
  );

}


/* =====================================
   LOGOUT
   ===================================== */

function logout(){

  const confirmLogout =
    confirm(
      "Are you sure you want to logout?"
    );


  if(!confirmLogout){

    return;

  }


  /*
     Supabase login information
     remove karo
  */

  localStorage.removeItem(
    "minitube_user"
  );


  localStorage.removeItem(
    "minitube_access_token"
  );


  localStorage.removeItem(
    "minitube_refresh_token"
  );


  /*
     Login page
  */

  window.location.href =
    "login.html";

}


/* =====================================
   LOAD VIDEOS
   ===================================== */

async function loadVideos(){

  const container =
    document.getElementById(
      "videos"
    );


  const count =
    document.getElementById(
      "videoCount"
    );


  try{

    container.innerHTML =
      "Loading videos...";


    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    const videos =
      await response.json();


    count.textContent =
      videos.length;


    renderVideos(
      videos
    );


  }catch(error){

    console.error(
      "Video loading error:",
      error
    );


    count.textContent =
      "0";


    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⚠️
        </div>

        <h2>
          Couldn't load videos
        </h2>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =====================================
   DISPLAY VIDEOS
   ===================================== */

function renderVideos(videos){

  const container =
    document.getElementById(
      "videos"
    );


  if(!Array.isArray(videos)){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⚠️
        </div>

        <h2>
          Something went wrong
        </h2>

        <p>
          Invalid video data received.
        </p>

      </div>

    `;

    return;

  }


  if(videos.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          📹
        </div>


        <h2>
          No videos yet
        </h2>


        <p>
          Upload a video from the Home
          page and it will appear here.
        </p>


        <button
          class="homeButton"
          onclick="goHome()"
        >
          Go to Home
        </button>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  videos.forEach(video => {


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.name
      );


    card.innerHTML = `

      <video
        preload="metadata"
        src="${videoURL}"
      ></video>


      <div class="info">


        <div class="title">

          ${escapeHTML(
            video.name
          )}

        </div>


        <div class="meta">

          My Channel

        </div>


        <button
          class="watchButton"
        >

          ▶ Watch

        </button>


      </div>

    `;


    const videoElement =
      card.querySelector(
        "video"
      );


    const title =
      card.querySelector(
        ".title"
      );


    const watchButton =
      card.querySelector(
        ".watchButton"
      );


    function openVideo(){

      window.location.href =
        "watch.html?video=" +
        encodeURIComponent(
          video.name
        );

    }


    videoElement.addEventListener(
      "click",
      openVideo
    );


    title.addEventListener(
      "click",
      openVideo
    );


    watchButton.addEventListener(
      "click",
      openVideo
    );


    container.appendChild(
      card
    );

  });

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   NAVIGATION
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


function goShorts(){

  window.location.href =
    "shorts.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


/* =====================================
   START MINI TUBE
   ===================================== */

const loggedIn =
  loadLoggedInUser();


if(loggedIn){

  updateSubscribeButton();

  loadVideos();

}

</script>


</body>

</html>
