<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Upload - MiniTube</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:40px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
}

.backButton{
  background:#222;
  border:0;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

.headerTitle{
  flex:1;
  font-size:19px;
  font-weight:bold;
}


/* =========================
   DROP ZONE
   ========================= */

.wrap{
  max-width:560px;
  margin:0 auto;
  padding:22px;
}

.dropZone{
  border:2px dashed #444;
  border-radius:20px;
  padding:50px 24px;
  text-align:center;
  cursor:pointer;
}

.dropZone.drag{
  border-color:#ff0033;
  background:#1a1010;
}

.dropIcon{
  font-size:40px;
  margin-bottom:14px;
}

.dropText{
  font-size:16px;
  font-weight:bold;
}

.dropSubtext{
  color:#999;
  font-size:14px;
  margin-top:8px;
}

.fileInput{
  display:none;
}


/* =========================
   PREVIEW
   ========================= */

.previewCard{
  display:none;
}

.previewCard.show{
  display:block;
}

.previewVideo{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:16px;
  object-fit:contain;
}

.fieldLabel{
  color:#999;
  font-size:13px;
  font-weight:bold;
  margin:18px 0 8px;
}

.fieldInput{
  width:100%;
  background:#222;
  border:1px solid #444;
  border-radius:10px;
  padding:13px 15px;
  color:white;
  font-size:15px;
  outline:none;
}

.fileMeta{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.changeButton{
  background:none;
  border:0;
  color:#6ab0f3;
  font-size:14px;
  cursor:pointer;
  padding:0;
  margin-top:14px;
}


/* =========================
   PROGRESS
   ========================= */

.progressWrap{
  display:none;
  margin-top:18px;
}

.progressWrap.show{
  display:block;
}

.progressLabel{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#ccc;
  margin-bottom:8px;
}

.progressTrack{
  height:8px;
  background:#292929;
  border-radius:8px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:#ff0033;
  transition:width .15s ease;
}


/* =========================
   BUTTONS
   ========================= */

.uploadButton{
  width:100%;
  margin-top:22px;
  background:#ff0033;
  border:0;
  color:white;
  border-radius:26px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.uploadButton:disabled{
  background:#5a1a24;
  cursor:not-allowed;
}

.statusMessage{
  text-align:center;
  margin-top:14px;
  font-size:14px;
  color:#aaa;
}

.statusMessage.error{
  color:#ff6b7a;
}

.statusMessage.success{
  color:#6ee7b7;
}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <div class="top">

    <button
      class="backButton"
      onclick="goBack()"
    >
      ←
    </button>

    <div class="headerTitle">
      Upload video
    </div>

  </div>

</header>


<div class="wrap">


  <!-- DROP ZONE -->

  <div
    id="dropZone"
    class="dropZone"
    onclick="document.getElementById('fileInput').click()"
  >

    <div class="dropIcon">
      🎬
    </div>

    <div class="dropText">
      Tap to choose a video
    </div>

    <div class="dropSubtext">
      or drag and drop a file here
    </div>

  </div>

  <input
    id="fileInput"
    class="fileInput"
    type="file"
    accept="video/*"
  >


  <!-- PREVIEW -->

  <div
    id="previewCard"
    class="previewCard"
  >

    <video
      id="previewVideo"
      class="previewVideo"
      controls
    ></video>


    <div class="fieldLabel">
      Title
    </div>

    <input
      id="fileNameInput"
      class="fieldInput"
      placeholder="Give your video a title"
    >

    <div class="fieldLabel">
      Category
    </div>

    <select
      id="categorySelect"
      class="fieldInput"
    >
      <option value="">No category</option>
      <option value="Music">Music</option>
      <option value="Gaming">Gaming</option>
      <option value="News">News</option>
      <option value="Sports">Sports</option>
    </select>

    <div
      id="fileMeta"
      class="fileMeta"
    ></div>

    <button
      class="changeButton"
      onclick="document.getElementById('fileInput').click()"
    >
      Choose a different video
    </button>


    <div
      id="progressWrap"
      class="progressWrap"
    >

      <div class="progressLabel">

        <span id="progressText">
          Preparing video...
        </span>

        <span id="progressPercent">
          0%
        </span>

      </div>

      <div class="progressTrack">
        <div
          id="progressFill"
          class="progressFill"
        ></div>
      </div>

    </div>


    <button
      id="uploadButton"
      class="uploadButton"
      onclick="startUpload()"
    >
      Upload video
    </button>

    <div
      id="statusMessage"
      class="statusMessage"
    ></div>

    <button
      id="skipCompressionButton"
      class="changeButton"
      style="display:none; margin-top:10px;"
      onclick="uploadOriginalInstead()"
    >
      Upload without compression instead
    </button>

  </div>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   AUTH STORAGE
   ===================================== */

const ACCESS_TOKEN_KEY =
  "minitube_access_token";

const USER_KEY =
  "minitube_user";


function isLoggedIn(){

  return !!(
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    ) &&
    localStorage.getItem(
      USER_KEY
    )
  );

}


/* =====================================
   LOGIN GATE
   ===================================== */

if(!isLoggedIn()){

  const go =
    confirm(
      "Please login first to upload a video.\n\nGo to Login?"
    );


  if(go){

    window.location.href =
      "login.html";

  }else{

    window.location.href =
      "index.html";

  }

}


/* =====================================
   FILE SELECTION
   ===================================== */

let selectedFile =
  null;

let selectedVideoWidth =
  null;

let selectedVideoHeight =
  null;


const fileInput =
  document.getElementById(
    "fileInput"
  );

const dropZone =
  document.getElementById(
    "dropZone"
  );


fileInput.addEventListener(
  "change",
  function(){

    if(fileInput.files[0]){

      handleFile(
        fileInput.files[0]
      );

    }

  }
);


dropZone.addEventListener(
  "dragover",
  function(event){

    event.preventDefault();

    dropZone.classList.add(
      "drag"
    );

  }
);


dropZone.addEventListener(
  "dragleave",
  function(){

    dropZone.classList.remove(
      "drag"
    );

  }
);


dropZone.addEventListener(
  "drop",
  function(event){

    event.preventDefault();

    dropZone.classList.remove(
      "drag"
    );


    const file =
      event.dataTransfer.files[0];


    if(
      file &&
      file.type.startsWith("video/")
    ){

      handleFile(
        file
      );

    }else{

      showStatus(
        "Please drop a video file.",
        "error"
      );

    }

  }
);


function handleFile(file){

  selectedFile =
    file;

  selectedVideoWidth =
    null;

  selectedVideoHeight =
    null;


  const previewVideo =
    document.getElementById(
      "previewVideo"
    );

  previewVideo.src =
    URL.createObjectURL(
      file
    );


  previewVideo.addEventListener(
    "loadedmetadata",
    function onMeta(){

      selectedVideoWidth =
        previewVideo.videoWidth;

      selectedVideoHeight =
        previewVideo.videoHeight;


      previewVideo.removeEventListener(
        "loadedmetadata",
        onMeta
      );

    }
  );


  document.getElementById(
    "skipCompressionButton"
  ).style.display =
    "none";


  document.getElementById(
    "fileNameInput"
  ).value =
    file.name;


  document.getElementById(
    "fileMeta"
  ).textContent =
    formatFileSize(
      file.size
    ) +
    " · " +
    (file.type || "video");


  document.getElementById(
    "previewCard"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "dropZone"
  ).style.display =
    "none";


  document.getElementById(
    "statusMessage"
  ).textContent =
    "";

  document.getElementById(
    "statusMessage"
  ).className =
    "statusMessage";


  document.getElementById(
    "progressWrap"
  ).classList.remove(
    "show"
  );


  const uploadButton =
    document.getElementById(
      "uploadButton"
    );

  uploadButton.disabled =
    false;

  uploadButton.textContent =
    "Upload video";

}


/* =====================================
   UPLOAD ORCHESTRATION
   (Preparing -> Compressing -> Uploading)
   ===================================== */

const COMPRESSION_THRESHOLD =
  360;

let lastRawName =
  "";

let lastCategory =
  "";


function waitForVideoMetadata(){

  return new Promise(function(resolve){

    if(
      selectedVideoWidth &&
      selectedVideoHeight
    ){

      resolve();

      return;

    }


    const previewVideo =
      document.getElementById(
        "previewVideo"
      );


    if(previewVideo.readyState >= 1){

      selectedVideoWidth =
        previewVideo.videoWidth;

      selectedVideoHeight =
        previewVideo.videoHeight;

      resolve();

      return;

    }


    previewVideo.addEventListener(
      "loadedmetadata",
      function once(){

        selectedVideoWidth =
          previewVideo.videoWidth;

        selectedVideoHeight =
          previewVideo.videoHeight;

        previewVideo.removeEventListener(
          "loadedmetadata",
          once
        );

        resolve();

      }
    );

  });

}


async function startUpload(){

  if(!selectedFile){

    return;

  }


  lastRawName =
    document.getElementById(
      "fileNameInput"
    ).value.trim() ||
    selectedFile.name;


  lastCategory =
    document.getElementById(
      "categorySelect"
    ).value;


  const uploadButton =
    document.getElementById(
      "uploadButton"
    );

  const progressWrap =
    document.getElementById(
      "progressWrap"
    );

  const progressFill =
    document.getElementById(
      "progressFill"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const progressPercent =
    document.getElementById(
      "progressPercent"
    );


  uploadButton.disabled =
    true;

  uploadButton.textContent =
    "Preparing...";

  progressWrap.classList.add(
    "show"
  );

  progressFill.style.width =
    "0%";

  progressPercent.textContent =
    "";

  progressText.textContent =
    "Preparing video...";

  showStatus(
    "",
    ""
  );

  document.getElementById(
    "skipCompressionButton"
  ).style.display =
    "none";


  /*
    PHASE 1: figure out the
    video's real resolution.
  */

  await waitForVideoMetadata();


  const shortSide =
    (selectedVideoWidth && selectedVideoHeight)
      ? Math.min(
          selectedVideoWidth,
          selectedVideoHeight
        )
      : null;


  let fileToSend =
    selectedFile;

  let contentTypeToSend =
    selectedFile.type ||
    "video/mp4";


  /*
    PHASE 2: compress only if
    the video is ABOVE 360p on
    its shorter side. Videos at
    or below 360p are uploaded
    as-is (never upscaled).
  */

  if(
    shortSide &&
    shortSide > COMPRESSION_THRESHOLD
  ){

    progressText.textContent =
      "Compressing to 360p...";

    uploadButton.textContent =
      "Compressing...";


    try{

      const compressed =
        await compressTo360p(
          selectedFile,
          selectedVideoWidth,
          selectedVideoHeight,
          function(percent){

            progressFill.style.width =
              percent + "%";

            progressPercent.textContent =
              percent + "%";

          }
        );


      fileToSend =
        compressed;

      contentTypeToSend =
        "video/mp4";


    }catch(error){

      console.error(
        error
      );


      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Try again";

      progressWrap.classList.remove(
        "show"
      );


      showStatus(
        "Couldn't compress this video on your device (" +
        (error && error.message ? error.message : "compression error") +
        "). You can still upload it at its original quality.",
        "error"
      );


      document.getElementById(
        "skipCompressionButton"
      ).style.display =
        "inline-block";


      return;

    }

  }


  /*
    PHASE 3: upload.
  */

  progressFill.style.width =
    "0%";

  progressPercent.textContent =
    "0%";

  progressText.textContent =
    "Uploading...";

  uploadButton.textContent =
    "Uploading...";


  performUpload(
    fileToSend,
    contentTypeToSend,
    lastRawName,
    lastCategory
  );

}


/*
  Fallback when compression fails:
  upload the original file at its
  native resolution instead.
*/

function uploadOriginalInstead(){

  document.getElementById(
    "skipCompressionButton"
  ).style.display =
    "none";


  const uploadButton =
    document.getElementById(
      "uploadButton"
    );

  const progressWrap =
    document.getElementById(
      "progressWrap"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );


  uploadButton.disabled =
    true;

  uploadButton.textContent =
    "Uploading...";

  progressWrap.classList.add(
    "show"
  );

  progressText.textContent =
    "Uploading...";

  showStatus(
    "",
    ""
  );


  performUpload(
    selectedFile,
    selectedFile.type || "video/mp4",
    lastRawName,
    lastCategory
  );

}


/* =====================================
   ACTUAL UPLOAD (unchanged XHR logic)
   ===================================== */

function performUpload(fileToSend, contentType, rawName, category){

  const uploadButton =
    document.getElementById(
      "uploadButton"
    );

  const progressFill =
    document.getElementById(
      "progressFill"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const progressPercent =
    document.getElementById(
      "progressPercent"
    );

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  statusMessage.textContent =
    "";

  statusMessage.className =
    "statusMessage";


  const xhr =
    new XMLHttpRequest();


  xhr.timeout =
    5 * 60 * 1000;


  xhr.open(
    "POST",
    API_BASE +
    "/api/upload?filename=" +
    encodeURIComponent(
      rawName
    ) +
    "&category=" +
    encodeURIComponent(
      category
    )
  );


  xhr.setRequestHeader(
    "Content-Type",
    contentType ||
    "video/mp4"
  );


  xhr.setRequestHeader(
    "Authorization",
    "Bearer " +
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    )
  );


  xhr.upload.addEventListener(
    "progress",
    function(event){

      if(!event.lengthComputable){

        return;

      }


      const percent =
        Math.round(
          (event.loaded / event.total) * 100
        );


      progressFill.style.width =
        percent + "%";

      progressText.textContent =
        "Uploading...";

      progressPercent.textContent =
        percent + "%";

    }
  );


  xhr.addEventListener(
    "load",
    function(){

      let result = {};

      try{

        result =
          JSON.parse(
            xhr.responseText
          );

      }catch(error){

        result = {};

      }


      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        progressFill.style.width =
          "100%";

        progressPercent.textContent =
          "100%";

        progressText.textContent =
          "Upload complete";


        showStatus(
          "Upload complete 🚀 Redirecting...",
          "success"
        );


        setTimeout(
          function(){

            window.location.href =
              "watch.html?video=" +
              encodeURIComponent(
                result.name || rawName
              );

          },
          900
        );


      }else{

        uploadButton.disabled =
          false;

        uploadButton.textContent =
          "Try again";

        showStatus(
          "Upload failed: " +
          (
            result.error ||
            ("server returned " + xhr.status)
          ),
          "error"
        );

      }

    }
  );


  xhr.addEventListener(
    "error",
    function(){

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Try again";

      showStatus(
        "Upload failed: network error. Check your internet connection.",
        "error"
      );

    }
  );


  xhr.addEventListener(
    "timeout",
    function(){

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Try again";

      showStatus(
        "Upload failed: timed out. Try a smaller video or a better connection.",
        "error"
      );

    }
  );


  xhr.send(
    fileToSend
  );

}


function showStatus(message, type){

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );

  statusMessage.textContent =
    message;

  statusMessage.className =
    "statusMessage " +
    type;

}


/* =====================================
   HELPERS
   ===================================== */

function formatFileSize(bytes){

  if(bytes >= 1024 * 1024 * 1024){

    return (
      bytes / (1024 * 1024 * 1024)
    ).toFixed(1) + " GB";

  }


  if(bytes >= 1024 * 1024){

    return (
      bytes / (1024 * 1024)
    ).toFixed(1) + " MB";

  }


  if(bytes >= 1024){

    return (
      bytes / 1024
    ).toFixed(1) + " KB";

  }


  return bytes + " bytes";

}


/* =====================================
   360p COMPRESSION (ffmpeg.wasm,
   single-threaded core — this build
   works on GitHub Pages with no
   special server headers required)
   ===================================== */

let ffmpegLibraryPromise =
  null;

let ffmpegInstance =
  null;


function loadFFmpegLibrary(){

  if(ffmpegLibraryPromise){

    return ffmpegLibraryPromise;

  }


  ffmpegLibraryPromise =
    new Promise(function(resolve, reject){

      if(
        window.FFmpeg &&
        window.FFmpeg.createFFmpeg
      ){

        resolve();

        return;

      }


      const script =
        document.createElement(
          "script"
        );

      script.src =
        "https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js";

      script.onload =
        function(){

          resolve();

        };

      script.onerror =
        function(){

          reject(
            new Error(
              "Could not load the video compression library."
            )
          );

        };

      document.head.appendChild(
        script
      );

    });


  return ffmpegLibraryPromise;

}


async function compressTo360p(file, width, height, onProgress){

  await loadFFmpegLibrary();


  if(
    !window.FFmpeg ||
    !window.FFmpeg.createFFmpeg
  ){

    throw new Error(
      "compression library unavailable"
    );

  }


  const { createFFmpeg, fetchFile } =
    window.FFmpeg;


  if(!ffmpegInstance){

    ffmpegInstance =
      createFFmpeg({

        log: false,

        corePath:
          "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"

      });

  }


  if(!ffmpegInstance.isLoaded()){

    await ffmpegInstance.load();

  }


  ffmpegInstance.setProgress(
    function(progress){

      if(
        !progress ||
        typeof progress.ratio !== "number"
      ){

        return;

      }


      const percent =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(
              progress.ratio * 100
            )
          )
        );


      if(onProgress){

        onProgress(
          percent
        );

      }

    }
  );


  /*
    Scale to a 360px SHORT side,
    keeping the video's own
    orientation (landscape or
    portrait) and aspect ratio.
    -2 keeps the other side even
    (required by the h264 encoder).
  */

  const scaleFilter =
    width >= height
      ? "scale=-2:360"
      : "scale=360:-2";


  const extensionMatch =
    (file.name || "").match(
      /\.([a-zA-Z0-9]+)$/
    );

  const inputName =
    "input." +
    (extensionMatch ? extensionMatch[1] : "mp4");


  ffmpegInstance.FS(
    "writeFile",
    inputName,
    await fetchFile(
      file
    )
  );


  await ffmpegInstance.run(
    "-i", inputName,
    "-vf", scaleFilter,
    "-c:v", "libx264",
    "-preset", "veryfast",
    "-crf", "28",
    "-c:a", "aac",
    "-b:a", "96k",
    "-movflags", "+faststart",
    "output.mp4"
  );


  const data =
    ffmpegInstance.FS(
      "readFile",
      "output.mp4"
    );


  /*
    Free the in-memory files so a
    second upload on the same page
    doesn't accumulate memory.
  */

  try{

    ffmpegInstance.FS(
      "unlink",
      inputName
    );

    ffmpegInstance.FS(
      "unlink",
      "output.mp4"
    );

  }catch(error){

    /* ignore cleanup errors */

  }


  return new Blob(
    [data.buffer],
    { type: "video/mp4" }
  );

}


function goBack(){

  if(
    window.history.length > 1
  ){

    window.history.back();

  }else{

    window.location.href =
      "index.html";

  }

}

</script>

</body>
</html>
