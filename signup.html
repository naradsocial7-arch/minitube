<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniTube - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 25px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff0000;
    }

    .card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #ddd;
    }

    .field {
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #101010;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff0000;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .show-btn {
      position: absolute;
      right: 8px;
      top: 7px;
      height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: #292929;
      color: #ddd;
      cursor: pointer;
      font-size: 12px;
    }

    .show-btn:hover {
      background: #383838;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 5px 0 18px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
      accent-color: red;
    }

    .terms a {
      color: #ddd;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ff0000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:hover {
      background: #d90000;
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #12351e;
      border: 1px solid #245f34;
      color: #a9f5bb;
    }

    .message.error {
      display: block;
      background: #351414;
      border: 1px solid #682727;
      color: #ffb1b1;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #999;
      font-size: 14px;
    }

    .login-link a {
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back {
      text-align: center;
      margin-top: 18px;
    }

    .back a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }

    .back a:hover {
      color: white;
    }

    .loading {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 24px 18px;
      }

      .logo {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ▶ <span>MiniTube</span>
    </div>

    <div class="card">

      <h1>Create your account</h1>

      <div class="subtitle">
        Join MiniTube and start sharing videos.
      </div>

      <form id="signupForm">

        <div class="field">
          <label for="displayName">Display Name</label>
          <input
            id="displayName"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="50"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-btn"
              onclick="togglePassword('password', this)"
            >
              Show
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-wrap">
            <input
              id="confirmPassword"
              type="password"
              placeholder="Enter password again"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-btn"
              onclick="togglePassword('confirmPassword', this)"
            >
              Show
            </button>
          </div>
        </div>

        <label class="terms">
          <input id="terms" type="checkbox" required>

          <span>
            I agree to create a MiniTube account and use the platform
            according to its rules.
          </span>
        </label>

        <button
          id="signupBtn"
          class="signup-btn"
          type="submit"
        >
          <span id="loading" class="loading"></span>
          <span id="btnText">Create Account</span>
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>

    </div>

    <div class="back">
      <a href="index.html">← Back to MiniTube</a>
    </div>

  </div>


<script>

  /* =========================
     MINITUBE SUPABASE CONFIG
  ========================= */

  const SUPABASE_URL =
    "https://vlzssmuzetcbkmzujecs.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_tM8cIA2W3eZVc9AOtCtCtKWg_Suywus3I";

  const MINITUBE_URL =
    "https://naradsocial7-arch.github.io/minitube/";


  /* =========================
     ELEMENTS
  ========================= */

  const form = document.getElementById("signupForm");
  const signupBtn = document.getElementById("signupBtn");
  const btnText = document.getElementById("btnText");
  const loading = document.getElementById("loading");
  const message = document.getElementById("message");


  /* =========================
     PASSWORD SHOW / HIDE
  ========================= */

  function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "Hide";

    } else {

      input.type = "password";
      button.textContent = "Show";

    }

  }


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;

  }


  function clearMessage() {

    message.textContent = "";
    message.className = "message";

  }


  /* =========================
     LOADING
  ========================= */

  function setLoading(isLoading) {

    signupBtn.disabled = isLoading;

    if (isLoading) {

      loading.style.display = "inline-block";
      btnText.textContent = "Creating Account...";

    } else {

      loading.style.display = "none";
      btnText.textContent = "Create Account";

    }

  }


  /* =========================
     FRIENDLY SUPABASE ERRORS
  ========================= */

  function getFriendlyError(error) {

    const msg = String(
      error?.message ||
      error?.msg ||
      error ||
      ""
    ).toLowerCase();


    if (msg.includes("already registered")) {
      return "An account with this email already exists. Please log in.";
    }

    if (msg.includes("user already registered")) {
      return "An account with this email already exists. Please log in.";
    }

    if (msg.includes("invalid email")) {
      return "Please enter a valid email address.";
    }

    if (msg.includes("password")) {
      return "Password must be at least 6 characters long.";
    }

    if (msg.includes("rate limit")) {
      return "Too many attempts. Please wait a little and try again.";
    }

    if (msg.includes("email")) {
      return "There was a problem with this email address.";
    }

    return error?.message ||
           "Unable to create your account. Please try again.";

  }


  /* =========================
     SIGNUP
  ========================= */

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    clearMessage();


    const displayName =
      document.getElementById("displayName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const terms =
      document.getElementById("terms").checked;


    /* VALIDATION */

    if (displayName.length < 2) {

      showMessage(
        "Please enter a valid display name.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters long.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    if (!terms) {

      showMessage(
        "Please accept the terms before creating your account.",
        "error"
      );

      return;
    }


    setLoading(true);


    try {

      const redirectUrl =
        MINITUBE_URL;


      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/signup?redirect_to=" +
        encodeURIComponent(redirectUrl),
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },

          body: JSON.stringify({

            email: email,

            password: password,

            data: {
              display_name: displayName
            }

          })

        }
      );


      const data = await response.json();


      if (!response.ok) {

        throw new Error(
          data?.msg ||
          data?.message ||
          "Signup failed."
        );

      }


      /*
        If email confirmation is enabled,
        Supabase normally returns the user
        without an active session.
      */

      if (data?.user && !data?.session) {

        showMessage(
          "Account created successfully! Please check your email and confirm your account before logging in.",
          "success"
        );

        form.reset();

        setLoading(false);

        return;
      }


      /*
        If email confirmation is disabled,
        Supabase may return an active session.
      */

      if (data?.session && data?.user) {

        localStorage.setItem(
          "minitube_access_token",
          data.session.access_token || ""
        );

        localStorage.setItem(
          "minitube_refresh_token",
          data.session.refresh_token || ""
        );

        localStorage.setItem(
          "minitube_user",
          JSON.stringify(data.user)
        );


        showMessage(
          "Account created! Opening MiniTube...",
          "success"
        );


        setTimeout(function() {

          window.location.href = MINITUBE_URL;

        }, 900);

        return;
      }


      showMessage(
        "Account created. Please check your email to confirm your account.",
        "success"
      );

      form.reset();

      setLoading(false);


    } catch (error) {

      console.error("Signup error:", error);

      showMessage(
        getFriendlyError(error),
        "error"
      );

      setLoading(false);

    }

  });

</script>

</body>
</html>
