<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-size:24px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.search{
  flex:1;
  min-width:0;
  background:#222;
  border:1px solid #444;
  border-radius:30px;
  padding:13px 17px;
  color:white;
  font-size:16px;
  outline:none;
}

.iconButton{
  background:#222;
  border:1px solid #444;
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:19px;
  cursor:pointer;
  flex-shrink:0;
  display:grid;
  place-items:center;
  position:relative;
}

.iconButton .dot{
  position:absolute;
  top:6px;
  right:6px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff0033;
  display:none;
}

.iconButton .dot.show{
  display:block;
}

.menuLinks{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.menuLink{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 4px;
  color:white;
  cursor:pointer;
  border-radius:8px;
  font-size:14px;
}

.menuLink:hover{
  background:#242424;
}

.menuLinkIcon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#7c4dff;
  display:grid;
  place-items:center;
  font-weight:bold;
  cursor:pointer;
  flex-shrink:0;
}

/* LOGIN ACCOUNT */

.accountArea{
  position:relative;
}

.accountMenu{
  display:none;

  position:absolute;
  right:0;
  top:50px;

  width:250px;

  background:#181818;
  border:1px solid #333;
  border-radius:14px;

  padding:15px;

  box-shadow:0 10px 30px rgba(0,0,0,.5);

  z-index:100;
}

.accountMenu.show{
  display:block;
}

.accountAvatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#7c4dff;

  display:grid;
  place-items:center;

  font-size:20px;
  font-weight:bold;

  margin-bottom:10px;
}

.accountName{
  font-weight:bold;
  font-size:16px;
  word-break:break-word;
}

.accountEmail{
  color:#999;
  font-size:13px;
  margin-top:5px;
  word-break:break-word;
}

.loginStatus{
  color:#6ee7b7;
  font-size:13px;
  margin-top:8px;
}

.accountDivider{
  height:1px;
  background:#333;
  margin:14px 0;
}

.accountButton{
  width:100%;
  padding:11px;

  border:0;
  border-radius:9px;

  background:#292929;
  color:white;

  font-weight:bold;
  cursor:pointer;
}

.accountButton:hover{
  background:#383838;
}

.logoutButton{
  background:#ff0033;
}


/* =========================
   CATEGORIES
   ========================= */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:12px;
}

.categories button{
  border:0;
  border-radius:22px;
  padding:10px 18px;
  background:#292929;
  color:white;
  font-size:15px;
  white-space:nowrap;
  cursor:pointer;
}

.categories button.active{
  background:white;
  color:#111;
}


/* =========================
   HERO
   ========================= */

.hero{
  margin:24px 22px;
  padding:28px;
  border-radius:30px;
  background:linear-gradient(120deg,#24132d,#151515);
}

.hero h1{
  margin:0 0 10px;
  font-size:30px;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.upload{
  background:#ff0033;
  color:white;
  border:0;
  border-radius:30px;
  padding:15px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.file{
  display:none;
}

.status{
  text-align:center;
  color:#aaa;
  padding:20px;
}


/* =========================
   VIDEO GRID
   ========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(260px,1fr)
  );
  gap:18px;
  padding:0 22px;
}

.card{
  background:#181818;
  border-radius:16px;
  overflow:hidden;
}

.cardVideo{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
  object-fit:cover;
  cursor:pointer;
}

.cardVideo:hover{
  opacity:.92;
}

.info{
  padding:12px;
}

.title{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
  cursor:pointer;
}

.title:hover{
  text-decoration:underline;
}

.meta{
  color:#999;
  font-size:13px;
  margin-top:7px;
}


/* =========================
   CHANNEL + SUBSCRIBE
   ========================= */

.channelRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:7px;
}

.channelName{
  color:#999;
  font-size:13px;
  cursor:pointer;
}

.subscribeBtn{
  border:0;
  border-radius:22px;
  padding:9px 16px;
  background:#fff;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.subscribeBtn.subscribed{
  background:#292929;
  color:#fff;
  border:1px solid #555;
}


/* =========================
   ACTIONS
   ========================= */

.actions{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:12px;
}

.likeBtn{
  background:none;
  border:0;
  color:#ccc;
  font-size:16px;
  padding:0;
  cursor:pointer;
}

.likeBtn.liked{
  color:#ff0033;
}

.views{
  color:#aaa;
  font-size:15px;
}

.watchBtn{
  margin-top:12px;
  background:#292929;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.watchBtn:hover{
  background:#383838;
}

.delete{
  margin-top:12px;
  margin-left:6px;
  background:#292929;
  color:#ff4964;
  border:0;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#151515;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

.bottom button b{
  display:block;
  font-size:22px;
  color:white;
  margin-bottom:3px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .top{
    gap:8px;
  }

  .logo{
    font-size:19px;
  }

  .avatar{
    width:36px;
    height:36px;
  }

  .iconButton{
    width:36px;
    height:36px;
    font-size:15px;
  }

  .search{
    padding:11px 14px;
    font-size:15px;
  }

  .hero{
    margin:20px 16px;
    padding:24px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:0 16px;
  }

  .channelRow{
    align-items:center;
  }

  .subscribeBtn{
    padding:8px 14px;
  }

  .accountMenu{
    right:-5px;
    width:230px;
  }

}

@media(max-width:400px){

  .top{
    gap:6px;
  }

  .logoText{
    display:none;
  }

  .avatar{
    width:34px;
    height:34px;
    font-size:14px;
  }

  .iconButton{
    width:34px;
    height:34px;
    font-size:14px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <div class="top">

    <div class="logo">
      <span>▶</span> <span class="logoText">MiniTube</span>
    </div>

    <input
      id="search"
      class="search"
      placeholder="Search videos..."
      oninput="filterVideos()"
      onfocus="window.location.href='search.html'"
      onclick="window.location.href='search.html'"
      readonly
    >

    <button
      class="iconButton"
      onclick="window.location.href='notifications.html'"
    >
      🔔
      <span
        id="notifDot"
        class="dot"
      ></span>
    </button>

    <!-- ACCOUNT -->

    <div class="accountArea">

      <div
        id="avatar"
        class="avatar"
        onclick="toggleAccountMenu()"
      >
        M
      </div>


      <div
        id="accountMenu"
        class="accountMenu"
      >

        <div
          id="accountAvatar"
          class="accountAvatar"
        >
          M
        </div>


        <div
          id="accountName"
          class="accountName"
        >
          Account
        </div>


        <div
          id="accountEmail"
          class="accountEmail"
        >
          Not logged in
        </div>


        <div
          id="loginStatus"
          class="loginStatus"
        >
        </div>


        <div class="accountDivider"></div>


        <div class="menuLinks">

          <div
            class="menuLink"
            onclick="window.location.href='channel.html'"
          >
            <span class="menuLinkIcon">👤</span>
            Your channel
          </div>

          <div
            class="menuLink"
            onclick="window.location.href='studio.html'"
          >
            <span class="menuLinkIcon">🎬</span>
            Your videos (Studio)
          </div>

          <div
            class="menuLink"
            onclick="window.location.href='playlist.html'"
          >
            <span class="menuLinkIcon">▤</span>
            Playlists
          </div>

          <div
            class="menuLink"
            onclick="window.location.href='history.html'"
          >
            <span class="menuLinkIcon">🕐</span>
            Watch history
          </div>

          <div
            class="menuLink"
            onclick="window.location.href='settings.html'"
          >
            <span class="menuLinkIcon">⚙</span>
            Settings
          </div>

        </div>


        <div class="accountDivider"></div>


        <button
          id="accountAction"
          class="accountButton"
          onclick="accountAction()"
        >
          Login
        </button>

      </div>

    </div>

  </div>


  <div class="categories">

    <button class="active">
      All
    </button>

    <button>
      Music
    </button>

    <button>
      Gaming
    </button>

    <button>
      News
    </button>

    <button>
      Sports
    </button>

  </div>

</header>


<!-- =========================
     HERO
     ========================= -->

<section class="hero">

  <h1>
    Welcome to MiniTube
  </h1>

  <p id="welcomeText">
    Your own video-sharing platform.
  </p>


  <button
    class="upload"
    onclick="startUpload()"
  >
    + Upload Video
  </button>


  <input
    id="file"
    class="file"
    type="file"
    accept="video/*"
    onchange="uploadVideo()"
  >

</section>


<div
  id="status"
  class="status"
>
  Loading videos...
</div>


<div
  id="videos"
  class="grid"
></div>


<!-- =========================
     BOTTOM NAVIGATION
     ========================= -->

<div class="bottom">

  <button onclick="goHome()">
    <b>⌂</b>
    Home
  </button>


  <button onclick="goShorts()">
    <b>▭</b>
    Clips
  </button>


  <button onclick="window.location.href='upload.html'">
    <b>＋</b>
    Create
  </button>


  <button onclick="goSubscriptions()">
    <b>□</b>
    Subscriptions
  </button>


  <button onclick="goYou()">
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   AUTH STORAGE
   ===================================== */

const ACCESS_TOKEN_KEY =
  "minitube_access_token";

const REFRESH_TOKEN_KEY =
  "minitube_refresh_token";

const USER_KEY =
  "minitube_user";


/* =====================================
   SUBSCRIBE SYSTEM
   ===================================== */

const SUBSCRIBE_KEY =
  "minitube_my_channel_subscribed";


function isSubscribed(){

  return localStorage.getItem(
    SUBSCRIBE_KEY
  ) === "true";

}


function toggleSubscribe(){

  const current =
    isSubscribed();

  localStorage.setItem(
    SUBSCRIBE_KEY,
    String(!current)
  );

  updateSubscribeButtons();

}


function updateSubscribeButtons(){

  const buttons =
    document.querySelectorAll(
      ".subscribeBtn"
    );

  const subscribed =
    isSubscribed();


  buttons.forEach(button => {

    button.classList.toggle(
      "subscribed",
      subscribed
    );


    button.textContent =
      subscribed
        ? "Subscribed"
        : "Subscribe";

  });

}


/* =====================================
   GET LOGGED USER
   ===================================== */

function getLoggedUser(){

  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );

  const savedUser =
    localStorage.getItem(
      USER_KEY
    );


  if(!token || !savedUser){

    return null;

  }


  try{

    return JSON.parse(
      savedUser
    );

  }catch(error){

    console.error(
      "Invalid saved user",
      error
    );

    return null;

  }

}


/* =====================================
   AUTH STATE
   ===================================== */

function isLoggedIn(){

  return !!getLoggedUser();

}


/* =====================================
   GET USER NAME
   ===================================== */

function getUserName(user){

  if(!user){

    return "Account";

  }


  const metadata =
    user.user_metadata ||
    user.userMetadata ||
    {};


  return (

    metadata.display_name ||

    metadata.full_name ||

    metadata.name ||

    user.email ||

    "MiniTube User"

  );

}


/* =====================================
   GET INITIAL
   ===================================== */

function getUserInitial(user){

  const name =
    getUserName(user);


  return name
    .trim()
    .charAt(0)
    .toUpperCase() || "M";

}


/* =====================================
   UPDATE ACCOUNT UI
   ===================================== */

function updateAccountUI(){

  const user =
    getLoggedUser();


  const avatar =
    document.getElementById(
      "avatar"
    );


  const accountAvatar =
    document.getElementById(
      "accountAvatar"
    );


  const accountName =
    document.getElementById(
      "accountName"
    );


  const accountEmail =
    document.getElementById(
      "accountEmail"
    );


  const loginStatus =
    document.getElementById(
      "loginStatus"
    );


  const accountAction =
    document.getElementById(
      "accountAction"
    );


  const welcomeText =
    document.getElementById(
      "welcomeText"
    );


  if(user){

    const name =
      getUserName(user);


    const initial =
      getUserInitial(user);


    avatar.textContent =
      initial;


    accountAvatar.textContent =
      initial;


    accountName.textContent =
      name;


    accountEmail.textContent =
      user.email ||
      "";


    loginStatus.textContent =
      "✓ Logged in";


    accountAction.textContent =
      "Logout";


    accountAction.classList.add(
      "logoutButton"
    );


    welcomeText.textContent =
      "Welcome back, " +
      name +
      "!";


  }else{


    avatar.textContent =
      "M";


    accountAvatar.textContent =
      "M";


    accountName.textContent =
      "Not logged in";


    accountEmail.textContent =
      "Login to your MiniTube account";


    loginStatus.textContent =
      "";


    accountAction.textContent =
      "Login";


    accountAction.classList.remove(
      "logoutButton"
    );


    welcomeText.textContent =
      "Your own video-sharing platform.";

  }

}


/* =====================================
   ACCOUNT MENU
   ===================================== */

function toggleAccountMenu(){

  const menu =
    document.getElementById(
      "accountMenu"
    );


  menu.classList.toggle(
    "show"
  );

}


document.addEventListener(
  "click",
  function(event){

    const area =
      document.querySelector(
        ".accountArea"
      );


    const menu =
      document.getElementById(
        "accountMenu"
      );


    if(
      area &&
      !area.contains(
        event.target
      )
    ){

      menu.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================
   ACCOUNT ACTION
   ===================================== */

function accountAction(){

  if(isLoggedIn()){

    logout();

  }else{

    window.location.href =
      "login.html";

  }

}


/* =====================================
   LOGOUT
   ===================================== */

function logout(){

  const confirmed =
    confirm(
      "Logout from this MiniTube account?"
    );


  if(!confirmed){

    return;

  }


  localStorage.removeItem(
    ACCESS_TOKEN_KEY
  );


  localStorage.removeItem(
    REFRESH_TOKEN_KEY
  );


  localStorage.removeItem(
    USER_KEY
  );


  updateAccountUI();


  document
    .getElementById(
      "accountMenu"
    )
    .classList.remove(
      "show"
    );


  alert(
    "You have been logged out."
  );

}


/* =====================================
   UPLOAD BUTTON
   ===================================== */

function startUpload(){

  if(!isLoggedIn()){

    const go =
      confirm(
        "Please login first to upload a video.\n\nGo to Login?"
      );


    if(go){

      window.location.href =
        "login.html";

    }


    return;

  }


  document
    .getElementById(
      "file"
    )
    .click();

}


/* =====================================
   OPEN WATCH PAGE
   ===================================== */

function openWatch(videoName){

  const url =
    "watch.html?video=" +
    encodeURIComponent(
      videoName
    );

  window.location.href =
    url;

}


/* =====================================
   HOME
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


/* =====================================
   SHORTS
   ===================================== */

function goShorts(){

  window.location.href =
    "shorts.html";

}


/* =====================================
   SUBSCRIPTIONS
   ===================================== */

function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


/* =====================================
   YOU
   ===================================== */

function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   LOAD VIDEOS
   ===================================== */

async function loadVideos(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    status.textContent =
      "Loading videos...";


    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    allVideos =
      await response.json();


    renderVideos(
      allVideos
    );


  }catch(error){

    console.error(
      error
    );


    status.textContent =
      "Unable to load videos.";

  }

}


let allVideos = [];


/* =====================================
   DISPLAY VIDEOS
   ===================================== */

function renderVideos(videos){

  const container =
    document.getElementById(
      "videos"
    );


  const status =
    document.getElementById(
      "status"
    );


  container.innerHTML =
    "";


  if(videos.length === 0){

    status.innerHTML =
      "No videos found.<br><br>" +
      "Upload your first video 🚀";

    return;

  }


  status.textContent =
    videos.length +
    " video(s)";


  videos.forEach(video => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.name
      );


    /* ===============================
       LIKE DATA
       =============================== */

    const likeKey =
      "likes_" +
      video.name;


    const likedKey =
      "liked_" +
      video.name;


    let likes =
      Number(
        localStorage.getItem(
          likeKey
        ) || 0
      );


    let liked =
      localStorage.getItem(
        likedKey
      ) === "true";


    /* ===============================
       VIEW DATA
       =============================== */

    const viewsKey =
      "views_" +
      video.name;


    let views =
      Number(
        localStorage.getItem(
          viewsKey
        ) || 0
      );


    /* ===============================
       CARD HTML
       =============================== */

    card.innerHTML = `

      <video
        class="cardVideo"
        preload="metadata"
        src="${videoURL}"
      ></video>


      <div class="info">

        <div
          class="title"
          title="Watch ${escapeHTML(
            video.name
          )}"
        >
          ${escapeHTML(
            video.name
          )}
        </div>


        <div class="channelRow">

          <div class="channelName">
            My Channel
          </div>


          <button
            class="subscribeBtn"
            onclick="toggleSubscribe()"
          >
            Subscribe
          </button>

        </div>


        <div class="actions">

          <button
            class="likeBtn ${
              liked ? "liked" : ""
            }"
          >

            ${
              liked
                ? "♥"
                : "♡"
            }

            Like

            <span class="likeCount">
              ${likes}
            </span>

          </button>


          <div class="views">

            👁️

            <span class="viewCount">
              ${views}
            </span>

            views

          </div>

        </div>


        <button class="watchBtn">
          ▶ Watch
        </button>


        <button class="delete">
          Delete
        </button>

      </div>

    `;


    /* ===============================
       VIDEO → WATCH PAGE
       =============================== */

    const videoElement =
      card.querySelector(
        ".cardVideo"
      );


    videoElement.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       CHANNEL NAME → CHANNEL PAGE
       =============================== */

    const channelNameElement =
      card.querySelector(
        ".channelName"
      );


    channelNameElement.addEventListener(
      "click",
      function(){

        window.location.href =
          "channel.html";

      }
    );


    /* ===============================
       TITLE → WATCH PAGE
       =============================== */

    const titleElement =
      card.querySelector(
        ".title"
      );


    titleElement.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       WATCH BUTTON
       =============================== */

    const watchButton =
      card.querySelector(
        ".watchBtn"
      );


    watchButton.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       LIKE BUTTON
       =============================== */

    const likeButton =
      card.querySelector(
        ".likeBtn"
      );


    const likeCount =
      card.querySelector(
        ".likeCount"
      );


    likeButton.addEventListener(
      "click",
      function(){

        liked =
          !liked;


        if(liked){

          likes++;

        }else{

          if(likes > 0){

            likes--;

          }

        }


        localStorage.setItem(
          likeKey,
          likes
        );


        localStorage.setItem(
          likedKey,
          liked
        );


        likeButton.classList.toggle(
          "liked",
          liked
        );


        likeButton.innerHTML =
          `${liked ? "♥" : "♡"} Like
          <span class="likeCount">
          ${likes}
          </span>`;

      }
    );


    /* ===============================
       DELETE
       =============================== */

    const deleteButton =
      card.querySelector(
        ".delete"
      );


    deleteButton.addEventListener(
      "click",
      async function(){

        await deleteVideo(
          encodeURIComponent(
            video.name
          )
        );

      }
    );


    container.appendChild(
      card
    );

  });


  updateSubscribeButtons();

}


/* =====================================
   UPLOAD
   ===================================== */

function uploadVideo(){

  const input =
    document.getElementById(
      "file"
    );


  const file =
    input.files[0];


  if(!file){

    return;

  }


  if(!isLoggedIn()){

    alert(
      "Please login first."
    );


    input.value =
      "";


    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  const xhr =
    new XMLHttpRequest();


  /*
    Hard safety timeout.
    If nothing happens for
    5 minutes, stop waiting
    and show an error instead
    of hanging forever.
  */

  xhr.timeout =
    5 * 60 * 1000;


  xhr.open(
    "POST",
    API_BASE +
    "/api/upload?filename=" +
    encodeURIComponent(
      file.name
    )
  );


  xhr.setRequestHeader(
    "Content-Type",
    file.type ||
    "video/mp4"
  );


  xhr.setRequestHeader(
    "Authorization",
    "Bearer " +
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    )
  );


  /*
    Real upload progress,
    so we can SEE it's
    actually moving instead
    of guessing.
  */

  xhr.upload.addEventListener(
    "progress",
    function(event){

      if(!event.lengthComputable){

        return;

      }


      const percent =
        Math.round(
          (event.loaded / event.total) * 100
        );


      status.textContent =
        "Uploading " +
        file.name +
        "... " +
        percent +
        "%";

    }
  );


  xhr.addEventListener(
    "load",
    function(){

      let result = {};

      try{

        result =
          JSON.parse(
            xhr.responseText
          );

      }catch(error){

        result = {};

      }


      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        status.textContent =
          "Upload successful 🚀";


        input.value =
          "";


        loadVideos();


      }else{

        status.textContent =
          "Upload failed: " +
          (
            result.error ||
            ("server returned " + xhr.status)
          );

      }

    }
  );


  xhr.addEventListener(
    "error",
    function(){

      status.textContent =
        "Upload failed: network error. Check your internet connection.";

    }
  );


  xhr.addEventListener(
    "timeout",
    function(){

      status.textContent =
        "Upload failed: timed out. Try a smaller video or a better connection.";

    }
  );


  status.textContent =
    "Uploading " +
    file.name +
    "... 0%";


  xhr.send(file);

}


/* =====================================
   DELETE
   ===================================== */

async function deleteVideo(name){

  if(!isLoggedIn()){

    alert(
      "Please login first."
    );

    return;

  }


  if(
    !confirm(
      "Delete this video?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/delete/" +
        name,
        {
          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " +
              localStorage.getItem(
                ACCESS_TOKEN_KEY
              )
          }

        }
      );


    if(!response.ok){

      throw new Error(
        "Delete failed"
      );

    }


    await loadVideos();


  }catch(error){

    console.error(
      error
    );


    alert(
      "Could not delete video."
    );

  }

}


/* =====================================
   SEARCH
   ===================================== */

function filterVideos(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase();


  const filtered =
    allVideos.filter(
      video =>
        video.name
          .toLowerCase()
          .includes(
            search
          )
    );


  renderVideos(
    filtered
  );

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
