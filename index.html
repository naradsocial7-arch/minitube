<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-size:24px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.search{
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:30px;
  padding:13px 17px;
  color:white;
  font-size:16px;
  outline:none;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#7c4dff;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:12px;
}

.categories button{
  border:0;
  border-radius:22px;
  padding:10px 18px;
  background:#292929;
  color:white;
  font-size:15px;
  white-space:nowrap;
}

.categories button.active{
  background:white;
  color:#111;
}


/* =========================
   HERO
   ========================= */

.hero{
  margin:24px 22px;
  padding:28px;
  border-radius:30px;
  background:linear-gradient(120deg,#24132d,#151515);
}

.hero h1{
  margin:0 0 10px;
  font-size:30px;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.upload{
  background:#ff0033;
  color:white;
  border:0;
  border-radius:30px;
  padding:15px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.file{
  display:none;
}

.status{
  text-align:center;
  color:#aaa;
  padding:20px;
}


/* =========================
   VIDEO GRID
   ========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(260px,1fr)
  );
  gap:18px;
  padding:0 22px;
}

.card{
  background:#181818;
  border-radius:16px;
  overflow:hidden;
}

.cardVideo{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
  object-fit:cover;
  cursor:pointer;
}

.cardVideo:hover{
  opacity:.92;
}

.info{
  padding:12px;
}

.title{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
  cursor:pointer;
}

.title:hover{
  text-decoration:underline;
}

.meta{
  color:#999;
  font-size:13px;
  margin-top:7px;
}


/* =========================
   CHANNEL + SUBSCRIBE
   ========================= */

.channelRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:7px;
}

.channelName{
  color:#999;
  font-size:13px;
}

.subscribeBtn{
  border:0;
  border-radius:22px;
  padding:9px 16px;
  background:#fff;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.subscribeBtn.subscribed{
  background:#292929;
  color:#fff;
  border:1px solid #555;
}


/* =========================
   ACTIONS
   ========================= */

.actions{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:12px;
}

.likeBtn{
  background:none;
  border:0;
  color:#ccc;
  font-size:16px;
  padding:0;
  cursor:pointer;
}

.likeBtn.liked{
  color:#ff0033;
}

.views{
  color:#aaa;
  font-size:15px;
}

.watchBtn{
  margin-top:12px;
  background:#292929;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.watchBtn:hover{
  background:#383838;
}

.delete{
  margin-top:12px;
  margin-left:6px;
  background:#292929;
  color:#ff4964;
  border:0;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#151515;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

.bottom button b{
  display:block;
  font-size:22px;
  color:white;
  margin-bottom:3px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .top{
    gap:9px;
  }

  .logo{
    font-size:21px;
  }

  .avatar{
    width:38px;
    height:38px;
  }

  .hero{
    margin:20px 16px;
    padding:24px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:0 16px;
  }

  .channelRow{
    align-items:center;
  }

  .subscribeBtn{
    padding:8px 14px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <div class="top">

    <div class="logo">
      <span>▶</span> MiniTube
    </div>

    <input
      id="search"
      class="search"
      placeholder="Search videos..."
      oninput="filterVideos()"
    >

    <div class="avatar">
      M
    </div>

  </div>


  <div class="categories">

    <button class="active">
      All
    </button>

    <button>
      Music
    </button>

    <button>
      Gaming
    </button>

    <button>
      News
    </button>

    <button>
      Sports
    </button>

  </div>

</header>


<!-- =========================
     HERO
     ========================= -->

<section class="hero">

  <h1>
    Welcome to MiniTube
  </h1>

  <p>
    Your own video-sharing platform.
  </p>

  <button
    class="upload"
    onclick="document.getElementById('file').click()"
  >
    + Upload Video
  </button>

  <input
    id="file"
    class="file"
    type="file"
    accept="video/*"
    onchange="uploadVideo()"
  >

</section>


<div
  id="status"
  class="status"
>
  Loading videos...
</div>


<div
  id="videos"
  class="grid"
></div>


<!-- =========================
     BOTTOM NAVIGATION
     ========================= -->

<div class="bottom">

  <button onclick="goHome()">
    <b>⌂</b>
    Home
  </button>


  <button onclick="goShorts()">
    <b>▶</b>
    Shorts
  </button>


  <button
    onclick="document.getElementById('file').click()"
  >
    <b>＋</b>
    Create
  </button>


  <button onclick="goSubscriptions()">
    <b>□</b>
    Subscriptions
  </button>


  <button onclick="goYou()">
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   SUBSCRIBE SYSTEM
   ===================================== */

const SUBSCRIBE_KEY =
  "minitube_my_channel_subscribed";


function isSubscribed(){

  return localStorage.getItem(
    SUBSCRIBE_KEY
  ) === "true";

}


function toggleSubscribe(){

  const current =
    isSubscribed();

  localStorage.setItem(
    SUBSCRIBE_KEY,
    String(!current)
  );

  updateSubscribeButtons();

}


function updateSubscribeButtons(){

  const buttons =
    document.querySelectorAll(
      ".subscribeBtn"
    );

  const subscribed =
    isSubscribed();


  buttons.forEach(button => {

    button.classList.toggle(
      "subscribed",
      subscribed
    );


    button.textContent =
      subscribed
        ? "Subscribed"
        : "Subscribe";

  });

}


let allVideos = [];


/* =====================================
   OPEN WATCH PAGE
   ===================================== */

function openWatch(videoName){

  const url =
    "watch.html?video=" +
    encodeURIComponent(videoName);

  window.location.href = url;

}


/* =====================================
   HOME
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


/* =====================================
   SHORTS
   ===================================== */

function goShorts(){

  window.location.href =
    "shorts.html";

}


/* =====================================
   SUBSCRIPTIONS
   ===================================== */

function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


/* =====================================
   YOU
   ===================================== */

function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   LOAD VIDEOS
   ===================================== */

async function loadVideos(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    status.textContent =
      "Loading videos...";


    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    allVideos =
      await response.json();


    renderVideos(
      allVideos
    );


  }catch(error){

    console.error(error);


    status.textContent =
      "Unable to load videos.";

  }

}


/* =====================================
   DISPLAY VIDEOS
   ===================================== */

function renderVideos(videos){

  const container =
    document.getElementById(
      "videos"
    );


  const status =
    document.getElementById(
      "status"
    );


  container.innerHTML = "";


  if(videos.length === 0){

    status.innerHTML =
      "No videos found.<br><br>" +
      "Upload your first video 🚀";

    return;

  }


  status.textContent =
    videos.length +
    " video(s)";


  videos.forEach(video => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.name
      );


    /* ===============================
       LIKE DATA
       =============================== */

    const likeKey =
      "likes_" +
      video.name;


    const likedKey =
      "liked_" +
      video.name;


    let likes =
      Number(
        localStorage.getItem(
          likeKey
        ) || 0
      );


    let liked =
      localStorage.getItem(
        likedKey
      ) === "true";


    /* ===============================
       VIEW DATA
       =============================== */

    const viewsKey =
      "views_" +
      video.name;


    let views =
      Number(
        localStorage.getItem(
          viewsKey
        ) || 0
      );


    /* ===============================
       CARD HTML
       =============================== */

    card.innerHTML = `

      <video
        class="cardVideo"
        preload="metadata"
        src="${videoURL}"
      ></video>


      <div class="info">

        <div
          class="title"
          title="Watch ${escapeHTML(
            video.name
          )}"
        >
          ${escapeHTML(
            video.name
          )}
        </div>


        <div class="channelRow">

          <div class="channelName">
            My Channel
          </div>


          <button
            class="subscribeBtn"
            onclick="toggleSubscribe()"
          >
            Subscribe
          </button>

        </div>


        <div class="actions">

          <button
            class="likeBtn ${
              liked ? "liked" : ""
            }"
          >

            ${
              liked
                ? "♥"
                : "♡"
            }

            Like

            <span class="likeCount">
              ${likes}
            </span>

          </button>


          <div class="views">

            👁️

            <span class="viewCount">
              ${views}
            </span>

            views

          </div>

        </div>


        <button class="watchBtn">
          ▶ Watch
        </button>


        <button class="delete">
          Delete
        </button>

      </div>

    `;


    /* ===============================
       VIDEO → WATCH PAGE
       =============================== */

    const videoElement =
      card.querySelector(
        ".cardVideo"
      );


    videoElement.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       TITLE → WATCH PAGE
       =============================== */

    const titleElement =
      card.querySelector(
        ".title"
      );


    titleElement.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       WATCH BUTTON
       =============================== */

    const watchButton =
      card.querySelector(
        ".watchBtn"
      );


    watchButton.addEventListener(
      "click",
      function(){

        openWatch(
          video.name
        );

      }
    );


    /* ===============================
       LIKE BUTTON
       =============================== */

    const likeButton =
      card.querySelector(
        ".likeBtn"
      );


    const likeCount =
      card.querySelector(
        ".likeCount"
      );


    likeButton.addEventListener(
      "click",
      function(){

        liked =
          !liked;


        if(liked){

          likes++;

        }else{

          if(likes > 0){

            likes--;

          }

        }


        localStorage.setItem(
          likeKey,
          likes
        );


        localStorage.setItem(
          likedKey,
          liked
        );


        likeButton.classList.toggle(
          "liked",
          liked
        );


        likeButton.innerHTML =
          `${liked ? "♥" : "♡"} Like
          <span class="likeCount">
          ${likes}
          </span>`;

      }
    );


    /* ===============================
       DELETE
       =============================== */

    const deleteButton =
      card.querySelector(
        ".delete"
      );


    deleteButton.addEventListener(
      "click",
      async function(){

        await deleteVideo(
          encodeURIComponent(
            video.name
          )
        );

      }
    );


    container.appendChild(
      card
    );

  });


  /* ===============================
     UPDATE SUBSCRIBE BUTTONS
     =============================== */

  updateSubscribeButtons();

}


/* =====================================
   UPLOAD
   ===================================== */

async function uploadVideo(){

  const input =
    document.getElementById(
      "file"
    );


  const file =
    input.files[0];


  if(!file){

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  try{

    status.textContent =
      "Uploading " +
      file.name +
      "...";


    const response =
      await fetch(
        API_BASE +
        "/api/upload?filename=" +
        encodeURIComponent(
          file.name
        ),
        {
          method:"POST",

          headers:{
            "Content-Type":
              file.type ||
              "video/mp4"
          },

          body:file

        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Upload failed"
      );

    }


    status.textContent =
      "Upload successful 🚀";


    input.value = "";


    await loadVideos();


  }catch(error){

    console.error(
      error
    );


    status.textContent =
      "Upload failed: " +
      error.message;

  }

}


/* =====================================
   DELETE
   ===================================== */

async function deleteVideo(name){

  if(
    !confirm(
      "Delete this video?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/delete/" +
        name,
        {
          method:"DELETE"
        }
      );


    if(!response.ok){

      throw new Error(
        "Delete failed"
      );

    }


    await loadVideos();


  }catch(error){

    alert(
      "Could not delete video."
    );

  }

}


/* =====================================
   SEARCH
   ===================================== */

function filterVideos(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase();


  const filtered =
    allVideos.filter(
      video =>
        video.name
          .toLowerCase()
          .includes(
            search
          )
    );


  renderVideos(
    filtered
  );

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   START
   ===================================== */

loadVideos();

</script>

</body>
</html>
