<script>

/* =====================================
   MINITUBE
   LIKE + VIEWS + UPLOAD + DELETE + SEARCH
   ===================================== */

const API_BASE = "YOUR_WORKER_URL";

let allVideos = [];


/* =====================================
   LOAD VIDEOS
   ===================================== */

async function loadVideos(){

  const status = document.getElementById("status");

  try{

    status.textContent = "Loading videos...";

    const response = await fetch(
      API_BASE + "/api/videos"
    );

    if(!response.ok){
      throw new Error("API error");
    }

    allVideos = await response.json();

    renderVideos(allVideos);

  }catch(error){

    console.error(error);

    status.textContent =
      "Unable to load videos.";

  }

}


/* =====================================
   DISPLAY VIDEOS
   ===================================== */

function renderVideos(videos){

  const container =
    document.getElementById("videos");

  const status =
    document.getElementById("status");

  container.innerHTML = "";


  if(videos.length === 0){

    status.innerHTML =
      "No videos found.<br><br>" +
      "Upload your first video 🚀";

    return;

  }


  status.textContent =
    videos.length + " video(s)";


  videos.forEach(video => {

    const card =
      document.createElement("div");

    card.className = "card";


    const encodedName =
      encodeURIComponent(video.name);


    const videoURL =
      API_BASE +
      "/video/" +
      encodedName;


    /* LIKE DATA */

    const likeKey =
      "liked_" + video.name;

    const likeCountKey =
      "likes_" + video.name;


    /* VIEW DATA */

    const viewKey =
      "views_" + video.name;


    let liked =
      localStorage.getItem(likeKey) === "true";


    let likes =
      Number(
        localStorage.getItem(
          likeCountKey
        ) || 0
      );


    let views =
      Number(
        localStorage.getItem(
          viewKey
        ) || 0
      );


    card.innerHTML = `

      <video
        controls
        preload="metadata"
        src="${videoURL}"
        onplay="addView('${encodedName}')"
      ></video>


      <div class="info">

        <div class="title">
          ${escapeHTML(video.name)}
        </div>


        <div class="meta">
          You • Other
        </div>


        <div style="
          display:flex;
          align-items:center;
          gap:18px;
          margin-top:10px;
          flex-wrap:wrap;
        ">


          <!-- LIKE -->

          <button
            onclick="toggleLike('${encodedName}')"
            id="like-${encodedName}"
            style="
              background:none;
              border:0;
              color:${liked ? "#ff0033" : "#ccc"};
              font-size:17px;
              padding:0;
              cursor:pointer;
            "
          >

            ${liked ? "♥" : "♡"} Like

            <span
              id="count-${encodedName}"
            >
              ${likes}
            </span>

          </button>


          <!-- VIEWS -->

          <span style="
            color:#aaa;
            font-size:16px;
          ">

            👁️

            <span
              id="views-${encodedName}"
            >
              ${views}
            </span>

            views

          </span>


        </div>


        <!-- DELETE -->

        <button
          class="delete"
          onclick="deleteVideo('${encodedName}')"
        >
          Delete
        </button>


      </div>

    `;


    container.appendChild(card);

  });

}


/* =====================================
   LIKE SYSTEM
   ===================================== */

function toggleLike(name){

  const decodedName =
    decodeURIComponent(name);


  const likeKey =
    "liked_" + decodedName;


  const likeCountKey =
    "likes_" + decodedName;


  let liked =
    localStorage.getItem(
      likeKey
    ) === "true";


  let likes =
    Number(
      localStorage.getItem(
        likeCountKey
      ) || 0
    );


  if(liked){

    liked = false;

    if(likes > 0){
      likes--;
    }

  }else{

    liked = true;

    likes++;

  }


  localStorage.setItem(
    likeKey,
    liked
  );


  localStorage.setItem(
    likeCountKey,
    likes
  );


  const button =
    document.getElementById(
      "like-" + name
    );


  if(button){

    button.style.color =
      liked
        ? "#ff0033"
        : "#ccc";


    button.innerHTML =
      `${liked ? "♥" : "♡"} Like
       <span id="count-${name}">
         ${likes}
       </span>`;

  }

}


/* =====================================
   VIEW SYSTEM
   ===================================== */

function addView(name){

  const decodedName =
    decodeURIComponent(name);


  const viewKey =
    "views_" + decodedName;


  let views =
    Number(
      localStorage.getItem(
        viewKey
      ) || 0
    );


  views++;


  localStorage.setItem(
    viewKey,
    views
  );


  const viewCount =
    document.getElementById(
      "views-" + name
    );


  if(viewCount){

    viewCount.textContent =
      views;

  }

}


/* =====================================
   UPLOAD
   ===================================== */

async function uploadVideo(){

  const input =
    document.getElementById("file");


  const file =
    input.files[0];


  if(!file){
    return;
  }


  const status =
    document.getElementById("status");


  try{

    status.textContent =
      "Uploading " +
      file.name +
      "...";


    const response =
      await fetch(
        API_BASE +
        "/api/upload?filename=" +
        encodeURIComponent(file.name),
        {
          method:"POST",

          headers:{
            "Content-Type":
              file.type ||
              "video/mp4"
          },

          body:file
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "Upload failed"
      );

    }


    status.textContent =
      "Upload successful 🚀";


    input.value = "";


    await loadVideos();


  }catch(error){

    console.error(error);


    status.textContent =
      "Upload failed: " +
      error.message;

  }

}


/* =====================================
   DELETE VIDEO
   ===================================== */

async function deleteVideo(name){

  if(
    !confirm(
      "Delete this video?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/delete/" +
        name,
        {
          method:"DELETE"
        }
      );


    if(!response.ok){

      throw new Error(
        "Delete failed"
      );

    }


    await loadVideos();


  }catch(error){

    console.error(error);

    alert(
      "Could not delete video."
    );

  }

}


/* =====================================
   SEARCH
   ===================================== */

function filterVideos(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const filtered =
    allVideos.filter(
      video =>
        video.name
          .toLowerCase()
          .includes(search)
    );


  renderVideos(filtered);

}


/* =====================================
   FORMAT SIZE
   ===================================== */

function formatSize(bytes){

  if(bytes < 1024){

    return bytes + " B";

  }


  if(
    bytes <
    1024 * 1024
  ){

    return (
      (bytes / 1024)
        .toFixed(1) +
      " KB"
    );

  }


  return (
    (bytes /
      (1024 * 1024))
      .toFixed(1) +
    " MB"
  );

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return text
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   START MINITUBE
   ===================================== */

loadVideos();

</script>
