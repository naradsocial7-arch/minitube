<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:86px;
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =====================================================
   HEADER
   ===================================================== */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(15,15,15,.96);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #292929;

  padding:12px 16px 10px;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:24px;
  font-weight:800;

  white-space:nowrap;
  cursor:pointer;
}

.logoPlay{
  color:#ff0033;
}

.logoText{
  color:#fff;
}


/* =====================================================
   SEARCH
   ===================================================== */

.searchWrap{
  position:relative;
  flex:1;
  min-width:0;
}

.search{
  width:100%;

  background:#222;
  border:1px solid #444;

  border-radius:30px;

  padding:12px 45px 12px 17px;

  color:#fff;

  font-size:15px;

  outline:none;

  cursor:pointer;
}

.search:hover{
  border-color:#666;
}

.search:focus{
  border-color:#777;
}

.searchIcon{
  position:absolute;

  right:15px;
  top:50%;

  transform:translateY(-50%);

  color:#aaa;

  pointer-events:none;
}


/* =====================================================
   ICON BUTTON
   ===================================================== */

.iconButton{
  position:relative;

  width:42px;
  height:42px;

  flex-shrink:0;

  display:grid;
  place-items:center;

  background:#222;
  border:1px solid #444;

  color:#fff;

  border-radius:50%;

  font-size:18px;

  cursor:pointer;

  transition:.15s;
}

.iconButton:hover{
  background:#2d2d2d;
  transform:translateY(-1px);
}

.iconButton .dot{
  position:absolute;

  top:5px;
  right:5px;

  width:9px;
  height:9px;

  border-radius:50%;

  background:#ff0033;

  display:none;

  border:2px solid #222;
}

.iconButton .dot.show{
  display:block;
}


/* =====================================================
   ACCOUNT
   ===================================================== */

.accountArea{
  position:relative;
  flex-shrink:0;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;

  cursor:pointer;

  border:2px solid transparent;

  transition:.15s;
}

.avatar:hover{
  border-color:#fff;
}


/* =====================================================
   ACCOUNT MENU
   ===================================================== */

.accountMenu{
  display:none;

  position:absolute;

  right:0;
  top:52px;

  width:270px;

  background:#181818;

  border:1px solid #333;

  border-radius:16px;

  padding:15px;

  box-shadow:0 15px 40px rgba(0,0,0,.6);

  z-index:500;
}

.accountMenu.show{
  display:block;
}

.accountHeader{
  display:flex;
  gap:12px;
  align-items:center;
}

.accountAvatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-size:19px;
  font-weight:bold;
}

.accountInfo{
  min-width:0;
}

.accountName{
  font-weight:bold;
  font-size:15px;

  word-break:break-word;
}

.accountEmail{
  color:#999;
  font-size:12px;

  margin-top:4px;

  word-break:break-word;
}

.loginStatus{
  color:#6ee7b7;

  font-size:12px;

  margin-top:4px;
}

.accountDivider{
  height:1px;

  background:#333;

  margin:14px 0;
}

.menuLinks{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.menuLink{
  display:flex;
  align-items:center;
  gap:12px;

  padding:10px;

  color:#fff;

  cursor:pointer;

  border-radius:9px;

  font-size:14px;

  transition:.15s;
}

.menuLink:hover{
  background:#292929;
}

.menuLinkIcon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.accountButton{
  width:100%;

  padding:11px;

  border:0;
  border-radius:9px;

  background:#292929;
  color:#fff;

  font-weight:bold;

  cursor:pointer;
}

.accountButton:hover{
  background:#383838;
}

.logoutButton{
  background:#ff0033;
}

.logoutButton:hover{
  background:#e6002e;
}


/* =====================================================
   CATEGORIES
   ===================================================== */

.categories{
  display:flex;
  gap:9px;

  overflow-x:auto;

  padding:12px 2px 2px;

  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  border:0;

  border-radius:22px;

  padding:9px 17px;

  background:#292929;
  color:#fff;

  font-size:14px;

  white-space:nowrap;

  cursor:pointer;

  transition:.15s;
}

.categories button:hover{
  background:#383838;
}

.categories button.active{
  background:#fff;
  color:#111;
}


/* =====================================================
   HERO
   ===================================================== */

.hero{
  margin:24px 22px;

  padding:30px;

  border-radius:24px;

  background:
    radial-gradient(
      circle at top right,
      rgba(255,0,51,.18),
      transparent 40%
    ),
    linear-gradient(
      120deg,
      #24132d,
      #151515
    );

  border:1px solid #302532;
}

.hero h1{
  margin:0 0 9px;

  font-size:30px;
  line-height:1.2;
}

.hero p{
  margin:0 0 20px;

  color:#aaa;

  font-size:16px;
}

.upload{
  background:#ff0033;
  color:#fff;

  border:0;

  border-radius:28px;

  padding:13px 21px;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;

  transition:.15s;
}

.upload:hover{
  background:#e6002e;
  transform:translateY(-1px);
}

.file{
  display:none;
}


/* =====================================================
   SECTION HEADER
   ===================================================== */

.contentHeader{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:0 22px 14px;
}

.sectionTitle{
  font-size:20px;
  font-weight:700;
}

.videoCount{
  color:#888;
  font-size:13px;
}


/* =====================================================
   STATUS
   ===================================================== */

.status{
  text-align:center;

  color:#aaa;

  padding:18px 20px;

  font-size:14px;
}

.status.error{
  color:#ff7188;
}

.status.success{
  color:#6ee7b7;
}


/* =====================================================
   VIDEO GRID
   ===================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px,1fr)
    );

  gap:22px;

  padding:0 22px;
}


/* =====================================================
   VIDEO CARD
   ===================================================== */

.card{
  min-width:0;

  background:#181818;

  border-radius:14px;

  overflow:hidden;

  border:1px solid transparent;

  transition:
    transform .18s,
    border-color .18s,
    background .18s;
}

.card:hover{
  transform:translateY(-2px);

  border-color:#303030;

  background:#1b1b1b;
}

.cardVideoWrap{
  position:relative;

  background:#000;

  aspect-ratio:16/9;

  overflow:hidden;
}

.cardVideo{
  width:100%;
  height:100%;

  display:block;

  background:#000;

  object-fit:cover;

  cursor:pointer;
}

.cardVideo:hover{
  opacity:.93;
}

.videoBadge{
  position:absolute;

  right:8px;
  bottom:8px;

  background:rgba(0,0,0,.8);

  color:#fff;

  border-radius:5px;

  padding:4px 6px;

  font-size:11px;

  pointer-events:none;
}


/* =====================================================
   CARD INFO
   ===================================================== */

.info{
  padding:12px;
}

.title{
  font-size:16px;

  line-height:1.35;

  font-weight:bold;

  word-break:break-word;

  cursor:pointer;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.title:hover{
  text-decoration:underline;
}

.channelRow{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:9px;
}

.channelName{
  color:#999;

  font-size:13px;

  cursor:pointer;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.channelName:hover{
  color:#fff;
}

.subscribeBtn{
  flex-shrink:0;

  border:0;

  border-radius:20px;

  padding:7px 12px;

  background:#fff;

  color:#111;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;
}

.subscribeBtn:hover{
  background:#ddd;
}

.subscribeBtn.subscribed{
  background:#292929;

  color:#fff;

  border:1px solid #555;
}


/* =====================================================
   ACTIONS
   ===================================================== */

.actions{
  display:flex;

  align-items:center;

  gap:16px;

  margin-top:11px;
}

.likeBtn{
  background:none;

  border:0;

  color:#bbb;

  font-size:14px;

  padding:0;

  cursor:pointer;
}

.likeBtn:hover{
  color:#fff;
}

.likeBtn.liked{
  color:#ff0033;
}

.views{
  color:#888;

  font-size:13px;
}

.watchBtn{
  margin-top:11px;

  background:#292929;

  color:#fff;

  border:0;

  padding:8px 13px;

  border-radius:8px;

  cursor:pointer;

  font-size:13px;
}

.watchBtn:hover{
  background:#383838;
}

.delete{
  margin-top:11px;

  margin-left:5px;

  background:#292929;

  color:#ff4964;

  border:0;

  padding:7px 11px;

  border-radius:8px;

  cursor:pointer;

  font-size:13px;
}

.delete:hover{
  background:#382025;
}


/* =====================================================
   EMPTY STATE
   ===================================================== */

.emptyState{
  grid-column:1/-1;

  text-align:center;

  padding:55px 20px;

  background:#151515;

  border:1px dashed #333;

  border-radius:16px;

  color:#aaa;
}

.emptyIcon{
  font-size:40px;

  margin-bottom:12px;
}

.emptyTitle{
  color:#fff;

  font-size:18px;

  font-weight:bold;

  margin-bottom:7px;
}

.emptyText{
  font-size:14px;
}


/* =====================================================
   BOTTOM NAVIGATION
   ===================================================== */

.bottom{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:72px;

  background:rgba(21,21,21,.97);

  backdrop-filter:blur(12px);

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:200;
}

.bottom button{
  position:relative;

  min-width:65px;

  height:58px;

  background:none;

  border:0;

  color:#888;

  font-size:11px;

  cursor:pointer;

  border-radius:10px;

  padding:4px 8px;

  transition:.15s;
}

.bottom button:hover{
  background:#222;
  color:#fff;
}

.bottom button b{
  display:block;

  font-size:21px;

  line-height:24px;

  color:#aaa;

  margin-bottom:3px;
}

.bottom button.active{
  color:#fff;
}

.bottom button.active b{
  color:#fff;
}


/* CREATE BUTTON */

.createNav{
  width:46px !important;
  min-width:46px !important;

  height:46px !important;

  padding:0 !important;

  margin-bottom:7px;

  border-radius:14px !important;

  background:#fff !important;

  color:#111 !important;

  font-size:25px !important;

  font-weight:bold;
}

.createNav b{
  color:#111 !important;

  font-size:25px !important;

  line-height:42px !important;

  margin:0 !important;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:700px){

  header{
    padding:10px 12px 8px;
  }

  .top{
    gap:8px;
  }

  .logo{
    font-size:19px;
  }

  .search{
    padding:10px 40px 10px 14px;
    font-size:14px;
  }

  .iconButton{
    width:37px;
    height:37px;

    font-size:15px;
  }

  .avatar{
    width:37px;
    height:37px;
  }

  .hero{
    margin:18px 14px;

    padding:23px;

    border-radius:20px;
  }

  .hero h1{
    font-size:25px;
  }

  .hero p{
    font-size:14px;
  }

  .contentHeader{
    padding:0 15px 12px;
  }

  .grid{
    grid-template-columns:1fr;

    gap:16px;

    padding:0 14px;
  }

  .card{
    border-radius:13px;
  }

  .accountMenu{
    right:-4px;

    width:255px;
  }

}


@media(max-width:430px){

  .logoText{
    display:none;
  }

  .logo{
    font-size:18px;
  }

  .search{
    font-size:13px;
  }

  .iconButton{
    width:35px;
    height:35px;
  }

  .avatar{
    width:35px;
    height:35px;
    font-size:13px;
  }

  .categories{
    gap:7px;
  }

  .categories button{
    padding:8px 14px;
    font-size:13px;
  }

  .hero{
    margin:16px 12px;
    padding:20px;
  }

  .hero h1{
    font-size:23px;
  }

  .upload{
    width:100%;
  }

  .bottom{
    height:68px;
  }

  .bottom button{
    min-width:54px;
    font-size:10px;
  }

  .bottom button b{
    font-size:19px;
  }

  .createNav{
    width:42px !important;
    min-width:42px !important;
    height:42px !important;
  }

}


/* =====================================================
   SMALL DEVICES
   ===================================================== */

@media(max-width:350px){

  .bottom button{
    min-width:48px;
    padding-left:3px;
    padding-right:3px;
  }

  .bottom button b{
    font-size:17px;
  }

  .bottom button{
    font-size:9px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

    <div

    </button>


    <button
      onclick="filterByCategory('News',this)"

    </button>

  </div>

</header>



<!-- =====================================================

<section class="hero">

<!-- =====================================================

<!-- =====================================================
     STATUS

<div

<!-- =====================================================
     VIDEO GRID

<div

></div>



<!-- =====================================================
     BOTTOM NAV

<div class="bottom">


  <button

    <b>⌂</b>

<script>

/* =====================================================
   CLOUDFLARE WORKER
   ===================================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://vlzssmuzetcbkmzujecs.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_tM8cIA2W3eZVc9AOtCtCtKWg_Suywus3I";


/* =====================================================
   AUTH STORAGE
   ===================================================== */

const ACCESS_TOKEN_KEY =
  "minitube_access_token";

const REFRESH_TOKEN_KEY =
  "minitube_refresh_token";

const USER_KEY =
  "minitube_user";


/* =====================================================
   GLOBAL DATA
   ===================================================== */

let allVideos = [];

let mySubscriptions = new Set();

let currentCategory = "All";


/* =====================================================
   GET LOGGED USER
   ===================================================== */

function getLoggedUser(){

  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );

  const savedUser =
    localStorage.getItem(
      USER_KEY
    );


  if(!token || !savedUser){

    return null;

  }


  try{

    return JSON.parse(
      savedUser
    );

  }catch(error){

    console.error(
      "Invalid saved user",
      error
    );

    return null;

  }

}


/* =====================================================
   LOGIN CHECK
   ===================================================== */

function isLoggedIn(){

  return !!getLoggedUser();

}


/* =====================================================
   USER NAME
   ===================================================== */

function getUserName(user){

  if(!user){

    return "Account";

  }


  const metadata =
    user.user_metadata ||
    user.userMetadata ||
    {};


  return (

    metadata.display_name ||

    metadata.full_name ||

    metadata.name ||

    user.email ||

    "MiniTube User"

  );

}


/* =====================================================
   USER INITIAL
   ===================================================== */

function getUserInitial(user){

  const name =
    getUserName(user);


  return (
    name
      .trim()
      .charAt(0)
      .toUpperCase()
  ) || "M";

}


/* =====================================================
   ACCOUNT UI
   ===================================================== */

function updateAccountUI(){

  const user =
    getLoggedUser();


  const avatar =
    document.getElementById(
      "avatar"
    );

  const accountAvatar =
    document.getElementById(
      "accountAvatar"
    );

  const accountName =
    document.getElementById(
      "accountName"
    );

  const accountEmail =
    document.getElementById(
      "accountEmail"
    );

  const loginStatus =

function logout(){

    confirm(
      "Logout from this MiniTube account?"
    );


  if(!confirmed){

    return;

  }


  localStorage.removeItem(
    ACCESS_TOKEN_KEY
  );

  localStorage.removeItem(
    REFRESH_TOKEN_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );


  updateAccountUI();


  document
    .getElementById(
      "accountMenu"
    )
    .classList.remove(
      "show"
    );

    new Set();


  renderVideos(
    getFilteredVideos()
  );


  alert(
    "You have been logged out."
  );

}


/* =====================================================
   SUBSCRIPTIONS
   ===================================================== */

async function loadMySubscriptions(){

  const user =
    getLoggedUser();


  if(!user){

    mySubscriptions =
      new Set();

    return;

  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/subscriptions?subscriber_id=eq." +
        encodeURIComponent(
          user.id
        ) +
        "&select=channel_id",

        {
          headers:{
            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_ANON_KEY
          }
        }

      );


    if(!response.ok){

      console.warn(
        "Could not load subscriptions"
      );

      return;

    }


    const rows =
      await response.json();


    mySubscriptions =
      new Set(
        rows.map(
          row => row.channel_id
        )
      );


  }catch(error){

    console.error(
      "Subscription load error:",
      error
    );

  }

}


/* =====================================================
   TOGGLE SUBSCRIBE
   ===================================================== */

async function toggleSubscribeChannel(
  channelId
){

  const user =
    getLoggedUser();


  if(!user){

    const go =
      confirm(
        "Please login first to subscribe.\n\nGo to Login?"
      );


    if(go){

      window.location.href =
        "login.html";

    }

    return;

  }


  if(
    !channelId ||
    user.id === channelId
  ){

    return;

  }


  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );


  const alreadySubscribed =
    mySubscriptions.has(
      channelId
    );


  try{

    let response;


    if(alreadySubscribed){

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/subscriptions?channel_id=eq." +
          encodeURIComponent(
            channelId
          ) +
          "&subscriber_id=eq." +
          encodeURIComponent(
            user.id
          ),

          {
            method:"DELETE",

            headers:{
              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                token
            }
          }

        );


      if(!response.ok){

        throw new Error(
          "Unsubscribe failed"
        );

      }


      mySubscriptions.delete(
        channelId
      );


    }else{

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/subscriptions",

          {
            method:"POST",

            headers:{
              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                token,

              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              channel_id:
                channelId,

              subscriber_id:
                user.id

            })

          }

        );


      if(!response.ok){

        throw new Error(
          "Subscribe failed"
        );

      }


      mySubscriptions.add(
        channelId
      );

    }


    applySubscribeStates();


  }catch(error){

    console.error(
      error
    );

    alert(
      "Could not update subscription."
    );

  }

}


/* =====================================================
   APPLY SUBSCRIBE STATES
   ===================================================== */

function applySubscribeStates(){

  document
    .querySelectorAll(
      ".subscribeBtn"
    )
    .forEach(button => {

      const channelId =
        button.dataset.channelId;


      const subscribed =
        mySubscriptions.has(
          channelId
        );


      button.classList.toggle(
        "subscribed",
        subscribed
      );


      button.textContent =
        subscribed
          ? "Subscribed"
          : "Subscribe";

    });

}

/* =====================================================
   LOAD VIDEOS
   ===================================================== */

async function loadVideos(){

  const status =
    document.getElementById(
      "status"
    );


  const container =
    document.getElementById(
      "videos"
    );


  try{

    status.className =
      "status";

    status.textContent =
      "Loading videos...";


    container.innerHTML =
      "";


    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API returned " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "Invalid video data"
      );

    }


    allVideos =
      data;


    renderVideos(
      getFilteredVideos()
    );


  }catch(error){

    console.error(
      "Video loading error:",
      error
    );


    container.innerHTML =
      "";


    status.className =
      "status error";


    status.innerHTML =
      "Unable to load videos.<br>" +
      "<small>Please check your internet connection and try again.</small>";

  }

}


/* =====================================================
   FILTER DATA
   ===================================================== */

function getFilteredVideos(){

  let videos =
    [...allVideos];


  if(currentCategory !== "All"){

    videos =
      videos.filter(
        video =>
          video.category ===
          currentCategory
      );

  }


  const searchInput =
    document.getElementById(
      "search"
    );


  /*
    Search field is intentionally
    readonly and opens search.html,
    so no client-side search is
    performed here.
  */


  return videos;

}


/* =====================================================
   RENDER VIDEOS
   ===================================================== */

function renderVideos(videos){

  const container =
    document.getElementById(
      "videos"
    );

  const status =
    document.getElementById(
      "status"
    );

  const videoCount =
    document.getElementById(
      "videoCount"
    );


  container.innerHTML =
    "";


  if(!Array.isArray(videos)){

    videos = [];

  }


  videoCount.textContent =
    videos.length +
    (
      videos.length === 1
        ? " video"
        : " videos"
    );


  if(videos.length === 0){

    status.textContent =
      "";

    container.innerHTML = `

      <div class="emptyState">

        <div class="emptyIcon">
          📺
        </div>

        <div class="emptyTitle">
          No videos found
        </div>

        <div class="emptyText">
          ${
            currentCategory === "All"
              ? "Be the first to upload a video on MiniTube."
              : "There are no videos in this category yet."
          }
        </div>

      </div>

    `;

    return;

  }


  status.textContent =
    "";


  videos.forEach(
    video => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const videoKey =
        video.r2_key;


      if(!videoKey){

        return;

      }


      const displayTitle =
        video.title ||
        video.r2_key ||
        "Untitled video";


      const ownerName =
        (
          video.profiles &&
          video.profiles.display_name
        ) ||
        "Unknown creator";


      const currentUser =
        getLoggedUser();


      const isOwnVideo =
        currentUser &&
        currentUser.id ===
        video.owner_id;


      const videoURL =
        API_BASE +
        "/video/" +
        encodeURIComponent(
          videoKey
        );


      /* =================================
         LIKE DATA
         ================================= */

      const likeKey =
        "likes_" +
        videoKey;


      const likedKey =
        "liked_" +
        videoKey;


      let likes =
        Number(
          localStorage.getItem(
            likeKey
          ) || 0
        );


      let liked =
        localStorage.getItem(
          likedKey
        ) === "true";


      /* =================================
         VIEW DATA
         ================================= */

      const viewsKey =
        "views_" +
        videoKey;


      let views =
        Number(
          localStorage.getItem(
            viewsKey
          ) || 0
        );


      /* =================================
         CARD
         ================================= */

      card.innerHTML = `

        <div class="cardVideoWrap">

          <video
            class="cardVideo"
            preload="metadata"
            src="${videoURL}"
            playsinline
          ></video>

          <div class="videoBadge">
            ▶ Watch
          </div>

        </div>


        <div class="info">


          <div
            class="title"
            title="${escapeHTML(
              displayTitle
            )}"
          >
            ${escapeHTML(
              displayTitle
            )}
          </div>


          <div class="channelRow">


            <div
              class="channelName"
              title="${escapeHTML(
                ownerName
              )}"
            >
              ${escapeHTML(
                ownerName
              )}
            </div>


            ${
              isOwnVideo
                ? ""
                : `
                  <button
                    class="subscribeBtn"
                    data-channel-id="${escapeHTML(
                      video.owner_id || ""
                    )}"
                  >
                    Subscribe
                  </button>
                `
            }


          </div>


          <div class="actions">


            <button
              class="likeBtn ${
                liked
                  ? "liked"
                  : ""
              }"
            >

              ${
                liked
                  ? "♥"
                  : "♡"
              }

              Like

              <span class="likeCount">
                ${likes}
              </span>

            </button>


            <div class="views">

              👁️

              <span class="viewCount">
                ${views}
              </span>

              views

            </div>


          </div>


          <button class="watchBtn">
            ▶ Watch
          </button>


          ${
            isOwnVideo
              ? `
                <button class="delete">
                  Delete
                </button>
              `
              : ""
          }


        </div>

      `;


      /* =================================
         VIDEO CLICK
         ================================= */

      const videoElement =
        card.querySelector(
          ".cardVideo"
        );


      videoElement.addEventListener(
        "click",
        function(){

          openWatch(
            videoKey
          );

        }
      );


      /* =================================
         CHANNEL CLICK
         ================================= */

      const channelElement =
        card.querySelector(
          ".channelName"
        );


      channelElement.addEventListener(
        "click",
        function(){

          if(
            !video.owner_id
          ){

            return;

          }


          window.location.href =
            isOwnVideo
              ? "channel.html"
              : "channel.html?id=" +
                encodeURIComponent(
                  video.owner_id
                );

        }
      );


      /* =================================
         TITLE CLICK
         ================================= */

      const titleElement =
        card.querySelector(
          ".title"
        );


      titleElement.addEventListener(
        "click",
        function(){

          openWatch(
            videoKey
          );

        }
      );


      /* =================================
         WATCH BUTTON
         ================================= */

      const watchButton =
        card.querySelector(
          ".watchBtn"
        );


      watchButton.addEventListener(
        "click",
        function(){

          openWatch(
            videoKey
          );

        }
      );


      /* =================================
         SUBSCRIBE BUTTON
         ================================= */

      const subscribeButton =
        card.querySelector(
          ".subscribeBtn"
        );


      if(subscribeButton){

        subscribeButton.addEventListener(
          "click",
          function(){

            toggleSubscribeChannel(
              subscribeButton.dataset.channelId
            );

          }
        );

      }


      /* =================================
         LIKE BUTTON
         ================================= */

      const likeButton =
        card.querySelector(
          ".likeBtn"
        );


      const likeCount =
        card.querySelector(
          ".likeCount"
        );


      likeButton.addEventListener(
        "click",
        function(){

          liked =
            !liked;


          if(liked){

            likes++;

          }else if(
            likes > 0
          ){

            likes--;

          }


          localStorage.setItem(
            likeKey,
            likes
          );


          localStorage.setItem(
            likedKey,
            liked
          );


          likeButton.classList.toggle(
            "liked",
            liked
          );


          likeButton.innerHTML =
            `
              ${liked ? "♥" : "♡"}
              Like
              <span class="likeCount">
                ${likes}
              </span>
            `;

        }
      );


      /* =================================
         DELETE BUTTON
         ================================= */

      const deleteButton =
        card.querySelector(
          ".delete"
        );


      if(deleteButton){

        deleteButton.addEventListener(
          "click",
          async function(){

            await deleteVideo(
              videoKey
            );

          }
        );

      }


      container.appendChild(
        card
      );

    }
  );


  applySubscribeStates();

}


/* =====================================================
   DELETE VIDEO
   ===================================================== */

async function deleteVideo(
  videoName
){

  if(!isLoggedIn()){

    alert(
      "Please login first."
    );

    return;

  }


  if(
    !confirm(
      "Delete this video?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(

        API_BASE +
        "/api/delete/" +
        encodeURIComponent(
          videoName
        ),

        {
          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " +
              localStorage.getItem(
                ACCESS_TOKEN_KEY
              )
          }

        }

      );


    if(!response.ok){

      throw new Error(
        "Delete failed"
      );

    }


    alert(
      "Video deleted."
    );


    await loadVideos();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Could not delete video."
    );

  }

}


/* =====================================================
   CATEGORY FILTER
   ===================================================== */

function filterByCategory(
  category,
  buttonEl
){

  currentCategory =
    category;


  document
    .querySelectorAll(
      ".categories button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


  buttonEl.classList.add(
    "active"
  );


  renderVideos(
    getFilteredVideos()
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   NOTIFICATION DOT
   ===================================================== */

function updateNotificationDot(){

  try{

    const notifications =
      JSON.parse(
        localStorage.getItem(
          "minitube_notifications"
        ) || "[]"
      );


    const hasUnread =
      Array.isArray(
        notifications
      ) &&
      notifications.some(
        notification =>
          !notification.read
      );


    document
      .getElementById(
        "notifDot"
      )
      .classList.toggle(
        "show",
        hasUnread
      );


  }catch(error){

    console.error(
      error
    );

  }

}
