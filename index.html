<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniTube</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0f0f0f;color:#fff;
 font-family:Arial,sans-serif;padding-bottom:75px
}
header{
 position:sticky;top:0;z-index:10;background:#111;
 padding:12px;border-bottom:1px solid #292929
}
.top{display:flex;align-items:center;gap:12px}
.logo{font-size:24px;font-weight:800;white-space:nowrap}
.logo b{color:#ff0033}
.search{
 flex:1;background:#222;border:1px solid #444;
 border-radius:25px;padding:12px 16px;color:white;
 outline:none;font-size:15px
}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:#7c4dff;display:grid;place-items:center;
 font-weight:bold
}
.categories{
 display:flex;gap:10px;overflow-x:auto;padding:12px 0 2px
}
.categories button{
 border:0;border-radius:22px;padding:10px 18px;
 background:#292929;color:white;white-space:nowrap
}
.categories button.active{background:white;color:#111}

.hero{
 margin:20px;border-radius:22px;padding:28px;
 background:linear-gradient(120deg,#24132d,#151515)
}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{color:#aaa}
.upload{
 background:#ff0033;color:white;border:0;
 border-radius:28px;padding:15px 22px;font-weight:bold;
 font-size:16px
}

.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:16px;padding:0 20px
}
.card{cursor:pointer}
.thumb{
 width:100%;aspect-ratio:16/9;background:#222;
 border-radius:15px;display:grid;place-items:center;
 overflow:hidden
}
.thumb video{width:100%;height:100%;object-fit:cover}
.play{font-size:45px}
.title{font-size:17px;font-weight:bold;margin-top:9px}
.meta{color:#999;margin-top:5px;font-size:14px}
.like{color:#ccc;margin-top:8px}

.bottom{
 position:fixed;bottom:0;left:0;right:0;
 height:70px;background:#151515;border-top:1px solid #333;
 display:flex;justify-content:space-around;z-index:20
}
.bottom button{
 background:none;border:0;color:#aaa;font-size:13px
}
.bottom button span{display:block;font-size:25px;margin-bottom:3px}
.bottom button.active{color:white}

.modal{
 display:none;position:fixed;inset:0;background:#000b;
 z-index:50;align-items:center;justify-content:center;padding:20px
}
.box{
 background:#181818;border-radius:20px;padding:22px;
 width:100%;max-width:430px
}
.box h2{margin-top:0}
.box input,.box select{
 width:100%;padding:13px;margin:8px 0;
 border-radius:10px;border:1px solid #444;
 background:#252525;color:white
}
.close{
 float:right;background:none;border:0;color:white;
 font-size:25px
}
.primary{
 width:100%;padding:14px;border:0;border-radius:12px;
 background:#ff0033;color:white;font-weight:bold;margin-top:10px
}
.empty{
 text-align:center;color:#888;padding:50px 20px
}

@media(max-width:600px){
 .grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:0 14px}
 .hero{margin:14px;padding:22px}
 .title{font-size:15px}
}
</style>
</head>

<body>

<header>
 <div class="top">
  <div class="logo"><b>▶</b> MiniTube</div>
  <input id="search" class="search" placeholder="Search videos...">
  <div class="avatar">M</div>
 </div>

 <div class="categories">
  <button class="active" onclick="category('All',this)">All</button>
  <button onclick="category('Music',this)">Music</button>
  <button onclick="category('Gaming',this)">Gaming</button>
  <button onclick="category('News',this)">News</button>
  <button onclick="category('Sports',this)">Sports</button>
  <button onclick="category('Shorts',this)">Shorts</button>
 </div>
</header>

<section class="hero">
 <h1>Welcome to MiniTube</h1>
 <p>Your experimental video-sharing platform.</p>
 <button class="upload" onclick="openUpload()">＋ Upload Video</button>
</section>

<main id="feed" class="grid"></main>

<div id="empty" class="empty" style="display:none">
 No videos found.<br><br>
 Upload your first video 🚀
</div>

<nav class="bottom">
 <button class="active" onclick="showHome(this)">
  <span>⌂</span>Home
 </button>
 <button onclick="category('Shorts',this)">
  <span>▶</span>Shorts
 </button>
 <button onclick="openUpload()">
  <span>＋</span>Create
 </button>
 <button onclick="alert('Subscriptions coming soon!')">
  <span>▣</span>Subscriptions
 </button>
 <button onclick="alert('Your MiniTube profile')">
  <span>●</span>You
 </button>
</nav>

<div id="modal" class="modal">
 <div class="box">
  <button class="close" onclick="closeUpload()">×</button>
  <h2>Upload Video</h2>

  <input id="videoTitle" placeholder="Video title">

  <select id="videoCategory">
   <option>Music</option>
   <option>Gaming</option>
   <option>News</option>
   <option>Sports</option>
   <option>Shorts</option>
   <option>Other</option>
  </select>

  <input id="videoFile" type="file" accept="video/*">

  <button class="primary" onclick="saveVideo()">
   Upload to MiniTube
  </button>
 </div>
</div>

<div id="player" class="modal">
 <div class="box">
  <button class="close" onclick="closePlayer()">×</button>
  <h2 id="playerTitle"></h2>
  <video id="mainVideo" controls playsinline
   style="width:100%;border-radius:12px"></video>
 </div>
</div>

<script>
let videos=[];
let currentCategory="All";

const DB="MiniTubeDB";
const STORE="videos";

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB,1);

  r.onupgradeneeded=e=>{
   e.target.result.createObjectStore(STORE,{keyPath:"id"})
  };

  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

async function saveToDB(video){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  tx.objectStore(STORE).put(video);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

async function getVideos(){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readonly");
  const r=tx.objectStore(STORE).getAll();
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

async function load(){
 videos=await getVideos();
 render();
}

function render(){
 const feed=document.getElementById("feed");
 const empty=document.getElementById("empty");
 feed.innerHTML="";

 const search=document.getElementById("search").value.toLowerCase();

 const filtered=videos.filter(v=>{
  const cat=currentCategory==="All" || v.category===currentCategory;
  const text=v.title.toLowerCase().includes(search);
  return cat && text;
 });

 if(filtered.length===0){
  empty.style.display="block";
  return;
 }

 empty.style.display="none";

 filtered.forEach(v=>{
  const url=URL.createObjectURL(v.file);

  const card=document.createElement("article");
  card.className="card";

  card.innerHTML=`
   <div class="thumb">
    <video src="${url}" muted preload="metadata"></video>
   </div>
   <div class="title">${escapeHTML(v.title)}</div>
   <div class="meta">You • ${v.category}</div>
   <div class="like" onclick="event.stopPropagation();like('${v.id}')">
    ♡ Like
   </div>
  `;

  card.onclick=()=>play(v,url);

  feed.appendChild(card);
 });
}

function escapeHTML(text){
 return text.replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[m]));
}

function openUpload(){
 document.getElementById("modal").style.display="flex";
}

function closeUpload(){
 document.getElementById("modal").style.display="none";
}

async function saveVideo(){
 const title=document.getElementById("videoTitle").value.trim();
 const category=document.getElementById("videoCategory").value;
 const file=document.getElementById("videoFile").files[0];

 if(!title){
  alert("Video title likho.");
  return;
 }

 if(!file){
  alert("Pehle video select karo.");
  return;
 }

 const video={
  id:Date.now().toString(),
  title,
  category,
  file
 };

 await saveToDB(video);

 document.getElementById("videoTitle").value="";
 document.getElementById("videoFile").value="";

 closeUpload();

 await load();

 alert("🎉 Video MiniTube mein upload ho gaya!");
}

function play(v,url){
 document.getElementById("playerTitle").textContent=v.title;

 const player=document.getElementById("mainVideo");
 player.src=url;

 document.getElementById("player").style.display="flex";
 player.play().catch(()=>{});
}

function closePlayer(){
 const player=document.getElementById("mainVideo");
 player.pause();
 player.src="";
 document.getElementById("player").style.display="none";
}

function category(cat,button){
 currentCategory=cat;

 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));

 if(button && button.classList.contains("categories"))
  button.classList.add("active");

 render();
}

function showHome(button){
 currentCategory="All";
 document.querySelectorAll(".bottom button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function like(id){
 alert("❤️ Liked!");
}

document.getElementById("search")
 .addEventListener("input",render);

load();
</script>

</body>
</html>
