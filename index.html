<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTube</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-size:24px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.search{
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:30px;
  padding:13px 17px;
  color:white;
  font-size:16px;
  outline:none;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#7c4dff;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:12px;
}

.categories button{
  border:0;
  border-radius:22px;
  padding:10px 18px;
  background:#292929;
  color:white;
  font-size:15px;
  white-space:nowrap;
}

.categories button.active{
  background:white;
  color:#111;
}

.hero{
  margin:24px 22px;
  padding:28px;
  border-radius:30px;
  background:linear-gradient(120deg,#24132d,#151515);
}

.hero h1{
  margin:0 0 10px;
  font-size:30px;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.upload{
  background:#ff0033;
  color:white;
  border:0;
  border-radius:30px;
  padding:15px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.file{
  display:none;
}

.status{
  text-align:center;
  color:#aaa;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
  padding:0 22px;
}

.card{
  background:#181818;
  border-radius:16px;
  overflow:hidden;
}

.card video{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
}

.info{
  padding:12px;
}

.title{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.meta{
  color:#999;
  font-size:13px;
  margin-top:7px;
}

.delete{
  margin-top:10px;
  background:#292929;
  color:#ff4964;
  border:0;
  padding:8px 12px;
  border-radius:8px;
}

.empty{
  text-align:center;
  color:#888;
  padding:60px 20px;
  font-size:18px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#151515;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
}

.bottom button b{
  display:block;
  font-size:22px;
  color:white;
  margin-bottom:3px;
}

@media(max-width:600px){
  .top{
    gap:9px;
  }

  .logo{
    font-size:21px;
  }

  .avatar{
    width:38px;
    height:38px;
  }

  .hero{
    margin:20px 16px;
    padding:24px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:0 16px;
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div class="logo">
      <span>▶</span> MiniTube
    </div>

    <input
      id="search"
      class="search"
      placeholder="Search videos..."
      oninput="filterVideos()"
    >

    <div class="avatar">M</div>

  </div>

  <div class="categories">
    <button class="active">All</button>
    <button>Music</button>
    <button>Gaming</button>
    <button>News</button>
    <button>Sports</button>
  </div>

</header>


<section class="hero">

  <h1>Welcome to MiniTube</h1>

  <p>
    Your own video-sharing platform.
  </p>

  <button
    class="upload"
    onclick="document.getElementById('file').click()"
  >
    + Upload Video
  </button>

  <input
    id="file"
    class="file"
    type="file"
    accept="video/*"
    onchange="uploadVideo()"
  >

</section>


<div id="status" class="status">
  Loading videos...
</div>

<div id="videos" class="grid"></div>


<div class="bottom">

  <button>
    <b>⌂</b>
    Home
  </button>

  <button>
    <b>▶</b>
    Shorts
  </button>

  <button onclick="document.getElementById('file').click()">
    <b>＋</b>
    Create
  </button>

  <button>
    <b>□</b>
    Subscriptions
  </button>

  <button>
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   IMPORTANT:
   Replace YOUR_WORKER_URL with your
   Cloudflare Worker URL.
   ===================================== */

const API_BASE = "YOUR_WORKER_URL";


let allVideos = [];


/* LOAD VIDEOS */

async function loadVideos(){

  const status = document.getElementById("status");

  try{

    status.textContent = "Loading videos...";

    const response = await fetch(
      API_BASE + "/api/videos"
    );

    if(!response.ok){
      throw new Error("API error");
    }

    allVideos = await response.json();

    renderVideos(allVideos);

  }catch(error){

    console.error(error);

    status.textContent =
      "Unable to load videos.";

  }

}


/* DISPLAY VIDEOS */

function renderVideos(videos){

  const container =
    document.getElementById("videos");

  const status =
    document.getElementById("status");

  container.innerHTML = "";

  if(videos.length === 0){

    status.innerHTML =
      "No videos found.<br><br>Upload your first video 🚀";

    return;

  }

  status.textContent =
    videos.length + " video(s)";

  videos.forEach(video => {

    const card =
      document.createElement("div");

    card.className = "card";

    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(video.name);

    card.innerHTML = `

      <video
        controls
        preload="metadata"
        src="${videoURL}">
      </video>

      <div class="info">

        <div class="title">
          ${escapeHTML(video.name)}
        </div>

        <div class="meta">
          ${formatSize(video.size)}
        </div>

        <button
          class="delete"
          onclick="deleteVideo('${encodeURIComponent(video.name)}')"
        >
          Delete
        </button>

      </div>

    `;

    container.appendChild(card);

  });

}


/* UPLOAD */

async function uploadVideo(){

  const input =
    document.getElementById("file");

  const file =
    input.files[0];

  if(!file){
    return;
  }

  const status =
    document.getElementById("status");

  try{

    status.textContent =
      "Uploading " + file.name + "...";

    const response =
      await fetch(
        API_BASE +
        "/api/upload?filename=" +
        encodeURIComponent(file.name),
        {
          method:"POST",
          headers:{
            "Content-Type":
              file.type || "video/mp4"
          },
          body:file
        }
      );

    const result =
      await response.json();

    if(!response.ok){
      throw new Error(
        result.error || "Upload failed"
      );
    }

    status.textContent =
      "Upload successful 🚀";

    input.value = "";

    await loadVideos();

  }catch(error){

    console.error(error);

    status.textContent =
      "Upload failed: " +
      error.message;

  }

}


/* DELETE */

async function deleteVideo(name){

  if(!confirm("Delete this video?")){
    return;
  }

  try{

    const response =
      await fetch(
        API_BASE +
        "/api/delete/" +
        name,
        {
          method:"DELETE"
        }
      );

    if(!response.ok){
      throw new Error("Delete failed");
    }

    await loadVideos();

  }catch(error){

    alert(
      "Could not delete video."
    );

  }

}


/* SEARCH */

function filterVideos(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const filtered =
    allVideos.filter(video =>
      video.name
        .toLowerCase()
        .includes(search)
    );

  renderVideos(filtered);

}


/* HELPERS */

function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );
  }

  return (
    (bytes / (1024 * 1024)).toFixed(1) +
    " MB"
  );

}


function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

loadVideos();

</script>

</body>
</html>
