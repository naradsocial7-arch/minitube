<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MiniTube - Subscriptions</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:20;

  height:64px;

  background:#111;

  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  padding:0 16px;

  gap:14px;
}

.back{
  background:none;
  border:0;

  color:white;

  font-size:30px;

  cursor:pointer;
}

.logo{
  font-size:23px;
  font-weight:800;

  white-space:nowrap;
}

.logo span{
  color:#ff0033;
}

.spacer{
  flex:1;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;
  place-items:center;

  font-weight:bold;

  overflow:hidden;

  cursor:pointer;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================
   PAGE TITLE
   ========================= */

.pageTitle{
  padding:25px 20px 10px;
}

.pageTitle h1{
  margin:0;

  font-size:28px;
}

.pageTitle p{
  color:#999;

  margin-top:8px;
}


/* =========================
   CHANNEL
   ========================= */

.channelBox{

  margin:10px 20px 25px;

  background:#181818;

  border-radius:16px;

  padding:16px;

  display:flex;

  align-items:center;

  gap:14px;
}

.channelAvatar{

  width:55px;
  height:55px;

  border-radius:50%;

  background:#7c4dff;

  display:grid;

  place-items:center;

  font-weight:bold;

  font-size:20px;

  flex-shrink:0;

  overflow:hidden;
}

.channelAvatar img{

  width:100%;
  height:100%;

  object-fit:cover;
}

.channelInfo{

  flex:1;

  min-width:0;
}

.channelName{

  font-weight:bold;

  font-size:16px;

  word-break:break-word;
}

.channelStatus{

  color:#999;

  font-size:13px;

  margin-top:5px;
}

.unsubscribe{

  background:#292929;

  color:white;

  border:1px solid #555;

  border-radius:22px;

  padding:9px 15px;

  font-weight:bold;

  cursor:pointer;

  white-space:nowrap;
}


/* =========================
   FEED
   ========================= */

.feed{

  padding:0 20px;
}

.feedTitle{

  font-size:20px;

  font-weight:bold;

  margin-bottom:15px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px,1fr)
    );

  gap:18px;
}

.card{

  background:#181818;

  border-radius:16px;

  overflow:hidden;
}

.card video{

  width:100%;

  aspect-ratio:16/9;

  display:block;

  background:#000;

  cursor:pointer;

  object-fit:cover;
}

.info{

  padding:12px;
}

.title{

  font-size:17px;

  font-weight:bold;

  word-break:break-word;
}

.meta{

  color:#999;

  font-size:13px;

  margin-top:7px;
}

.watchButton{

  margin-top:12px;

  background:#292929;

  color:white;

  border:0;

  padding:9px 14px;

  border-radius:8px;

  cursor:pointer;
}


/* =========================
   EMPTY
   ========================= */

.empty{

  background:#181818;

  border:1px solid #292929;

  border-radius:16px;

  padding:45px 20px;

  text-align:center;
}

.emptyIcon{

  font-size:45px;

  margin-bottom:15px;
}

.empty h2{

  margin:0 0 8px;
}

.empty p{

  color:#999;

  line-height:1.5;

  margin:0;
}

.homeBtn{

  margin-top:20px;

  background:#ff0033;

  color:white;

  border:0;

  border-radius:25px;

  padding:13px 22px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:#151515;

  border-top:1px solid #333;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:30;
}

.bottom button{

  background:none;

  border:0;

  color:#aaa;

  font-size:13px;

  cursor:pointer;
}

.bottom button b{

  display:block;

  font-size:22px;

  color:white;

  margin-bottom:3px;
}

.bottom .active{

  color:white;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .pageTitle{

    padding-left:16px;
    padding-right:16px;
  }

  .channelBox{

    margin-left:16px;
    margin-right:16px;
  }

  .feed{

    padding:0 16px;
  }

  .grid{

    grid-template-columns:1fr;
  }

  .unsubscribe{

    padding:8px 12px;

    font-size:12px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <button
    class="back"
    onclick="goHome()"
  >
    ‹
  </button>


  <div class="logo">

    <span>▶</span>

    MiniTube

  </div>


  <div class="spacer"></div>


  <div
    id="headerAvatar"
    class="avatar"
    onclick="window.location.href='settings.html'"
  >
    N
  </div>

</header>


<!-- =========================
     TITLE
     ========================= -->

<section class="pageTitle">

  <h1>
    Subscriptions
  </h1>

  <p>
    Videos from channels you follow
  </p>

</section>


<!-- =========================
     CHANNEL
     ========================= -->

<div id="channelArea"></div>


<!-- =========================
     VIDEO FEED
     ========================= -->

<section class="feed">

  <div class="feedTitle">
    Latest videos
  </div>


  <div id="videos">

    Loading videos...

  </div>

</section>


<!-- =========================
     BOTTOM NAV
     ========================= -->

<div class="bottom">


  <button onclick="goHome()">

    <b>⌂</b>

    Home

  </button>


  <button onclick="goShorts()">

    <b>▶</b>

    Shorts

  </button>


  <button onclick="goHome()">

    <b>＋</b>

    Create

  </button>


  <button class="active">

    <b>□</b>

    Subscriptions

  </button>


  <button onclick="goYou()">

    <b>●</b>

    You

  </button>


</div>


<script>


/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   AUTH STORAGE
   ===================================== */

const USER_KEY =
  "minitube_user";


const ACCESS_TOKEN_KEY =
  "minitube_access_token";


/* =====================================
   SUBSCRIBE STORAGE
   ===================================== */

const SUBSCRIBE_KEY =
  "minitube_my_channel_subscribed";


/* =====================================
   GET USER
   ===================================== */

function getUser(){

  try{

    const raw =
      localStorage.getItem(
        USER_KEY
      );

    if(!raw){

      return null;

    }

    return JSON.parse(raw);

  }catch(error){

    console.error(
      "User data error:",
      error
    );

    return null;

  }

}


/* =====================================
   USER NAME
   ===================================== */

function getUserName(){

  const user =
    getUser();


  if(!user){

    return "User";

  }


  const metadata =
    user.user_metadata || {};


  return (

    metadata.display_name ||

    metadata.full_name ||

    metadata.name ||

    user.email ||

    "User"

  );

}


/* =====================================
   USER EMAIL
   ===================================== */

function getUserEmail(){

  const user =
    getUser();


  if(
    user &&
    user.email
  ){

    return user.email;

  }


  return "";

}


/* =====================================
   AVATAR INITIAL
   ===================================== */

function getInitial(){

  const name =
    getUserName();


  const clean =
    String(name)
      .trim();


  if(!clean){

    return "N";

  }


  return clean
    .charAt(0)
    .toUpperCase();

}


/* =====================================
   HANDLE
   ===================================== */

function getHandle(){

  const name =
    getUserName();


  let handle =
    String(name)
      .toLowerCase()
      .trim();


  handle =
    handle.replace(
      /[^a-z0-9]+/g,
      ""
    );


  if(!handle){

    const email =
      getUserEmail();


    handle =
      email
        .split("@")[0]
        .replace(
          /[^a-z0-9]/g,
          ""
        );

  }


  return "@" + (
    handle || "user"
  );

}


/* =====================================
   CHECK LOGIN
   ===================================== */

function checkLogin(){

  const user =
    getUser();


  const token =
    localStorage.getItem(
      ACCESS_TOKEN_KEY
    );


  if(
    !user ||
    !token
  ){

    window.location.href =
      "login.html";

    return false;

  }


  return true;

}


/* =====================================
   UPDATE HEADER
   ===================================== */

function updateHeader(){

  const avatar =
    document.getElementById(
      "headerAvatar"
    );


  const initial =
    getInitial();


  avatar.textContent =
    initial;

}


/* =====================================
   SUBSCRIBE STATUS
   ===================================== */

function isSubscribed(){

  return localStorage.getItem(
    SUBSCRIBE_KEY
  ) === "true";

}


/* =====================================
   UNSUBSCRIBE
   ===================================== */

function unsubscribe(){

  localStorage.setItem(
    SUBSCRIBE_KEY,
    "false"
  );


  renderPage();

}


/* =====================================
   CHANNEL
   ===================================== */

function renderChannel(){

  const area =
    document.getElementById(
      "channelArea"
    );


  const name =
    getUserName();


  const handle =
    getHandle();


  const initial =
    getInitial();


  if(!isSubscribed()){

    area.innerHTML = `

      <div class="channelBox">

        <div class="channelAvatar">

          ${escapeHTML(
            initial
          )}

        </div>


        <div class="channelInfo">

          <div class="channelName">

            ${escapeHTML(
              name
            )}

          </div>


          <div class="channelStatus">

            ${escapeHTML(
              handle
            )}

            &nbsp; • &nbsp;

            You're not subscribed

          </div>

        </div>

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="channelBox">

      <div class="channelAvatar">

        ${escapeHTML(
          initial
        )}

      </div>


      <div class="channelInfo">

        <div class="channelName">

          ${escapeHTML(
            name
          )}

        </div>


        <div class="channelStatus">

          ${escapeHTML(
            handle
          )}

          &nbsp; • &nbsp;

          Subscribed

        </div>

      </div>


      <button
        class="unsubscribe"
        onclick="unsubscribe()"
      >

        Subscribed

      </button>

    </div>

  `;

}


/* =====================================
   LOAD VIDEOS
   ===================================== */

async function loadVideos(){

  const container =
    document.getElementById(
      "videos"
    );


  if(!isSubscribed()){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          🔔
        </div>


        <h2>
          Subscribe to ${escapeHTML(
            getUserName()
          )}
        </h2>


        <p>

          Subscribe to see the latest
          videos from this channel here.

        </p>


        <button
          class="homeBtn"
          onclick="goHome()"
        >

          Explore videos

        </button>

      </div>

    `;

    return;

  }


  container.innerHTML =
    "Loading videos...";


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/videos"
      );


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    const videos =
      await response.json();


    renderVideos(
      videos
    );


  }catch(error){

    console.error(error);


    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⚠️
        </div>


        <h2>
          Couldn't load videos
        </h2>


        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* =====================================
   DISPLAY VIDEOS
   ===================================== */

function renderVideos(
  videos
){

  const container =
    document.getElementById(
      "videos"
    );


  if(
    !Array.isArray(videos) ||
    videos.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          📺
        </div>


        <h2>
          No videos yet
        </h2>


        <p>

          This channel hasn't uploaded
          any videos yet.

        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    "";


  videos.forEach(
    video => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const videoURL =
        API_BASE +
        "/video/" +
        encodeURIComponent(
          video.name
        );


      card.innerHTML = `

        <video
          preload="metadata"
          muted
          src="${videoURL}"
        ></video>


        <div class="info">

          <div class="title">

            ${escapeHTML(
              video.name
            )}

          </div>


          <div class="meta">

            ${escapeHTML(
              getUserName()
            )}

          </div>


          <button
            class="watchButton"
          >

            ▶ Watch

          </button>

        </div>

      `;


      const videoElement =
        card.querySelector(
          "video"
        );


      const watchButton =
        card.querySelector(
          ".watchButton"
        );


      function openVideo(){

        window.location.href =
          "watch.html?video=" +
          encodeURIComponent(
            video.name
          );

      }


      videoElement.addEventListener(
        "click",
        openVideo
      );


      watchButton.addEventListener(
        "click",
        openVideo
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =====================================
   SECURITY
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   NAVIGATION
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


function goShorts(){

  window.location.href =
    "shorts.html";

}


function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   RENDER PAGE
   ===================================== */

function renderPage(){

  renderChannel();

  loadVideos();

}


/* =====================================
   START
   ===================================== */

if(
  checkLogin()
){

  updateHeader();

  renderPage();

}


</script>

</body>

</html>
