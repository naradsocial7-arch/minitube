<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Playlists - MiniTube</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
}

.backButton{
  background:#222;
  border:0;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

.headerTitle{
  flex:1;
  font-size:19px;
  font-weight:bold;
  word-break:break-word;
}

.headerButton{
  background:#292929;
  border:0;
  color:white;
  font-size:13px;
  font-weight:bold;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.headerButton.danger{
  color:#ff4964;
}


/* =========================
   NEW PLAYLIST BAR
   ========================= */

.newBar{
  display:flex;
  gap:10px;
  padding:16px 22px 0;
}

.newBar input{
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:22px;
  padding:12px 17px;
  color:white;
  font-size:15px;
  outline:none;
}

.newBar button{
  background:#ff0033;
  border:0;
  color:white;
  border-radius:22px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}


/* =========================
   PLAYLIST LIST
   ========================= */

.status{
  text-align:center;
  color:#aaa;
  padding:40px 22px;
}

.playlistRow{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 22px;
  cursor:pointer;
}

.playlistRow:hover{
  background:#161616;
}

.playlistThumb{
  width:120px;
  aspect-ratio:16/9;
  border-radius:10px;
  background:#181818;
  object-fit:cover;
  flex-shrink:0;
  position:relative;
}

.playlistThumbEmpty{
  width:120px;
  aspect-ratio:16/9;
  border-radius:10px;
  background:#181818;
  flex-shrink:0;
  display:grid;
  place-items:center;
  color:#555;
  font-size:26px;
}

.playlistRowInfo{
  flex:1;
  min-width:0;
}

.playlistRowName{
  font-size:16px;
  font-weight:bold;
  word-break:break-word;
}

.playlistRowMeta{
  color:#999;
  font-size:13px;
  margin-top:5px;
}

.playlistRowMenu{
  background:none;
  border:0;
  color:#777;
  font-size:20px;
  cursor:pointer;
  padding:6px 10px;
  flex-shrink:0;
}


/* =========================
   DETAIL VIEW
   ========================= */

.detailVideoRow{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 22px;
  cursor:pointer;
}

.detailVideoRow:hover{
  background:#161616;
}

.detailThumb{
  width:130px;
  aspect-ratio:16/9;
  border-radius:10px;
  background:#181818;
  object-fit:cover;
  flex-shrink:0;
}

.detailInfo{
  flex:1;
  min-width:0;
}

.detailTitle{
  font-size:15px;
  font-weight:bold;
  word-break:break-word;
}

.detailMeta{
  color:#999;
  font-size:13px;
  margin-top:5px;
}

.detailRemove{
  background:none;
  border:0;
  color:#777;
  font-size:22px;
  cursor:pointer;
  padding:6px 10px;
  flex-shrink:0;
}

.detailRemove:hover{
  color:#ff4964;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#151515;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

.bottom button b{
  display:block;
  font-size:22px;
  color:white;
  margin-bottom:3px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .newBar,
  .playlistRow,
  .detailVideoRow{
    padding-left:16px;
    padding-right:16px;
  }

  .playlistThumb,
  .playlistThumbEmpty{
    width:100px;
  }

  .detailThumb{
    width:100px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <div class="top">

    <button
      class="backButton"
      onclick="goBack()"
    >
      ←
    </button>

    <div
      id="headerTitle"
      class="headerTitle"
    >
      Playlists
    </div>

    <button
      id="deletePlaylistButton"
      class="headerButton danger"
      onclick="deleteCurrentPlaylist()"
      style="display:none;"
    >
      Delete
    </button>

  </div>

</header>


<!-- =========================
     NEW PLAYLIST (list view only)
     ========================= -->

<div
  id="newBar"
  class="newBar"
>

  <input
    id="newPlaylistName"
    placeholder="New playlist name"
    onkeydown="if(event.key==='Enter'){createPlaylist();}"
  >

  <button onclick="createPlaylist()">
    Create
  </button>

</div>


<div
  id="status"
  class="status"
></div>

<div id="content"></div>


<!-- =========================
     BOTTOM NAVIGATION
     ========================= -->

<div class="bottom">

  <button onclick="goHome()">
    <b>⌂</b>
    Home
  </button>


  <button onclick="goShorts()">
    <b>▶</b>
    Shorts
  </button>


  <button onclick="goHome()">
    <b>＋</b>
    Create
  </button>


  <button onclick="goSubscriptions()">
    <b>□</b>
    Subscriptions
  </button>


  <button onclick="goYou()">
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   PLAYLIST STORAGE
   (same key watch.html writes to)
   ===================================== */

const PLAYLIST_KEY =
  "minitube_playlists";


function getPlaylists(){

  try{

    const saved =
      localStorage.getItem(
        PLAYLIST_KEY
      );

    const list =
      saved
        ? JSON.parse(saved)
        : [];


    if(
      !list.some(
        p => p.id === "watch-later"
      )
    ){

      list.unshift({
        id: "watch-later",
        name: "Watch Later",
        builtIn: true,
        createdAt: Date.now(),
        videoNames: []
      });

    }


    return list;

  }catch(error){

    return [
      {
        id: "watch-later",
        name: "Watch Later",
        builtIn: true,
        createdAt: Date.now(),
        videoNames: []
      }
    ];

  }

}


function savePlaylists(list){

  localStorage.setItem(
    PLAYLIST_KEY,
    JSON.stringify(list)
  );

}


function createPlaylist(){

  const input =
    document.getElementById(
      "newPlaylistName"
    );

  const name =
    input.value.trim();


  if(!name){

    return;

  }


  const playlists =
    getPlaylists();


  playlists.push({
    id: "pl_" + Date.now(),
    name: name,
    builtIn: false,
    createdAt: Date.now(),
    videoNames: []
  });


  savePlaylists(
    playlists
  );


  input.value =
    "";


  render();

}


function deletePlaylist(id){

  const confirmed =
    confirm(
      "Delete this playlist? The videos themselves won't be deleted."
    );


  if(!confirmed){

    return;

  }


  let playlists =
    getPlaylists();


  playlists =
    playlists.filter(
      p => p.id !== id
    );


  savePlaylists(
    playlists
  );


  window.location.href =
    "playlist.html";

}


function deleteCurrentPlaylist(){

  const id =
    getPlaylistIdFromURL();


  if(!id){

    return;

  }


  deletePlaylist(
    id
  );

}


function removeVideoFromPlaylist(playlistId, videoName){

  const playlists =
    getPlaylists();


  const playlist =
    playlists.find(
      p => p.id === playlistId
    );


  if(!playlist){

    return;

  }


  playlist.videoNames =
    playlist.videoNames.filter(
      name => name !== videoName
    );


  savePlaylists(
    playlists
  );


  render();

}


/* =====================================
   ROUTING (list vs detail)
   ===================================== */

function getPlaylistIdFromURL(){

  return new URLSearchParams(
    window.location.search
  ).get("id");

}


function render(){

  const id =
    getPlaylistIdFromURL();


  if(id){

    renderDetail(
      id
    );

  }else{

    renderList();

  }

}


/* =====================================
   LIST VIEW
   ===================================== */

function renderList(){

  document.getElementById(
    "headerTitle"
  ).textContent =
    "Playlists";


  document.getElementById(
    "deletePlaylistButton"
  ).style.display =
    "none";


  document.getElementById(
    "newBar"
  ).style.display =
    "flex";


  const status =
    document.getElementById(
      "status"
    );

  const content =
    document.getElementById(
      "content"
    );


  const playlists =
    getPlaylists();


  content.innerHTML =
    "";


  if(playlists.length === 0){

    status.textContent =
      "No playlists yet.";

    return;

  }


  status.textContent =
    "";


  playlists.forEach(playlist => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "playlistRow";


    const firstVideo =
      playlist.videoNames[0];


    const thumbHTML =
      firstVideo
        ? `<video class="playlistThumb" preload="metadata" muted src="${
            API_BASE +
            "/video/" +
            encodeURIComponent(firstVideo)
          }"></video>`
        : `<div class="playlistThumbEmpty">▶</div>`;


    row.innerHTML = `

      ${thumbHTML}

      <div class="playlistRowInfo">

        <div class="playlistRowName">
          ${escapeHTML(playlist.name)}
        </div>

        <div class="playlistRowMeta">
          ${playlist.videoNames.length} video${
            playlist.videoNames.length === 1 ? "" : "s"
          }
        </div>

      </div>

    `;


    row.addEventListener(
      "click",
      function(){

        window.location.href =
          "playlist.html?id=" +
          encodeURIComponent(
            playlist.id
          );

      }
    );


    content.appendChild(
      row
    );

  });

}


/* =====================================
   DETAIL VIEW
   ===================================== */

function renderDetail(id){

  const playlists =
    getPlaylists();

  const playlist =
    playlists.find(
      p => p.id === id
    );


  const status =
    document.getElementById(
      "status"
    );

  const content =
    document.getElementById(
      "content"
    );


  document.getElementById(
    "newBar"
  ).style.display =
    "none";


  if(!playlist){

    document.getElementById(
      "headerTitle"
    ).textContent =
      "Playlist not found";

    status.textContent =
      "This playlist doesn't exist anymore.";

    content.innerHTML =
      "";

    return;

  }


  document.getElementById(
    "headerTitle"
  ).textContent =
    playlist.name;


  if(!playlist.builtIn){

    document.getElementById(
      "deletePlaylistButton"
    ).style.display =
      "block";

  }


  content.innerHTML =
    "";


  if(playlist.videoNames.length === 0){

    status.innerHTML =
      "No videos in this playlist yet.<br><br>" +
      "Open a video and tap <b>Save</b> to add it here.";

    return;

  }


  status.textContent =
    "";


  playlist.videoNames.forEach(name => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "detailVideoRow";


    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        name
      );


    row.innerHTML = `

      <video
        class="detailThumb"
        preload="metadata"
        muted
        src="${videoURL}"
      ></video>

      <div class="detailInfo">

        <div class="detailTitle">
          ${escapeHTML(name)}
        </div>

        <div class="detailMeta">
          Tap to watch
        </div>

      </div>

      <button class="detailRemove">
        ×
      </button>

    `;


    row.querySelector(
      ".detailThumb"
    ).addEventListener(
      "click",
      function(){

        openWatch(
          name
        );

      }
    );


    row.querySelector(
      ".detailInfo"
    ).addEventListener(
      "click",
      function(){

        openWatch(
          name
        );

      }
    );


    row.querySelector(
      ".detailRemove"
    ).addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        removeVideoFromPlaylist(
          playlist.id,
          name
        );

      }
    );


    content.appendChild(
      row
    );

  });

}


/* =====================================
   NAVIGATION
   ===================================== */

function openWatch(videoName){

  window.location.href =
    "watch.html?video=" +
    encodeURIComponent(
      videoName
    );

}


function goBack(){

  const id =
    getPlaylistIdFromURL();


  if(id){

    window.location.href =
      "playlist.html";

    return;

  }


  if(
    window.history.length > 1
  ){

    window.history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


function goHome(){

  window.location.href =
    "index.html";

}


function goShorts(){

  window.location.href =
    "shorts.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   HELPERS
   ===================================== */

function escapeHTML(text){

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   INIT
   ===================================== */

render();

</script>

</body>
  </html>
