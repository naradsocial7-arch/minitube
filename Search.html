<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Search - MiniTube</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #292929;
  padding:12px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.backButton{
  background:#222;
  border:0;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

.searchBox{
  flex:1;
  display:flex;
  align-items:center;
  background:#222;
  border:1px solid #444;
  border-radius:30px;
  padding:0 8px 0 17px;
}

.searchBox input{
  flex:1;
  background:none;
  border:0;
  outline:none;
  color:white;
  font-size:16px;
  padding:13px 0;
}

.clearButton{
  background:none;
  border:0;
  color:#999;
  font-size:20px;
  cursor:pointer;
  padding:6px 10px;
  display:none;
}

.clearButton.show{
  display:block;
}


/* =========================
   RECENT SEARCHES
   ========================= */

.section{
  padding:18px 22px 0;
}

.sectionTitle{
  color:#999;
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.clearAll{
  background:none;
  border:0;
  color:#6ab0f3;
  font-size:13px;
  cursor:pointer;
}

.recentItem{
  display:flex;
  align-items:center;
  gap:14px;
  padding:11px 0;
  cursor:pointer;
}

.recentIcon{
  color:#999;
  font-size:17px;
  width:20px;
  text-align:center;
  flex-shrink:0;
}

.recentText{
  flex:1;
  font-size:15px;
  word-break:break-word;
}

.removeRecent{
  background:none;
  border:0;
  color:#777;
  font-size:18px;
  cursor:pointer;
  padding:4px 8px;
}


/* =========================
   RESULTS
   ========================= */

.status{
  text-align:center;
  color:#aaa;
  padding:24px;
}

.resultCount{
  padding:16px 22px 0;
  color:#999;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(260px,1fr)
  );
  gap:18px;
  padding:14px 22px;
}

.card{
  background:#181818;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.cardVideo{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
  object-fit:cover;
}

.card:hover .cardVideo{
  opacity:.92;
}

.info{
  padding:12px;
}

.title{
  font-size:16px;
  font-weight:bold;
  word-break:break-word;
}

.title mark{
  background:#ff0033;
  color:white;
  border-radius:3px;
  padding:0 2px;
}

.meta{
  color:#999;
  font-size:13px;
  margin-top:7px;
}


/* =========================
   BOTTOM NAV
   ========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#151515;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
}

.bottom button b{
  display:block;
  font-size:22px;
  color:white;
  margin-bottom:3px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
    padding:14px 16px;
  }

  .section{
    padding:16px 16px 0;
  }

  .resultCount{
    padding:16px 16px 0;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <div class="top">

    <button
      class="backButton"
      onclick="goBack()"
    >
      ←
    </button>

    <div class="searchBox">

      <input
        id="search"
        placeholder="Search videos..."
        oninput="onSearchInput()"
        onkeydown="onSearchKeydown(event)"
        autofocus
      >

      <button
        id="clearButton"
        class="clearButton"
        onclick="clearSearch()"
      >
        ×
      </button>

    </div>

  </div>

</header>


<!-- =========================
     RECENT SEARCHES
     ========================= -->

<div
  id="recentSection"
  class="section"
>

  <div class="sectionTitle">

    <span>
      Recent searches
    </span>

    <button
      class="clearAll"
      onclick="clearRecentSearches()"
    >
      Clear all
    </button>

  </div>

  <div id="recentList"></div>

</div>


<!-- =========================
     RESULTS
     ========================= -->

<div
  id="resultCount"
  class="resultCount"
></div>

<div
  id="status"
  class="status"
></div>

<div
  id="videos"
  class="grid"
></div>


<!-- =========================
     BOTTOM NAVIGATION
     ========================= -->

<div class="bottom">

  <button onclick="goHome()">
    <b>⌂</b>
    Home
  </button>


  <button onclick="goShorts()">
    <b>▶</b>
    Shorts
  </button>


  <button onclick="goHome()">
    <b>＋</b>
    Create
  </button>


  <button onclick="goSubscriptions()">
    <b>□</b>
    Subscriptions
  </button>


  <button onclick="goYou()">
    <b>●</b>
    You
  </button>

</div>


<script>

/* =====================================
   CLOUDFLARE WORKER
   ===================================== */

const API_BASE =
  "https://wispy-base-65bb.naradsocial7.workers.dev";


/* =====================================
   RECENT SEARCHES STORAGE
   ===================================== */

const RECENT_KEY =
  "minitube_recent_searches";

const MAX_RECENT =
  8;


function getRecentSearches(){

  try{

    const saved =
      localStorage.getItem(
        RECENT_KEY
      );

    return saved
      ? JSON.parse(saved)
      : [];

  }catch(error){

    return [];

  }

}


function saveRecentSearch(term){

  const trimmed =
    term.trim();


  if(!trimmed){

    return;

  }


  let list =
    getRecentSearches();


  list =
    list.filter(
      item =>
        item.toLowerCase() !==
        trimmed.toLowerCase()
    );


  list.unshift(
    trimmed
  );


  list =
    list.slice(
      0,
      MAX_RECENT
    );


  localStorage.setItem(
    RECENT_KEY,
    JSON.stringify(list)
  );

}


function removeRecentSearch(term){

  let list =
    getRecentSearches();


  list =
    list.filter(
      item => item !== term
    );


  localStorage.setItem(
    RECENT_KEY,
    JSON.stringify(list)
  );


  renderRecentSearches();

}


function clearRecentSearches(){

  localStorage.removeItem(
    RECENT_KEY
  );


  renderRecentSearches();

}


function renderRecentSearches(){

  const section =
    document.getElementById(
      "recentSection"
    );

  const list =
    document.getElementById(
      "recentList"
    );


  const searches =
    getRecentSearches();


  if(searches.length === 0){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  list.innerHTML =
    "";


  searches.forEach(term => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "recentItem";


    row.innerHTML = `

      <div class="recentIcon">
        🕐
      </div>

      <div class="recentText">
        ${escapeHTML(term)}
      </div>

      <button class="removeRecent">
        ×
      </button>

    `;


    row.querySelector(
      ".recentText"
    ).addEventListener(
      "click",
      function(){

        const input =
          document.getElementById(
            "search"
          );

        input.value =
          term;

        runSearch(
          term,
          true
        );

      }
    );


    row.querySelector(
      ".removeRecent"
    ).addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        removeRecentSearch(
          term
        );

      }
    );


    list.appendChild(
      row
    );

  });

}


/* =====================================
   SEARCH INPUT HANDLING
   ===================================== */

let allVideos = [];

let videosLoaded =
  false;


function onSearchInput(){

  const input =
    document.getElementById(
      "search"
    );

  const clearButton =
    document.getElementById(
      "clearButton"
    );


  clearButton.classList.toggle(
    "show",
    input.value.length > 0
  );


  runSearch(
    input.value,
    false
  );

}


function onSearchKeydown(event){

  if(event.key === "Enter"){

    const input =
      document.getElementById(
        "search"
      );

    runSearch(
      input.value,
      true
    );

    input.blur();

  }

}


function clearSearch(){

  const input =
    document.getElementById(
      "search"
    );

  input.value =
    "";

  document
    .getElementById(
      "clearButton"
    )
    .classList.remove(
      "show"
    );

  runSearch(
    "",
    false
  );

  input.focus();

}


async function runSearch(term, remember){

  const trimmed =
    term.trim();


  const recentSection =
    document.getElementById(
      "recentSection"
    );

  const resultCount =
    document.getElementById(
      "resultCount"
    );

  const status =
    document.getElementById(
      "status"
    );

  const grid =
    document.getElementById(
      "videos"
    );


  if(!trimmed){

    grid.innerHTML =
      "";

    status.textContent =
      "";

    resultCount.textContent =
      "";

    renderRecentSearches();

    return;

  }


  recentSection.style.display =
    "none";


  if(!videosLoaded){

    status.textContent =
      "Loading videos...";

    grid.innerHTML =
      "";

    resultCount.textContent =
      "";


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/videos"
        );


      if(!response.ok){

        throw new Error(
          "API error"
        );

      }


      allVideos =
        await response.json();

      videosLoaded =
        true;


    }catch(error){

      console.error(
        error
      );

      status.textContent =
        "Unable to load videos.";

      return;

    }

  }


  if(remember){

    saveRecentSearch(
      trimmed
    );

  }


  const matches =
    allVideos.filter(video =>
      video.name
        .toLowerCase()
        .includes(
          trimmed.toLowerCase()
        )
    );


  renderResults(
    matches,
    trimmed
  );

}


function renderResults(videos, term){

  const status =
    document.getElementById(
      "status"
    );

  const resultCount =
    document.getElementById(
      "resultCount"
    );

  const grid =
    document.getElementById(
      "videos"
    );


  grid.innerHTML =
    "";


  if(videos.length === 0){

    status.innerHTML =
      "No results for \"" +
      escapeHTML(term) +
      "\"";

    resultCount.textContent =
      "";

    return;

  }


  status.textContent =
    "";


  resultCount.textContent =
    videos.length +
    " result" +
    (videos.length === 1 ? "" : "s");


  videos.forEach(video => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card";


    const videoURL =
      API_BASE +
      "/video/" +
      encodeURIComponent(
        video.name
      );


    const viewsKey =
      "views_" +
      video.name;

    const views =
      Number(
        localStorage.getItem(
          viewsKey
        ) || 0
      );


    card.innerHTML = `

      <video
        class="cardVideo"
        preload="metadata"
        src="${videoURL}"
      ></video>


      <div class="info">

        <div class="title">
          ${highlightMatch(
            video.name,
            term
          )}
        </div>


        <div class="meta">
          ${formatNumber(views)} views
        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      function(){

        window.location.href =
          "watch.html?video=" +
          encodeURIComponent(
            video.name
          );

      }
    );


    grid.appendChild(
      card
    );

  });

}


function highlightMatch(name, term){

  const safeName =
    escapeHTML(name);

  const safeTerm =
    escapeHTML(term)
      .replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


  if(!safeTerm){

    return safeName;

  }


  const pattern =
    new RegExp(
      "(" + safeTerm + ")",
      "ig"
    );


  return safeName.replace(
    pattern,
    "<mark>$1</mark>"
  );

}


/* =====================================
   NAVIGATION
   ===================================== */

function goBack(){

  if(
    window.history.length > 1
  ){

    window.history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


function goHome(){

  window.location.href =
    "index.html";

}


function goShorts(){

  window.location.href =
    "shorts.html";

}


function goSubscriptions(){

  window.location.href =
    "subscriptions.html";

}


function goYou(){

  window.location.href =
    "you.html";

}


/* =====================================
   HELPERS
   ===================================== */

function formatNumber(num){

  if(num >= 1000000){

    return (
      (num / 1000000)
        .toFixed(1)
        .replace(/\.0$/, "")
      + "M"
    );

  }


  if(num >= 1000){

    return (
      (num / 1000)
        .toFixed(1)
        .replace(/\.0$/, "")
      + "K"
    );

  }


  return String(num);

}


function escapeHTML(text){

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   INIT
   ===================================== */

renderRecentSearches();


/*
  If page opened as
  search.html?q=something
  (e.g. from index.html search bar),
  run that search immediately.
*/

const initialQuery =
  new URLSearchParams(
    window.location.search
  ).get("q");


if(initialQuery){

  document.getElementById(
    "search"
  ).value =
    initialQuery;

  document
    .getElementById(
      "clearButton"
    )
    .classList.add(
      "show"
    );

  runSearch(
    initialQuery,
    true
  );

}

</script>

</body>
  </html>
